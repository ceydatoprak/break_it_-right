<style>

      --ink-2:#c3ae97;

      --accent-2:#ffb457;

      --bad:#ff6a58;
      --shadow:0 18px 40px -18px rgba(0,0,0,.9);
      --chip:rgba(255,236,216,.09);
      --chip-line:rgba(255,236,216,.16);

  :root[data-theme="dark"]{

  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}

    margin:0;

    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{
    height:100dvh;height:100vh;
    display:grid;grid-template-rows:auto minmax(0,1fr);
    max-width:520px;margin-inline:auto;
    padding-inline:14px;
  }

  /* ---------------- top: objective only ---------------- */
  .hud{padding-block:12px 8px;display:flex;flex-direction:column;gap:9px}
  .hud-row{display:flex;align-items:center;gap:10px}
  .obj-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
  .mat-chip{
    flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:4px 9px;border-radius:8px;
    background:var(--chip);border:1px solid var(--chip-line);color:var(--ink-2);
  }
  .objective{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(16px,4.6vw,19px);line-height:1.15;
    letter-spacing:-.015em;text-wrap:balance;
  }
  .tools{display:flex;gap:6px;flex:none}
  .icon-btn{
    width:36px;height:36px;border-radius:11px;
    border:1px solid var(--chip-line);background:var(--chip);
    color:var(--ink-2);display:grid;place-items:center;cursor:pointer;
    transition:color .15s,transform .12s;
  }
  .icon-btn:active{transform:scale(.93)}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .icon-btn svg{width:17px;height:17px;display:block}

  .meta{display:flex;align-items:center;gap:12px}
  .ticks{display:flex;gap:4px;flex:1}
  .tick{height:3px;flex:1;border-radius:99px;background:var(--line)}
  .tick.done{background:var(--good)}
  .tick.now{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .hits{display:flex;gap:4px;align-items:center;flex:none}
  .hit-pip{
    width:13px;height:13px;border-radius:50%;
    border:1.5px solid var(--chip-line);background:transparent;
    transition:background .2s,border-color .2s;
  }
  .hit-pip.left{background:var(--ink-3);border-color:transparent}

  /* ---------------- stage ---------------- */
  #stage{position:relative;min-height:0;touch-action:none}
  #cv{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
  .tip{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:12px;font-weight:500;color:var(--ink-3);
    pointer-events:none;transition:opacity .3s;text-align:center;
    width:92%;
  }
  .tip.gone{opacity:0}

    position:absolute;left:50%;top:8px;width:min(330px,92%);

    border-radius:16px;padding:12px 15px 13px;box-shadow:var(--shadow);

    opacity:0;transform:translate(-50%,-10px) scale(.96);
    transition:opacity .3s ease,transform .3s cubic-bezier(.2,.9,.3,1);
  }

  .brief.gone{opacity:0;transform:translate(-50%,-16px) scale(.94)}
  .brief-tag{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
  .brief-obj{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance;
  }
  .brief-tip{margin:0;font-size:12.5px;line-height:1.42;color:var(--ink-2)}

  .sheet{

    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .24s;
  }
  .sheet.show{opacity:1;pointer-events:auto}
  .card{
    width:100%;max-width:492px;background:var(--card);
    border:1px solid var(--card-line);border-radius:22px 22px 0 0;
    box-shadow:var(--shadow);
    padding:20px 18px max(18px,env(safe-area-inset-bottom));

  .verdict h2{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1;letter-spacing:-.03em;

  .card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:46ch}
  .acts{display:flex;gap:9px;margin-top:3px}

    font-family:Figtree,sans-serif;font-weight:700;font-size:15px;

    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;

  }

    *{animation-duration:.001ms !important;transition-duration:.08s !important}
  }

  body{background:radial-gradient(ellipse at 20% 0%,#fff9ef,#e5d5c1);}
  #app{max-width:600px;height:100vh;height:100dvh;padding:0 20px 10px;}
  .brand{display:flex;align-items:center;gap:11px;padding:8px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .brand-mark{width:43px;height:43px;display:grid;place-items:center;background:#628a72;color:#fff9ec;border-radius:14px;font-size:35px;}
  .brand h1{margin:0;font-size:20px;letter-spacing:-.7px;font-weight:800;}
  .brand h1 i{font-style:normal;color:#cf794b;}
  .brand p{font-size:11px;color:var(--ink-2);margin:4px 0 0;}
  .edition{margin-left:auto;font-size:9px;letter-spacing:1.8px;line-height:1.7;color:var(--ink-3);text-align:right;}
  .icon-btn{width:44px;height:44px;border-radius:14px;}
  .objective{font-size:20px;}
  .tick{height:5px;}

  .brief-tag{color:#64846c;}

  #stage{border-radius:24px;overflow:hidden;background:#f0e3d2;box-shadow:0 10px 36px #5b3b1812;}

  @media(max-width:380px){#app{padding-inline:10px}.brand h1{font-size:17px}.edition{display:none}.objective{font-size:17px}.hud-row{gap:5px}.mat-chip{padding:4px 6px}.obj-wrap{gap:6px}}
  @media(max-height:600px){.brand{padding:0 0 5px;margin:0}.brand-mark{height:30px;width:30px;font-size:25px}.brand p,.edition{display:none}.hud{gap:4px}.brief{top:3px;padding:6px 10px}.brief-obj{display:none}.brief-tip{font-size:11px}.tip{font-size:10px;padding:5px}}
</style>

<script>
(function(){
'use strict';

/* ===================== world & math ===================== */
const W = 400, H = 620, TAU = Math.PI*2;
const TABLE_Y = 466;          /* table surface */
const TABLE_X0 = 34, TABLE_X1 = 366;   /* the slab has ends — things can go over them */

const dist  = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function polyArea(p){
  let a = 0;
  for(let i=0;i<p.length;i++){ const q = p[(i+1)%p.length]; a += p[i].x*q.y - q.x*p[i].y; }
  return a/2;
}
function polyCentroid(p){
  let a=0, cx=0, cy=0;
  for(let i=0;i<p.length;i++){
    const q = p[(i+1)%p.length];
    const cr = p[i].x*q.y - q.x*p[i].y;
    a += cr; cx += (p[i].x+q.x)*cr; cy += (p[i].y+q.y)*cr;
  }
  a /= 2;
  if(Math.abs(a) < 1e-9) return {x:p[0].x, y:p[0].y};
  return {x: cx/(6*a), y: cy/(6*a)};
}
function pointInPoly(pt, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const a = poly[i], b = poly[j];
    if((a.y > pt.y) !== (b.y > pt.y) &&
       pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y) + a.x) inside = !inside;
  }
  return inside;
}
function clipHP(poly, nx, ny, c){
  const out = [], n = poly.length;
  for(let i=0;i<n;i++){
    const A = poly[i], B = poly[(i+1)%n];
    const da = nx*A.x + ny*A.y - c, db = nx*B.x + ny*B.y - c;
    if(da <= 0) out.push(A);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      out.push({x: A.x + (B.x-A.x)*t, y: A.y + (B.y-A.y)*t});
    }
  }
  return out;
}
function segSeg(p1,p2,p3,p4){
  const d1 = (p4.x-p3.x)*(p1.y-p3.y) - (p4.y-p3.y)*(p1.x-p3.x);
  const d2 = (p4.x-p3.x)*(p2.y-p3.y) - (p4.y-p3.y)*(p2.x-p3.x);
  const d3 = (p2.x-p1.x)*(p3.y-p1.y) - (p2.y-p1.y)*(p3.x-p1.x);
  const d4 = (p2.x-p1.x)*(p4.y-p1.y) - (p2.y-p1.y)*(p4.x-p1.x);
  return ((d1>0) !== (d2>0)) && ((d3>0) !== (d4>0));
}
function polylineHitsSeg(pts, a, b){
  for(let i=1;i<pts.length;i++) if(segSeg(pts[i-1], pts[i], a, b)) return true;
  return false;
}
function distPtRect(p, r){
  const dx = Math.max(Math.abs(p.x - r.x) - r.w/2, 0);
  const dy = Math.max(Math.abs(p.y - r.y) - r.h/2, 0);
  return Math.hypot(dx, dy);
}
function distPolylineRect(pts, r){
  let m = Infinity;
  for(let i=1;i<pts.length;i++)
    for(let s=0;s<=4;s++){
      const t = s/4;
      m = Math.min(m, distPtRect({x:lerp(pts[i-1].x,pts[i].x,t), y:lerp(pts[i-1].y,pts[i].y,t)}, r));
    }
  return m;
}
function distPtSeg(p,a,b){
  const dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx + dy*dy;
  if(L2 < 1e-9) return dist(p,a);
  const t = clamp(((p.x-a.x)*dx + (p.y-a.y)*dy)/L2, 0, 1);
  return Math.hypot(p.x-(a.x+dx*t), p.y-(a.y+dy*t));
}
function polyLineLen(pts){
  let L = 0;
  for(let i=1;i<pts.length;i++) L += dist(pts[i-1], pts[i]);
  return L;
}
function distPolylinePt(pts, p){
  let m = Infinity;
  for(let i=1;i<pts.length;i++) m = Math.min(m, distPtSeg(p, pts[i-1], pts[i]));
  return m;
}
function resample(pts, step){
  if(pts.length < 2) return pts.slice();
  const out = [{x:pts[0].x, y:pts[0].y}];
  let carry = 0;
  for(let i=1;i<pts.length;i++){
    let A = {x:pts[i-1].x, y:pts[i-1].y};
    const B = pts[i];
    let d = dist(A,B);
    if(d < 1e-6) continue;
    let guard = 0;
    while(carry + d >= step && guard++ < 400){
      const t = (step - carry)/d;
      const p = {x: A.x + (B.x-A.x)*t, y: A.y + (B.y-A.y)*t};
      out.push(p); A = p; d = dist(A,B); carry = 0;
    }
    carry += d;
  }
  const lp = pts[pts.length-1];
  if(dist(out[out.length-1], lp) > step*0.3) out.push({x:lp.x, y:lp.y});
  return out;
}
function jagged(pts, amp, rnd){
  const r = resample(pts, 9);
  if(r.length < 3) return r;
  const out = [r[0]];
  for(let i=1;i<r.length-1;i++){
    const a = r[i-1], b = r[i+1];
    let dx = b.x-a.x, dy = b.y-a.y;
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const o = (rnd()*2-1)*amp;
    out.push({x: r[i].x - dy*o, y: r[i].y + dx*o});

  out.push(r[r.length-1]);
  return out;
}
function rayExit(p, d, poly){
  let best = Infinity;
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const ex = b.x-a.x, ey = b.y-a.y;
    const den = d.x*ey - d.y*ex;
    if(Math.abs(den) < 1e-9) continue;
    const t = ((a.x-p.x)*ey - (a.y-p.y)*ex) / den;
    const u = ((a.x-p.x)*d.y - (a.y-p.y)*d.x) / den;
    if(t > 0.01 && u >= -0.0001 && u <= 1.0001 && t < best) best = t;
  }
  if(!isFinite(best)) best = 300;
  return {x: p.x + d.x*(best+3), y: p.y + d.y*(best+3)};
}
const sub = (a,b)=>({x:a.x-b.x, y:a.y-b.y});
function norm(v){ const L = Math.hypot(v.x, v.y) || 1; return {x:v.x/L, y:v.y/L}; }
function bbox(poly){
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for(const p of poly){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  return {minX, minY, maxX, maxY};
}

/* ===================== shapes ===================== */
function circlePoly(cx,cy,r,n){
  const p = [];
  for(let i=0;i<n;i++){ const a = i/n*TAU; p.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}); }
  return p;
}
function roundRectPoly(cx,cy,w,h,rad){
  const p = [], hw = w/2, hh = h/2, seg = 6;
  const corners = [
    [cx+hw-rad, cy-hh+rad, -Math.PI/2, 0],
    [cx+hw-rad, cy+hh-rad, 0, Math.PI/2],
    [cx-hw+rad, cy+hh-rad, Math.PI/2, Math.PI],
    [cx-hw+rad, cy-hh+rad, Math.PI, Math.PI*1.5]
  ];

    for(let i=0;i<=seg;i++){
      const a = lerp(a0,a1,i/seg);
      p.push({x: ox+Math.cos(a)*rad, y: oy+Math.sin(a)*rad});
    }
  return p;
}
const JAR_PROFILE = [
  [0.00,0.34],[0.035,0.345],[0.075,0.30],[0.115,0.27],[0.155,0.265],
  [0.225,0.48],[0.305,0.74],[0.385,0.92],[0.47,0.995],[0.62,1.0],
  [0.76,0.985],[0.865,0.945],[0.95,0.90],[1.0,0.86]
];
function jarPoly(cx,cy,w,h){
  const hw = w/2, top = cy-h/2, right = [], left = [];
  for(const [ty,fx] of JAR_PROFILE){
    right.push({x: cx + hw*fx, y: top + h*ty});
    left.push({x: cx - hw*fx, y: top + h*ty});
  }
  return right.concat(left.reverse());
}
/* tapered cup / glass */
function cupPoly(cx,cy,w,h){
  const hw = w/2, top = cy-h/2, bot = cy+h/2, k = 0.78;
  return [
    {x:cx-hw, y:top}, {x:cx-hw*0.97, y:top+h*0.12},
    {x:cx-hw*k, y:bot-6}, {x:cx-hw*k+4, y:bot},
    {x:cx+hw*k-4, y:bot}, {x:cx+hw*k, y:bot-6},
    {x:cx+hw*0.97, y:top+h*0.12}, {x:cx+hw, y:top}
  ];
}

/* ===================== object build ===================== */
const snap = v => (Math.round(v*10)/10) + 0;
const vkey = p => p.x.toFixed(1) + ',' + p.y.toFixed(1);

function snapPoly(poly){
  const out = [];
  for(const p of poly){
    const q = {x: snap(p.x), y: snap(p.y)};
    const prev = out[out.length-1];
    if(prev && prev.x === q.x && prev.y === q.y) continue;
    out.push(q);
  }
  if(out.length > 2){
    const f = out[0], l = out[out.length-1];
    if(f.x === l.x && f.y === l.y) out.pop();
  }
  return out;
}
function seedGrid(poly, spacing, rnd, opts){
  opts = opts || {};
  const bb = bbox(poly);
  const xEnd = opts.mirrorX != null ? opts.mirrorX - spacing*0.42 : bb.maxX;
  const jit = spacing*0.42, out = [];
  let row = 0;
  for(let y = bb.minY + spacing*0.35; y <= bb.maxY; y += spacing*0.88, row++){
    const off = (row % 2) ? spacing*0.5 : 0;
    for(let x = bb.minX + spacing*0.3 + off; x <= xEnd; x += spacing){
      const p = {x: x + (rnd()*2-1)*jit, y: y + (rnd()*2-1)*jit};
      if(opts.mirrorX != null && p.x > opts.mirrorX - 5) continue;
      if(pointInPoly(p, poly)) out.push(p);
    }
  }
  if(opts.mirrorX != null){
    const m = opts.mirrorX, n = out.length;
    for(let i=0;i<n;i++) out.push({x: 2*m - out[i].x, y: out[i].y});
  }
  return out;
}
function makeShards(poly, seeds){
  const cells = [];
  for(let i=0;i<seeds.length;i++){
    let c = poly;
    const si = seeds[i];
    for(let j=0;j<seeds.length;j++){
      if(i === j) continue;
      const sj = seeds[j];
      const nx = sj.x - si.x, ny = sj.y - si.y;
      const cc = (sj.x*sj.x + sj.y*sj.y - si.x*si.x - si.y*si.y)/2;
      c = clipHP(c, nx, ny, cc);
      if(c.length < 3) break;
    }
    if(c.length < 3) continue;
    c = snapPoly(c);
    if(c.length < 3) continue;
    if(polyArea(c) < 0) c.reverse();
    if(polyArea(c) < 8) continue;
    cells.push(c);
  }
  return cells;
}

function buildObj(spec){
  const mat = MAT[spec.mat];
  const o = {
    spec, mat, name:spec.name || '',
    poly: spec.poly(), weakLines: [], struck:false, cracked:false
  };
  const rnd = mulberry32(spec.seed);
  const spacing = (spec.spacing || 30) * mat.shard;
  const seeds = seedGrid(o.poly, spacing, rnd, spec.mirrorX != null ? {mirrorX:spec.mirrorX} : {});
  o.shards = makeShards(o.poly, seeds);
  o.shardMid = o.shards.map(polyCentroid);

  const map = new Map();
  o.shardWall = o.shards.map(s => new Array(s.length).fill(-1));
  o.totalArea = 0;
  o.shards.forEach((s, si)=>{
    o.totalArea += Math.abs(polyArea(s));
    for(let e=0;e<s.length;e++){
      const a = s[e], b = s[(e+1)%s.length];
      const ka = vkey(a), kb = vkey(b);
      const key = ka < kb ? ka + '|' + kb : kb + '|' + ka;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push({si, e, a, b});
    }
  });
  o.walls = [];
  map.forEach(list=>{
    if(list.length !== 2) return;
    const [p, q] = list;
    if(p.si === q.si) return;
    const wi = o.walls.length;
    o.walls.push({
      a:p.a, b:p.b, s1:p.si, s2:q.si,
      mid:{x:(p.a.x+p.b.x)/2, y:(p.a.y+p.b.y)/2},
      strength: mat.strength * (0.84 + 0.32*rnd()),
      weak:false, broken:false
    });
    o.shardWall[p.si][p.e] = wi;
    o.shardWall[q.si][q.e] = wi;
  });

  /* grain / built-in weak seams (wood planks, factory seam) */
  if(spec.grain) spec.grain.forEach(line=>{
    o.walls.forEach(w=>{ if(distPolylinePt(line, w.mid) < 11) w.strength *= 0.30; });
  });
  if(spec.seamX != null){
    o.walls.forEach(w=>{
      if(Math.abs(w.a.x - spec.seamX) < 0.16 && Math.abs(w.b.x - spec.seamX) < 0.16) w.strength *= 0.22;
    });
  }

  /* art layer over the object's own box */
  const bb = bbox(o.poly), pad = 10, AS = 2;
  o.ax = bb.minX - pad; o.ay = bb.minY - pad;
  o.aw = (bb.maxX - bb.minX) + pad*2; o.ah = (bb.maxY - bb.minY) + pad*2;
  o.art = document.createElement('canvas');
  o.art.width = Math.ceil(o.aw*AS); o.art.height = Math.ceil(o.ah*AS);
  o.actx = o.art.getContext('2d');
  paintObjArt(o);

  o.pieces = buildPieces(o);
  o.pieces.forEach(p=>{ p.rest = true; });
  o.chainLock = 0;
  o.centerCache = polyCentroid(o.poly);
  o.radCache = 0;
  o.poly.forEach(p=>{ o.radCache = Math.max(o.radCache, dist(p, o.centerCache)); });
  return o;
}
function paintObjArt(o){
  const AS = 2, c = o.actx;
  c.setTransform(AS, 0, 0, AS, -o.ax*AS, -o.ay*AS);
  c.clearRect(o.ax, o.ay, o.aw, o.ah);
  o.spec.art(c, o);
}

function buildPieces(o){
  const n = o.shards.length;
  const parent = new Array(n);
  for(let i=0;i<n;i++) parent[i] = i;
  const find = x => { while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const uni = (a,b)=>{ a = find(a); b = find(b); if(a !== b) parent[a] = b; };
  o.walls.forEach(w=>{ if(!w.broken) uni(w.s1, w.s2); });

  const groups = new Map();
  for(let i=0;i<n;i++){
    const r = find(i);
    if(!groups.has(r)) groups.set(r, []);
    groups.get(r).push(i);
  }
  const prev = o.pieces || [];
  const out = [];
  groups.forEach(idxs=>{
    const inPiece = new Set(idxs);
    const dirEdges = [], breakSegs = [], crackSegs = [];
    let area = 0, ax = 0, ay = 0;
    idxs.forEach(si=>{
      const sp = o.shards[si];
      const a = Math.abs(polyArea(sp)), ct = o.shardMid[si];
      area += a; ax += ct.x*a; ay += ct.y*a;
      for(let e=0;e<sp.length;e++){
        const A = sp[e], B = sp[(e+1)%sp.length];
        const wi = o.shardWall[si][e];
        if(wi >= 0){
          const w = o.walls[wi];
          const other = w.s1 === si ? w.s2 : w.s1;
          if(inPiece.has(other)){
            if(w.broken && si < other) crackSegs.push([A,B]);
            continue;
          }
        }
        dirEdges.push({a:A, b:B});
        if(wi >= 0) breakSegs.push([A,B]);
      }
    });
    const cx = ax/area, cy = ay/area;
    const loops = traceLoops(dirEdges);
    const path = new Path2D();
    let low = 0, high = 0, rad = 0;
    const src = loops.length ? loops : idxs.map(i=>o.shards[i]);
    src.forEach(loop=>{
      path.moveTo(loop[0].x, loop[0].y);
      for(let i=1;i<loop.length;i++) path.lineTo(loop[i].x, loop[i].y);
      path.closePath();
      loop.forEach(p=>{
        low = Math.max(low, p.y - cy);
        high = Math.max(high, cy - p.y);
        rad = Math.max(rad, Math.hypot(p.x-cx, p.y-cy));
      });
    });
    /* carry motion across a re-split so a second hit doesn't teleport things */
    let ox=0, oy=0, vx=0, vy=0, ang=0, av=0, rest=false;
    for(const q of prev){
      if(q.shards.indexOf(idxs[0]) >= 0){
        ox=q.ox; oy=q.oy; vx=q.vx; vy=q.vy; ang=q.ang; av=q.av; rest=q.rest; break;
      }
    }
    out.push({shards:idxs, area, cx, cy, low, high, rad, path, breakSegs, crackSegs,
              ox, oy, vx, vy, ang, av, scl:1, rest});
  });
  return out;
}
function traceLoops(edges){
  const byStart = new Map();
  edges.forEach((e,i)=>{
    const k = vkey(e.a);
    if(!byStart.has(k)) byStart.set(k, []);
    byStart.get(k).push(i);
  });
  const used = new Array(edges.length).fill(false);
  const loops = [];
  for(let i=0;i<edges.length;i++){
    if(used[i]) continue;
    const loop = [];
    let cur = i, guard = 0;
    while(cur != null && !used[cur] && guard++ < 4000){
      used[cur] = true;
      loop.push(edges[cur].a);
      const cand = byStart.get(vkey(edges[cur].b));
      let nxt = null;
      if(cand) for(const c of cand){ if(!used[c]){ nxt = c; break; } }
      cur = nxt;
    }
    if(loop.length >= 3) loops.push(loop);
  }
  return loops;
}

/* ===================== the strike ===================== */
/* A hit does two things: it crushes shards around the contact point, and it
   starts a crack that RUNS through the object. How far that crack travels is
   what decides a chip from a clean split. Position, angle and power all feed in. */
function trimLine(line, pt, budget){
  let bi = 0, bd = Infinity;
  line.forEach((p,i)=>{ const d = dist(p, pt); if(d < bd){ bd = d; bi = i; } });
  let a = bi, b = bi, accA = 0, accB = 0;
  while(a > 0 && accA < budget){ accA += dist(line[a], line[a-1]); a--; }
  while(b < line.length-1 && accB < budget){ accB += dist(line[b], line[b+1]); b++; }
  return line.slice(a, b+1);
}
function segPoint(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d) < 1e-9) return {x:p2.x, y:p2.y};
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x))/d;
  return {x: p1.x + (p2.x-p1.x)*t, y: p1.y + (p2.y-p1.y)*t};
}
function firstCrossing(A, B){
  for(let i=1;i<A.length;i++)
    for(let j=1;j<B.length;j++)
      if(segSeg(A[i-1], A[i], B[j-1], B[j]))
        return {i, p: segPoint(A[i-1], A[i], B[j-1], B[j])};
  return null;
}
function crackPath(o, pt, dir, power){
  const mat = o.mat;
  const runLen = mat.run * power;

  /* a blow landing right on a prepared line is carried by it from the start */
  let best = null, bd = Infinity;
  o.weakLines.forEach(L=>{ const d = distPolylinePt(L, pt); if(d < bd){ bd = d; best = L; } });
  if(best && bd < 30 + 42*power) return {paths:[trimLine(best, pt, runLen*0.9)], weak:true};

  /* otherwise the crack runs along the line of the blow */
  const fwd = rayExit(pt, dir, o.poly);
  const bwd = rayExit(pt, {x:-dir.x, y:-dir.y}, o.poly);
  const fL = Math.min(dist(pt, fwd), runLen);
  const bL = Math.min(dist(pt, bwd), runLen*0.42);
  const rnd = mulberry32(((pt.x*31 + pt.y*17)|0) ^ 0x5bf0);
  const nx = -dir.y, ny = dir.x, steps = 14, pts = [];
  for(let i=-steps;i<=steps;i++){
    const t = i/steps;
    const L = t < 0 ? bL*t : fL*t;
    const wob = (Math.sin(t*4.1)*6*(0.4+power) + (rnd()*2-1)*2.4) * Math.abs(t);
    pts.push({x: pt.x + dir.x*L + nx*wob, y: pt.y + dir.y*L + ny*wob});
  }

  /* running into a scored line deflects the crack along it */
  for(const Lw of o.weakLines){
    const x = firstCrossing(pts, Lw);
    if(!x) continue;
    const head = pts.slice(0, x.i).concat([x.p]);
    const spent = polyLineLen(head.slice(Math.max(0, head.length - x.i)));
    const leftOver = Math.max(0, runLen - Math.max(0, spent));
    if(leftOver < 24) continue;
    return {paths:[head, trimLine(Lw, x.p, leftOver)], weak:true};
  }
  return {paths:[pts], weak:false};
}
function strike(o, pt, dir, ptW, dirW, power, kind){
  power = clamp(power, 0, 1);
  o.hitCount=(o.hitCount||0)+1;
  ptW = ptW || pt; dirW = dirW || dir;
  const mat = o.mat;
  const before = o.pieces.length;
  const cr = crackPath(o, pt, dir, power);
  const band = 9 + 9*power;
  const crush = mat.range * (0.35 + 0.8*power);
  let broke = 0;

  o.walls.forEach(w=>{
    if(w.broken) return;
    let s = 0;
    const m1 = o.shardMid[w.s1], m2 = o.shardMid[w.s2];
    /* the crack ran between these two shards, so the join gives way */
    if(cr.paths.some(P => polylineHitsSeg(P, m1, m2)))
      s += power * mat.force * 3.6 * (w.weak ? 1.4 : 1);
    /* plus local crushing around the contact point */
    const dImp = dist(w.mid, pt);
    s += power * mat.force * 1.5 * Math.exp(-(dImp*dImp)/(2*crush*crush));
    /* a wide blow frays the edges of the crack too */
    if(band > 13 && cr.paths.some(P => distPolylinePt(P, w.mid) < band))
      s += power * mat.force * 0.9;
    if(s > w.strength && !(o.spec.mat==='ice' && o.hitCount===1 && power<.8)){ w.broken = true; broke++; }
    else w.strength=Math.max(.12,w.strength-s*.3);
  });

  o.lastCrack = cr.paths;

  rescueImpact(o, ptW, dirW, power);
  cr.paths.forEach(path=>o.weakLines.push(path));
  o.walls.forEach(w=>{if(!w.broken && cr.paths.some(path=>distPolylinePt(path,w.mid)<15)){w.strength=Math.max(.12,w.strength-power*.65);w.weak=true;}});
  o.cracked=true;

  if(broke === 0){ bounceOnly(o, ptW, dirW, power); return {broke:0, split:0}; }

  o.pieces = buildPieces(o);
  const split = o.pieces.length - before;
  const moving = o.pieces.length > 1;
  const avg = o.totalArea / Math.max(1, o.pieces.length);
  const range = mat.range * (0.5 + 0.85*power);
  const rnd = mulberry32(o.spec.seed + hitsUsed*997);

  o.pieces.forEach(p=>{
    const c = {x:p.cx+p.ox, y:p.cy+p.oy};
    const d = dist(c, ptW);
    const f = Math.exp(-d/(range*1.35));
    let ax = c.x-ptW.x, ay = c.y-ptW.y;
    const L = Math.hypot(ax,ay) || 1; ax/=L; ay/=L;
    const bx = ax*0.45 + dirW.x*0.55, by = ay*0.45 + dirW.y*0.55;
    const mass = Math.sqrt(Math.max(60,p.area)/Math.max(60,avg));
    const sp = (moving ? 1 : 0.14) * power * mat.force * 340 * (0.3 + f) / mass;
    p.vx += bx*sp; p.vy += by*sp;
    p.av += (rnd()-0.5)*7*power/mass;
    p.scl = 1 + 0.05*power*f;
    p.rest = false;
  });

  const largest=Math.max(...o.pieces.map(p=>p.area))/o.totalArea;
  o.open = largest < .86 && o.pieces.length>1;
  if(!o.open)o.pieces.forEach(p=>{p.rest=true;p.vx=p.vy=p.av=0;});
  o.struck = true;
  o.cracked = true;
  spawnDebris(o, ptW, power, range, null);
  impactFx(o, ptW, power, kind);
  return {broke, split};
}
function bounceOnly(o,pt,dir,power){ impactFx(o,pt,power,'hammer'); }


/* ===================== fx ===================== */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let particles = [], shake = 0, flash = 0, freeze = 0;

function impactFx(o, pt, power, kind){
  shake = Math.max(shake, 0.45 + power*0.75);
  flash = Math.max(flash, 0.16 + power*0.3);
  freeze = Math.max(freeze, kind === 'dull' ? 0.03 : 0.055 + power*0.035);
  audio.hit(o.mat, power, kind);
  if(navigator.vibrate) { try{ navigator.vibrate(kind === 'dull' ? 10 : Math.round(14 + power*26)); }catch(e){} }
}
function spawnDebris(o, pt, power, range, path){
  const mat = o.mat;
  const n = Math.round((reduced ? 10 : 34) * mat.debris * (0.35 + power));
  for(let i=0;i<n;i++){
    let x, y;
    if(path && path.length > 1 && i % 2){
      /* half the debris comes off the crack itself */
      const t = Math.random()*(path.length-1), i0 = Math.floor(t), u = t-i0;
      const a1 = path[i0], b1 = path[Math.min(path.length-1, i0+1)];
      x = lerp(a1.x, b1.x, u); y = lerp(a1.y, b1.y, u);
    } else {
      const a = Math.random()*TAU, r = Math.random()*range*0.8;
      x = pt.x + Math.cos(a)*r; y = pt.y + Math.sin(a)*r;
    }
    const sp = 70 + Math.random()*340*power;
    const ang = Math.random()*TAU;
    particles.push({
      x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 70*power,
      r: 1.2 + Math.random()*3.2*(mat.shard), rot:Math.random()*TAU, rv:(Math.random()*2-1)*10,
      life:0, max:0.45+Math.random()*0.65, dust:false, col:mat.body
    });
  }
  pushDust(pt.x, pt.y, null, reduced ? 4 : Math.round(6 + power*10));
}
function pushDust(x, y, col, n){
  for(let i=0;i<n;i++)
    particles.push({
      x, y, vx:(Math.random()*2-1)*46, vy:-12 - Math.random()*34,
      r: 7 + Math.random()*15, rot:0, rv:0,
      life:0, max:0.5+Math.random()*0.5, dust:true, col
    });
}

/* ===================== audio ===================== */
const audio = (function(){
  let A = null, noise = null, muted = false;
  function get(){
    if(!A){ try{ A = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(A.state === 'suspended') A.resume();
    return A;
  }
  function buf(a){
    if(noise) return noise;
    const n = Math.floor(a.sampleRate*0.7);
    noise = a.createBuffer(1, n, a.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1 - i/n);
    return noise;
  }
  function tone(a, type, f0, f1, t0, dur, vol){
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);

    o.start(t0); o.stop(t0+dur+0.02);
  }
  return {
    unlock(){ if(!muted) get(); },
    toggle(){ muted = !muted; return muted; },
    whoosh(power){

      const s = a.createBufferSource(); s.buffer = buf(a);

      f.frequency.exponentialRampToValueAtTime(1600, t+0.12); f.Q.value = 1.2;

      g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      s.connect(f); f.connect(g); g.connect(a.destination);

      g.gain.linearRampToValueAtTime(S.vol*(dull?0.4:0.55+power*0.5), t+0.007);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      s.connect(bp); bp.connect(g); g.connect(a.destination);

      if(dull) return;
      const n = Math.round(S.tinks*(0.4+power*0.8));
      for(let i=0;i<n;i++){
        const f = S.lo + Math.random()*(S.hi-S.lo);
        tone(a, 'triangle', f, f*0.84, t + Math.random()*0.11, 0.1+Math.random()*0.09, 0.07*(0.5+power));
      }
    },
    win(){
      if(muted) return; const a = get(); if(!a) return;
      const t = a.currentTime;
      [523.25, 659.25, 880].forEach((f,i)=> tone(a,'triangle',f,f,t+i*0.08,0.28,0.13));
    },
    lose(){
      if(muted) return; const a = get(); if(!a) return;
      tone(a, 'sawtooth', 190, 96, a.currentTime, 0.36, 0.09);
    }
  };
})();

/* ===================== art helpers ===================== */
function pathPoly(c, poly){
  c.beginPath();
  c.moveTo(poly[0].x, poly[0].y);
  for(let i=1;i<poly.length;i++) c.lineTo(poly[i].x, poly[i].y);
  c.closePath();
}
function glaze(c, poly, top, bot){
  const bb = bbox(poly);
  const g = c.createLinearGradient(0, bb.minY, 0, bb.maxY);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  pathPoly(c, poly); c.fillStyle = g; c.fill();
}
function shine(c, poly, cx, cy, rx, ry, rot, alpha){
  c.save(); pathPoly(c, poly); c.clip();
  c.fillStyle = 'rgba(255,255,255,' + alpha + ')';
  c.beginPath(); c.ellipse(cx, cy, rx, ry, rot, 0, TAU); c.fill();
  c.restore();
}
function plateArt(c, o, rim){
  const s = o.spec;
  const g = c.createRadialGradient(s.cx-s.r*0.34, s.cy-s.r*0.4, s.r*0.08, s.cx, s.cy, s.r*1.12);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.56,'#f6f4ef'); g.addColorStop(1,'#e2ded4');
  c.fillStyle = g; c.beginPath(); c.arc(s.cx, s.cy, s.r, 0, TAU); c.fill();
  c.lineWidth = 13; c.strokeStyle = rim;
  c.beginPath(); c.arc(s.cx, s.cy, s.r-8, 0, TAU); c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(60,42,26,.12)';
  c.beginPath(); c.arc(s.cx, s.cy, s.r*0.6, 0, TAU); c.stroke();
  shine(c, circlePoly(s.cx,s.cy,s.r,40), s.cx-s.r*0.34, s.cy-s.r*0.42, s.r*0.42, s.r*0.19, -0.66, 0.5);
}

function toWorld(e){

  return {x:(e.clientX - r.left - offX)/scale, y:(e.clientY - r.top - offY)/scale};
}
/* shards live in the object's own coordinates; pieces carry a transform on top.
   A world point must be pulled back into that space before any fracture maths. */
function hitTest(wp){
  for(const o of objects){
    if(o.open)continue;
    for(const pc of o.pieces){
      const lp = toLocal(pc, wp);
      for(const si of pc.shards) if(pointInPoly(lp, o.shards[si])) return {o, pc, lp};
    }
  }
  return null;
}
function objAt(p){ const h = hitTest(p); return h ? h.o : null; }
function rot(v, a){
  const c = Math.cos(a), s = Math.sin(a);
  return {x: v.x*c - v.y*s, y: v.x*s + v.y*c};
}
function toLocal(p, wp){
  const dx = wp.x - (p.cx + p.ox), dy = wp.y - (p.cy + p.oy);
  const c = Math.cos(-p.ang), s = Math.sin(-p.ang);
  return {x: (dx*c - dy*s)/p.scl + p.cx, y: (dx*s + dy*c)/p.scl + p.cy};
}

function aimTo(p){
  const pull = sub(hammer.home, p);
  const L = Math.hypot(pull.x, pull.y);
  const cl = Math.min(L, PULL_MAX);
  hammer.power = cl / PULL_MAX;
  elTip.textContent=hammer.power<.25?"Hafif · Çatlat":hammer.power<.65?"Ölçülü · Dikkatli aç":hammer.power<.85?"Güçlü · Taş için uygun":"Çok sert · İçindekine zarar verebilir!";
  hammer.aim = L > 1 ? norm(pull) : {x:0,y:-1};
  hammer.x = hammer.home.x - hammer.aim.x*cl*0.55;
  hammer.y = hammer.home.y - hammer.aim.y*cl*0.55;
  hammer.ang = Math.atan2(hammer.aim.y, hammer.aim.x) + Math.PI/2;
}
function release(){

  }

  hammer.vx = hammer.aim.x*sp; hammer.vy = hammer.aim.y*sp;
  hammer.state = 'flying'; hammer.t = 0;

function finishWeak(){
  const o = drawObj;

  const path = resample(drawPts, 10);
  const n = path.length;
  const dA = norm(sub(path[0], path[Math.min(3,n-1)]));
  const dB = norm(sub(path[n-1], path[Math.max(0,n-4)]));
  const exA = rayExit(path[0], dA, o.poly);
  const exB = rayExit(path[n-1], dB, o.poly);
  const rnd = mulberry32(((path[0].x*13 + path[0].y*7)|0) ^ 0x9e37);
  const full = jagged([exA].concat(path, [exB]), 2.0, rnd);
  o.weakLines.push(full);
  o.walls.forEach(w=>{ if(distPolylinePt(full, w.mid) < 13) w.weak = true; });

/* ===================== hammer flight & collisions ===================== */
function flyHammer(dt){
  hammer.t += dt;
  const steps = Math.max(1, Math.ceil(Math.hypot(hammer.vx, hammer.vy)*dt / 7));
  const sx = hammer.vx*dt/steps, sy = hammer.vy*dt/steps;
  /* the head leads the swing, so it is what lands first */
  hammer.ang = Math.atan2(hammer.vy, hammer.vx) + Math.PI/2;
  for(let i=0;i<steps;i++){
    hammer.x += sx; hammer.y += sy;
    const head = {x: hammer.x + Math.cos(hammer.ang - Math.PI/2)*18,
                  y: hammer.y + Math.sin(hammer.ang - Math.PI/2)*18};
    /* contact point must be a point genuinely inside the object */
    let h = hitTest(head), pt = head;
    if(!h){ pt = {x:hammer.x, y:hammer.y}; h = hitTest(pt); }
    if(h){
      const dirW = norm({x:hammer.vx, y:hammer.vy});
      strike(h.o, h.lp, rot(dirW, -h.pc.ang), pt, dirW, hammer.power, 'hammer');
      hammer.vx *= -0.32; hammer.vy *= -0.32;
      hammer.state = 'recoil'; hammer.t = 0;
      setState('settling'); settleT = 0;
      return;
    }
  }
  if(hammer.t > 1.3 || hammer.y < -60 || hammer.x < -80 || hammer.x > W+80 || hammer.y > H+80){
    hammer.state = 'recoil'; hammer.t = 0;
    setState('settling'); settleT = 0;
  }
}

/* ===================== physics ===================== */
const GRAV = 1150;
function stepPieces(dt){
  for(const o of objects){
    if(o.chainLock > 0) o.chainLock -= dt;
    const mat = o.mat;
    for(const p of o.pieces){
      if(p.rest){ p.scl += (1-p.scl)*Math.min(1, dt*9); continue; }
      p.vy += GRAV*dt;
      p.ox += p.vx*dt; p.oy += p.vy*dt;
      p.ang += p.av*dt;
      p.scl += (1-p.scl)*Math.min(1, dt*9);
      let bottom=-Infinity;
      const sin=Math.sin(p.ang),cos=Math.cos(p.ang);
      for(const si of p.shards)for(const v of o.shards[si])bottom=Math.max(bottom,((v.x-p.cx)*sin+(v.y-p.cy)*cos)*p.scl);
      const foot = p.cy + p.oy + bottom;
      if(foot > TABLE_Y){
        const cx = p.cx + p.ox;
        if(cx > TABLE_X0 && cx < TABLE_X1){
          p.oy -= (foot - TABLE_Y);
          p.av *= 0.4;
          if(p.vy > 80){ p.vy = -p.vy*mat.rest; p.vx *= 0.72; }
          else {
            p.vy = 0;
            p.vx *= Math.pow(1 - mat.slide*0.98, dt*60);
            if(Math.abs(p.vx) < 12){ p.rest = true; p.vx = 0; p.av = 0; }
          }
        }
      }
      if(p.cy + p.oy > H + 220){ p.rest = true; p.vx = p.vy = 0; }
    }
  }
}

 if(lvIndex===3 && pt.x>180 && power>.32){hurt(1,'Kalın destek devrildi. Soldaki yeşil tahtayı aç.');return;}
 const threshold=lvIndex===0?.94:.70;

function releaseProps(){

 // Stone opens first; build the protected capsule only after the debris settles.
 if(lv.layers && objects.length===1)return;
 keyObj.free=true;keyObj.rest=false;keyObj.shield=.18;
 const impulse=objects[objects.length-1].releaseImpulse||{x:0,y:0};

function stepProp(dt){

 if(state==='result')return;

 if(k.free&&!k.rest){
  k.vy+=GRAV*.85*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.ang+=k.av*dt;
  if(k.y+k.radius>=TABLE_Y && k.x>TABLE_X0 && k.x<TABLE_X1){
   k.y=TABLE_Y-k.radius;
   if(k.x-k.radius<lv.safe.x0 || k.x+k.radius>lv.safe.x1){hurt(1,'Minderin dışına düştü. Daha düz ve daha kısa bir vuruş dene.');}
   if(k.vy>70){k.vy=-k.vy*.18;k.vx*=lvIndex===2?.9:.65;}
   else{k.vy=0;k.vx*=Math.pow(lvIndex===2?.22:.008,dt);k.av*=Math.pow(.01,dt);if(Math.abs(k.vx)<5){k.rest=true;k.vx=k.av=0;}}
  }
  if(k.y>H||k.x<0||k.x>W)hurt(1,'Masadan savruldu. Gücü azaltıp içeri doğru nişan al.');
 }
 // Broad phase followed by polygon contact; each shard can damage once.
 if(k.free&&!k.dead&&k.shield===0)for(const o of objects)for(const p of o.pieces){
  if(p.rescueContact||p.rest||!o.open)continue;
  if(dist({x:p.cx+p.ox,y:p.cy+p.oy},k)>p.rad+k.radius)continue;
  const lp=toLocal(p,k);
  if(!p.shards.some(si=>pointInPoly(lp,o.shards[si])||o.shards[si].some((a,i,poly)=>distPtSeg(lp,a,poly[(i+1)%poly.length])<k.radius)))continue;
  p.rescueContact=true;
  const speed=Math.hypot(p.vx-k.vx,p.vy-k.vy),mass=clamp(p.area/2200,.15,2);
  const force=speed*mass*(o.spec.mat==='stone'?1.5:o.spec.mat==='glass'?1.15:.65);

  k.vx+=p.vx*.025;k.av+=p.vx*.001;k.rest=false;
 }
}

function nearestPiece(o, pt){
  let best = null, bd = Infinity;
  for(const p of o.pieces){
    const d = Math.hypot(p.cx+p.ox-pt.x, p.cy+p.oy-pt.y);
    if(d < bd){ bd = d; best = p; }
  }
  return best;
}

/* ===================== evaluation ===================== */
function measures(){
  return {
    objs: objects,
    maxPower,
    majors(o){ return o.pieces.filter(p=>p.area >= o.totalArea*0.10).length; },
    parts(o){ return o.pieces.length > 1; },
    keepRatio(o, keepX){
      let total = 0;
      const per = o.pieces.map(p=>{
        let k = 0;
        p.shards.forEach(si=>{ if(o.shardMid[si].x < keepX) k += Math.abs(polyArea(o.shards[si])); });
        return k;
      });
      per.forEach(v=>total += v);
      return total > 0 ? Math.max.apply(null, per)/total : 0;
    },
    zoneBroken(o, zone){
      /* the marked zone counts as taken off once its shards leave the biggest piece */
      let big = null, ba = 0;
      o.pieces.forEach(p=>{ if(p.area > ba){ ba = p.area; big = p; } });
      let zoneTotal = 0, inBig = 0;
      o.shards.forEach((s, si)=>{
        const c = o.shardMid[si];
        if(Math.hypot(c.x-zone.x, c.y-zone.y) > zone.r) return;
        const a = Math.abs(polyArea(s));
        zoneTotal += a;
        if(big && big.shards.indexOf(si) >= 0) inBig += a;
      });
      return zoneTotal > 0 && (inBig/zoneTotal) < 0.45;
    }
  };
}
function everythingSettled(){
  if(hammer.state === 'flying') return false;
  for(const o of objects) for(const p of o.pieces) if(!p.rest) return false;
  if(keyObj && !keyObj.rest && keyObj.y < H) return false;
  if(cake && !cake.rest && !cake.fell && cake.y < H) return false;
  return true;
}
function levelResolved(){return keyObj.dead || (keyObj.free&&keyObj.rest);}
function afterSettle(){

 }
 if(levelResolved()||hitsUsed>=lv.maxHits){evaluate();return;}
 if(keyObj.free){if(settleT>5){evaluate();}return;}

}

function evaluate(){
  resultShown = true;
  const res = lv.judge(measures());
  elVtitle.textContent = res.title;
  elVtitle.className = res.ok ? 'good' : 'bad';
  elVpts.textContent = res.ok ? '✦'.repeat(res.score) + ' · Özenli kurtarma' : 'Her deneme yeni bir ipucu';
  if(res.ok){keyObj.celebrate=.8;pushDust(keyObj.x,keyObj.y,'#f6d57e',12);}
  elVmsg.textContent = res.msg;
  const last = lvIndex === LEVELS.length-1;
  btnNext.textContent = res.ok ? (last ? 'Baştan Başla' : 'Sonraki Bölüm') : 'Tekrar Dene';
  btnNext.style.display = res.ok ? '' : 'none';
  btnRetry.textContent = res.ok ? 'Tekrar Oyna' : 'Tekrar Dene';
  lastOk = res.ok;
  sheet.classList.add('show');
  if(res.ok) audio.win(); else audio.lose();
  setState('result');
}
let lastOk = false;

/* ===================== loop ===================== */
let last=performance.now(), accumulator=0;
function frame(now){
 accumulator+=Math.min(.1,(now-last)/1000);last=now;
 while(accumulator>=1/120){update(1/120);accumulator-=1/120;}
 render();requestAnimationFrame(frame);
}

function update(dt){
  if(freeze > 0){ freeze -= dt; dt = 0; }

  if(hammer.state === 'flying' && dt > 0) flyHammer(dt);
  else if(hammer.state === 'recoil'){
    hammer.t += dt;
    hammer.x += hammer.vx*dt; hammer.y += hammer.vy*dt;
    hammer.vx *= Math.pow(0.02, dt); hammer.vy *= Math.pow(0.02, dt);
    hammer.ang += 0.06;
    if(hammer.t > 0.4){
      hammer.x = lerp(hammer.x, hammer.home.x, Math.min(1, dt*7));
      hammer.y = lerp(hammer.y, hammer.home.y, Math.min(1, dt*7));
      hammer.ang = lerp(hammer.ang, 0, Math.min(1, dt*7));
      if(Math.abs(hammer.x-hammer.home.x) < 2 && Math.abs(hammer.y-hammer.home.y) < 2){
        hammer.state = 'idle'; hammer.power = 0;
      }
    }
  }

  if(dt > 0){
    stepPieces(dt);
    chainCheck();
    releaseProps();
    stepProp(dt);
  }

  for(let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.life += dt;
    if(q.life >= q.max){ particles.splice(i,1); continue; }
    q.vy += (q.dust ? 110 : 1250)*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.rot += q.rv*dt;
    if(q.dust){ q.vx *= 0.97; q.r += dt*24; }
    else if(q.y > TABLE_Y && q.vy > 0 && q.x > TABLE_X0 && q.x < TABLE_X1){ q.y = TABLE_Y; q.vy *= -0.25; q.vx *= 0.7; }
  }
  shake *= Math.pow(0.004, dt);
  if(shake < 0.002) shake = 0;
  flash *= Math.pow(0.0008, dt);

  if(state === 'settling'){
    settleT += dt;
    if((everythingSettled() && settleT > 0.35) || settleT > 2.8) afterSettle();
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const sx = shake ? (Math.random()*2-1)*8*shake : 0;
  const sy = shake ? (Math.random()*2-1)*8*shake : 0;
  ctx.save();
  ctx.translate(offX + sx*scale, offY + sy*scale);
  ctx.scale(scale, scale);

  drawScene();
  drawWorkshopDetails();
  objects.forEach(drawContactShadows);
  objects.forEach(drawObject);
  if(keyObj) drawRescue();
  if(cake && !cake.fell) drawCake();
  drawParticles();
  drawAim();
  drawHammer();

  ctx.restore();
  if(flash > 0.01){
    ctx.fillStyle = 'rgba(255,248,238,' + (flash*0.55) + ')';
    ctx.fillRect(0,0,cssW,cssH);
  }
}

function drawContactShadows(o){

  ctx.shadowColor = 'rgba(80,40,20,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#f2d3a8';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-cake.r, -cake.r*0.5, cake.r*2, cake.r*1.35, 5) : ctx.rect(-cake.r,-cake.r*0.5,cake.r*2,cake.r*1.35);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#e8759a';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-cake.r, -cake.r, cake.r*2, cake.r*0.66, 5) : ctx.rect(-cake.r,-cake.r,cake.r*2,cake.r*0.66);
  ctx.fill();
  ctx.fillStyle = '#c03a5a';
  ctx.beginPath(); ctx.arc(0, -cake.r-3, 4.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawParticles(){
  particles.forEach(q=>{
    const a = 1 - q.life/q.max;
    if(q.dust){
      const col = q.col || '#d8c6ad';
      const rg = ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);
      rg.addColorStop(0, hexA(col, 0.3*a)); rg.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,TAU); ctx.fill();
    } else {
      ctx.save();
      ctx.translate(q.x,q.y); ctx.rotate(q.rot);
      ctx.fillStyle = hexA(q.col || '#f4f1ea', a);
      ctx.beginPath();
      ctx.moveTo(-q.r,-q.r*0.6); ctx.lineTo(q.r,-q.r*0.3); ctx.lineTo(q.r*0.3,q.r); ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  });
}
function drawAim(){
  if(hammer.state !== 'aiming' || hammer.power < 0.06) return;
  const p = hammer.power;
  const col = p < 0.45 ? '#3f9a6b' : p < 0.78 ? '#e2a02c' : '#cf4436';
  ctx.save();
  ctx.strokeStyle = 'rgba(120,86,52,.35)';
  ctx.lineWidth = 2; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.moveTo(hammer.home.x, hammer.home.y); ctx.lineTo(hammer.x, hammer.y); ctx.stroke();
  ctx.setLineDash([]);

  const n = Math.round(3 + p*8);
  for(let i=0;i<n;i++){
    const t = 24 + i*20;
    const x = hammer.home.x + hammer.aim.x*t, y = hammer.home.y + hammer.aim.y*t;
    const a = 0.85 - i/n*0.6;
    ctx.fillStyle = hexA(col, a);
    ctx.beginPath(); ctx.arc(x, y, 3.6 - i/n*1.4, 0, TAU); ctx.fill();
  }
  const tipD = 24 + n*20;
  const tx = hammer.home.x + hammer.aim.x*tipD, ty = hammer.home.y + hammer.aim.y*tipD;
  const ang = Math.atan2(hammer.aim.y, hammer.aim.x);
  ctx.fillStyle = col;
  ctx.save(); ctx.translate(tx,ty); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-5,5.5); ctx.lineTo(-5,-5.5); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawHammer(){
  ctx.save();
  ctx.translate(hammer.x, hammer.y);
  ctx.rotate(hammer.ang);
  ctx.shadowColor = 'rgba(50,30,12,.4)'; ctx.shadowBlur = 9; ctx.shadowOffsetY = 4;
  /* handle */
  const hg = ctx.createLinearGradient(-5,0,5,0);
  hg.addColorStop(0,'#a9773f'); hg.addColorStop(0.5,'#d7a464'); hg.addColorStop(1,'#8d5f2e');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-4.5, -8, 9, 52, 4) : ctx.rect(-4.5,-8,9,52);
  ctx.fill();
  /* head */
  ctx.shadowBlur = 6;
  const mg = ctx.createLinearGradient(-20,-14,20,4);
  mg.addColorStop(0,'#e8ebef'); mg.addColorStop(0.45,'#9aa3ad'); mg.addColorStop(1,'#5d666f');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-21, -21, 42, 17, 4) : ctx.rect(-21,-21,42,17);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.fillRect(-19, -19.5, 38, 3);
  ctx.restore();
}
function hexA(hex, a){
  if(!hex || hex[0] !== '#') return 'rgba(230,225,215,' + a + ')';
  let h = hex.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* ===================== wiring ===================== */
cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', cancelAim);
window.addEventListener('blur',cancelAim);
cv.addEventListener('lostpointercapture',cancelAim);
stage.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

btnReset.addEventListener('click', ()=>buildLevel(lvIndex));
btnRetry.addEventListener('click', ()=>{ sheet.classList.remove('show'); buildLevel(lvIndex); });
btnNext.addEventListener('click', ()=>{
  sheet.classList.remove('show');
  buildLevel(lastOk ? (lvIndex+1) % LEVELS.length : lvIndex);
});
btnSnd.addEventListener('click', ()=>{
  const m = audio.toggle();
  btnSnd.setAttribute('aria-pressed', String(m));
  btnSnd.setAttribute('aria-label', m ? 'Sesi aç' : 'Sesi kapat');
  document.getElementById('sndWave').style.opacity = m ? '0.22' : '1';
});

window.__BIR = {
  go: buildLevel,
  levels: LEVELS.length,
  /* fire the hammer programmatically: power 0..1, angle in degrees (0 = up) */
  fire(power, angleDeg, fromX){
    if(state !== 'ready') return false;
    const a = (angleDeg||0) * Math.PI/180;
    if(fromX != null) hammer.home.x = fromX;
    hammer.power = clamp(power,0,1);
    hammer.aim = {x: Math.sin(a), y: -Math.cos(a)};
    hammer.x = hammer.home.x; hammer.y = hammer.home.y;
    release();
    return true;
  },
  /* advance the simulation by hand — deterministic, independent of rAF */
  step(dt, n){ for(let i=0;i<(n||1);i++) update(dt||1/60); return null; },
  settle(cap){
    let i = 0;
    while(i++ < (cap||600) && (state === 'flying' || state === 'settling')) update(1/60);
    return this.info;
  },
  weak(pts){
    const o = objAt(pts[0]);
    if(!o) return false;
    drawObj = o; drawPts = pts.slice(); state = 'drawing';
    finishWeak();
    return true;
  },
  get info(){
    const R = measures();
    return {
      layer:objects.length, rescue:keyObj?{...keyObj}:null, particles:particles.length, tool:{state:hammer.state,power:hammer.power,x:hammer.x,y:hammer.y}, state, hitsUsed, maxPower: +maxPower.toFixed(2), resultShown,
      objs: objects.map(o=>({
        open:!!o.open, mat:o.mat.label, shards:o.shards.length, walls:o.walls.length,
        broken:o.walls.filter(w=>w.broken).length, weak:o.walls.filter(w=>w.weak).length,
        pieces:o.pieces.length, majors:R.majors(o),
        areas:o.pieces.map(p=>Math.round(p.area/o.totalArea*100)).sort((a,b)=>b-a).slice(0,5)
      })),
      key: keyObj ? {x:Math.round(keyObj.x), y:Math.round(keyObj.y), dead:keyObj.dead} : null,
      cake: cake ? {x:Math.round(cake.x), y:Math.round(cake.y), fell:cake.fell} : null,
      verdict: resultShown ? elVtitle.textContent : null,
      score: resultShown ? elVpts.textContent : null
    };
  }
};

function start(data){
  resize();
  objects = [];
  buildLevel(data && typeof data.level === 'number' ? data.level : 0);
  requestAnimationFrame(frame);
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({level: lvIndex}));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data || {});
} else {
  start({});
}
})();
</script>
