<!doctype html>
<html lang="tr" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eee1">
<title>Rescue Workshop · Kurtarma Atölyesi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    /* warm workshop: amber light, oak bench, painted-toy accents */
    --wall-a:#fdf3df; --wall-b:#e9d3ab;
    --bench-a:#d6a05c; --bench-b:#ac7434; --bench-dark:#7a4e22;
    --ink:#3c2a18; --ink-2:#7c6146; --ink-3:#a98f70;
    --card:#fffaf0; --card-line:rgba(122,78,34,.18);
    --chip:rgba(122,78,34,.09); --chip-line:rgba(122,78,34,.18);
    --accent:#e8622c; --accent-2:#f7a03a;
    --good:#3fae6a; --bad:#d94436; --warn:#efb32a;
    --shadow:0 14px 32px -14px rgba(90,52,16,.55);
    /* each tool owns a colour, like painted tool handles */
    --t-hammer:#4a90d9; --t-screwdriver:#f0a92e; --t-cutter:#e2574c;
    --t-magnet:#7b5fd0; --t-suction:#3fae6a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wall-a:#31241a; --wall-b:#1d140e;
      --bench-a:#8a5c2c; --bench-b:#60401e; --bench-dark:#3b2612;
      --ink:#fbeedb; --ink-2:#cdb193; --ink-3:#95795c;
      --card:#2f2419; --card-line:rgba(255,230,196,.14);
      --chip:rgba(255,230,196,.09); --chip-line:rgba(255,230,196,.17);
      --accent:#ff7d43; --accent-2:#ffb457;
      --good:#4fc885; --bad:#ff6a58; --warn:#f7c94e;
      --shadow:0 18px 40px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --wall-a:#31241a; --wall-b:#1d140e;
    --bench-a:#8a5c2c; --bench-b:#60401e; --bench-dark:#3b2612;
    --ink:#fbeedb; --ink-2:#cdb193; --ink-3:#95795c;
    --card:#2f2419; --card-line:rgba(255,230,196,.14);
    --chip:rgba(255,230,196,.09); --chip-line:rgba(255,230,196,.17);
    --accent:#ff7d43; --accent-2:#ffb457;
    --good:#4fc885; --bad:#ff6a58; --warn:#f7c94e;
    --shadow:0 18px 40px -16px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    margin:0;color:var(--ink);
    background:radial-gradient(ellipse at 30% 0%, var(--wall-a), var(--wall-b) 70%);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  #app{
    position:fixed;inset:0;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    max-width:560px;margin-inline:auto;padding-inline:14px;
  }

  /* ---------------- top HUD ---------------- */
  .hud{
    padding-top:max(10px,env(safe-area-inset-top));padding-bottom:8px;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:8px 10px;
  }
  .icon-btn{
    width:42px;height:42px;border-radius:14px;flex:none;
    border:none;background:linear-gradient(#fffdf7,#efe0c6);
    box-shadow:0 3px 0 0 rgba(122,78,34,.35), 0 6px 12px -6px rgba(90,52,16,.5);
    color:#7a4e22;display:grid;place-items:center;cursor:pointer;
    transition:transform .1s,box-shadow .1s;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 0 rgba(122,78,34,.35)}
  .icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .icon-btn svg{width:19px;height:19px;display:block}

  /* level badge — a little enamel pin */
  .lv{
    grid-row:1;justify-self:center;
    display:flex;align-items:center;justify-content:center;
    min-width:58px;padding:6px 13px;border-radius:14px;
    background:linear-gradient(#ffd76a,#f0a92e);
    border:2.5px solid #fff6e2;
    box-shadow:0 3px 0 0 #c8801c, 0 7px 14px -6px rgba(90,52,16,.6);
    font-weight:800;font-size:12.5px;color:#6b3c08;
    line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.5);
  }

  /* mission banner — the hero label, like a painted sign */
  .mission{grid-column:1 / -1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:6px}
  .obj{
    margin:0;max-width:100%;
    padding:9px 26px;border-radius:16px;
    background:linear-gradient(#f79a3c,#e8622c);
    border:3px solid #fff4e0;
    box-shadow:0 4px 0 0 #b8431a, 0 10px 22px -8px rgba(150,60,20,.75);
    font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(17px,5.2vw,23px);line-height:1.1;
    letter-spacing:-.02em;color:#fff;text-align:center;text-wrap:balance;
    text-shadow:0 2px 0 rgba(150,60,20,.55);
  }
  .sub{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-2);font-weight:700}
  .pips{display:flex;gap:5px;flex:none}
  .pip{
    width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8b7a, #d94436);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
    transition:transform .25s,opacity .25s,filter .25s;
  }
  .pip.gone{filter:grayscale(1) brightness(1.5);opacity:.45;transform:scale(.72)}
  .progress{display:flex;align-items:center;gap:8px;flex:1;max-width:190px}
  .progress-track{flex:1;height:7px;border-radius:10px;background:rgba(122,78,34,.16);overflow:hidden;
    box-shadow:0 1px 2px rgba(90,52,16,.25) inset}
  #progressFill{height:100%;width:0;border-radius:10px;
    background:linear-gradient(90deg,var(--good),#7ede9f);transition:width .35s ease}
  .brand,.chapter{display:none}

  /* ---------------- stage ---------------- */
  #stage{
    position:relative;min-height:0;touch-action:none;
    border-radius:26px;overflow:hidden;
    box-shadow:0 10px 30px -12px rgba(90,52,16,.45), 0 0 0 3px rgba(255,250,240,.5);
  }
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  .say{
    position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);
    background:var(--card);border:2px solid var(--card-line);
    border-radius:16px;padding:9px 16px;box-shadow:var(--shadow);
    font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.4;
    pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;
    max-width:92%;text-align:center;
  }
  .say.show{opacity:1;transform:translate(-50%,0)}
  .say.bad{color:#fff;background:linear-gradient(#e8624c,#d94436);border-color:#fff0e6}

  /* ---------------- dock ---------------- */
  .dock{padding:8px 0 max(10px,env(safe-area-inset-bottom))}
  .dock-caption{display:flex;align-items:center;gap:9px;margin-bottom:8px;min-height:34px}
  #toolHint{font-size:11.5px;line-height:1.4;color:var(--ink-2);font-weight:600}
  .inspect{
    flex:none;min-height:38px;border:none;border-radius:13px;padding:8px 14px;
    background:linear-gradient(#fffdf7,#efe0c6);color:#7a4e22;
    box-shadow:0 3px 0 0 rgba(122,78,34,.35);
    font:800 12px inherit;cursor:pointer;transition:transform .1s,box-shadow .1s;
  }
  .inspect:active{transform:translateY(3px);box-shadow:none}
  .inspect.on{background:linear-gradient(#5e8f72,#43705a);color:#fff9ed;box-shadow:0 3px 0 0 #2f5340}

  /* colourful, chunky, pressable tool keys */
  .tools{display:flex;gap:7px;padding:0;justify-content:center}
  .tool{
    flex:1 1 0;min-width:0;max-width:120px;min-height:76px;position:relative;
    border:none;border-radius:19px;cursor:pointer;
    background:var(--tc);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:6px 3px 8px;
    box-shadow:0 5px 0 0 rgba(0,0,0,.26), 0 9px 16px -8px rgba(60,30,10,.6);
    transition:transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .12s, filter .18s;
    filter:saturate(.82) brightness(.97);
  }
  .tool::before{
    content:'';position:absolute;inset:3px 3px 42% 3px;border-radius:16px 16px 10px 10px;
    background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0));
    pointer-events:none;
  }
  .tool svg{width:30px;height:30px;display:block;stroke-width:1.8;
    filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.28))}
  .tool span{
    font-size:10.5px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
    text-shadow:0 1.5px 0 rgba(0,0,0,.3);
  }
  .tool:active{transform:translateY(4px);box-shadow:0 1px 0 0 rgba(0,0,0,.26)}
  .tool:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .tool.on{
    filter:none;transform:translateY(-6px);
    box-shadow:0 7px 0 0 rgba(0,0,0,.26), 0 0 0 3.5px #fffaf0, 0 14px 24px -8px var(--tc);
  }
  .tool.on::after{
    content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-bottom:7px solid #fffaf0;
  }
  .tool.buzz{animation:buzz .32s}
  @keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .tool.hinted,.inspect.hinted{animation:hint-nudge 1.1s ease 2}
  @keyframes hint-nudge{50%{box-shadow:0 5px 0 0 rgba(0,0,0,.26), 0 0 0 5px rgba(255,215,106,.6)}}

  /* ---------------- result sheet ---------------- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(50,30,12,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .sheet.show{opacity:1;pointer-events:auto}
  .sheet:not(.show){visibility:hidden}
  .card{
    width:100%;max-width:520px;background:var(--card);
    border:3px solid #fff6e6;border-radius:26px 26px 0 0;box-shadow:var(--shadow);
    padding:20px 20px max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.18,.9,.28,1);
  }
  .sheet.show .card{transform:translateY(0)}
  .card h2{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1;letter-spacing:-.03em;
  }
  .card h2.good{color:var(--good)} .card h2.bad{color:var(--bad)}
  .stars{font-size:30px;letter-spacing:8px;color:#f0a92e;min-height:14px;
    text-shadow:0 2px 0 rgba(150,90,20,.35)}
  .card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:44ch}
  .acts{display:flex;gap:10px;margin-top:4px;width:100%}
  .btn{
    flex:1;min-height:54px;border:0;border-radius:17px;cursor:pointer;
    font-family:Figtree,sans-serif;font-weight:800;font-size:15px;
    display:grid;place-items:center;transition:transform .1s,box-shadow .1s;
  }
  .btn:active{transform:translateY(4px)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .ghost{background:linear-gradient(#fffdf7,#efe0c6);color:#7a4e22;box-shadow:0 4px 0 0 rgba(122,78,34,.35)}
  .go{background:linear-gradient(#f79a3c,#e8622c);color:#fff;font-size:16px;
    box-shadow:0 4px 0 0 #b8431a;text-shadow:0 1.5px 0 rgba(150,60,20,.5)}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.08s !important}}
  @media (max-width:380px){
    #app{padding-inline:10px}.tools{gap:5px}.tool span{font-size:9.5px}
    .tool svg{width:26px;height:26px}.obj{font-size:17px;padding:8px 16px}
  }
  @media (max-height:660px){
    .hud{padding-top:6px;padding-bottom:5px;gap:5px 8px}
    .obj{font-size:16px;padding:7px 18px}
    .tool{min-height:58px}.tool svg{width:24px;height:24px}
    .dock-caption{margin-bottom:5px;min-height:30px}.dock{padding-top:5px}
    .icon-btn{width:36px;height:36px}.lv{padding:4px 10px;font-size:11px}
  }
</style>
</head><body>

<div id="app" lang="tr">
  <header class="hud">
    <button class="icon-btn" id="resetBtn" type="button" aria-label="Bölümü baştan başlat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
    </button>
    <span class="lv" id="lvTag">Bölüm 1</span>
    <button class="icon-btn" id="sndBtn" type="button" aria-label="Sesi kapat" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6" id="sndWave"/>
      </svg>
    </button>
    <div class="mission">
      <p class="obj" id="objective">Kapsülü aç.</p>
      <div class="sub">
        <div class="pips" id="pips" aria-label="Kalan hak"></div>
        <div class="progress"><div class="progress-track"><div id="progressFill"></div></div><span id="progressText" aria-live="polite">Hazır</span></div>
      </div>
    </div>
    <span class="chapter" id="chapter"></span>
  </header>

  <div id="stage">
    <canvas id="cv" aria-label="Kurtarma atölyesi. Boş alanda sürükleyerek objeyi çevir, alet seç ve parçalarla etkileş."></canvas>
    <div class="say" id="say" role="status"></div>
  </div>

  <div class="dock"><div class="dock-caption"><button id="inspectBtn" class="inspect on" type="button" aria-pressed="true">↔ İncele</button><span id="toolHint">Boş alanda sürükle, her tarafına bak.</span></div><div class="tools" id="toolbar" aria-label="Aletler"></div></div>
</div>

<div class="sheet" id="sheet" lang="tr" aria-live="polite">
  <div class="card">
    <h2 id="vtitle" class="good">Kurtarıldı!</h2>
    <div class="stars" id="stars"></div>
    <p id="vmsg"></p>
    <div class="acts">
      <button class="btn ghost" id="retryBtn" type="button">Tekrar Dene</button>
      <button class="btn go" id="nextBtn" type="button">Sonraki Bölüm</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================== math ===================== */
const W = 400, H = 520, TAU = Math.PI*2;
const BENCH = 486;
const dist  = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const norm  = a => { while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; };
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(ctx, x, y, w, h, r){
  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function drawScissors(x,y,size,col){
  ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap='round';
  for(const sy of [-1,1]){ctx.beginPath();ctx.ellipse(-9,sy*7,5,4,sy*.3,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(-5,sy*5);ctx.lineTo(13,-sy*8);ctx.stroke();}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,2,0,TAU);ctx.fill();ctx.restore();
}

/* ===================== audio ===================== */
const audio = (function(){
  let A = null, muted = false, noise = null;
  function get(){
    if(!A){ try{ A = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(A.state === 'suspended') A.resume();
    return A;
  }
  function nz(a){
    if(noise) return noise;
    const n = Math.floor(a.sampleRate*0.5);
    noise = a.createBuffer(1, n, a.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    return noise;
  }
  function t(type, f0, f1, dur, vol, delay){
    const a = muted ? null : get(); if(!a) return;
    const t0 = a.currentTime + (delay||0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  function burst(bp, q, dur, vol){
    const a = muted ? null : get(); if(!a) return;
    const t0 = a.currentTime;
    const s = a.createBufferSource(); s.buffer = nz(a);
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = bp; f.Q.value = q;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0); s.stop(t0+dur+0.05);
  }
  return {
    unlock(){ if(!muted) get(); },
    toggle(){ muted = !muted; return muted; },
    click(){ t('square', 1700, 1450, 0.032, 0.045); },
    tick(){ t('triangle', 880, 760, 0.05, 0.06); },
    pop(){ t('sine', 280, 720, 0.09, 0.15); },
    unstick(){ t('sine', 680, 200, 0.16, 0.16); },
    slice(){ burst(2600, 2.2, 0.11, 0.1); t('triangle', 1400, 820, 0.07, 0.05, 0.02); },
    clack(){ t('square', 420, 300, 0.05, 0.09); },
    snap(){ t('triangle', 1300, 500, 0.07, 0.12); },
    hiss(dur){ burst(1500, 0.7, dur||0.5, 0.07); },
    shock(){
      burst(900, 0.6, 0.3, 0.28);
      t('sawtooth', 130, 60, 0.26, 0.2);
      for(let i=0;i<5;i++) t('square', 2200+Math.random()*1800, 500, 0.05, 0.07, i*0.03);
    },
    thud(){ t('sine', 130, 60, 0.2, 0.28); burst(420, 0.8, 0.16, 0.16); },
    smash(){ burst(2600, 1.1, 0.5, 0.42); t('sine', 110, 50, 0.24, 0.3);
             for(let i=0;i<7;i++) t('triangle', 900+Math.random()*2400, 600, 0.11, 0.07, Math.random()*0.1); },
    nope(){ t('sine', 210, 175, 0.1, 0.07); },
    done(){ t('triangle', 860, 1300, 0.11, 0.1); },
    win(){ [523,659,880,1175].forEach((f,i)=>t('triangle', f, f, 0.25, 0.12, i*0.07)); },
    lose(){ t('sawtooth', 200, 90, 0.4, 0.1); }
  };
})();

/* ===================== particles ===================== */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let particles = [], shake = 0, flash = 0, flashCol = '255,248,238', freeze = 0;

function spark(x, y, n, col){
  for(let i=0;i<(reduced?Math.min(4,n):n);i++){
    const a = Math.random()*TAU, s = 60 + Math.random()*260;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-40, r:1.6+Math.random()*2.2,
      life:0, max:0.25+Math.random()*0.3, kind:'spark', col:col||'#ffe27a'});
  }
}
function puff(x, y, n, col){
  for(let i=0;i<(reduced?3:n);i++)
    particles.push({x, y, vx:(Math.random()*2-1)*46, vy:-16-Math.random()*40, r:6+Math.random()*12,
      life:0, max:0.45+Math.random()*0.4, kind:'dust', col:col||'#e8d9bf'});
}
function shardBurst(x, y, n, col){
  for(let i=0;i<(reduced?5:n);i++){
    const a = Math.random()*TAU, s = 90 + Math.random()*330;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-90, r:2+Math.random()*4.5,
      rot:Math.random()*TAU, rv:(Math.random()*2-1)*11,
      life:0, max:0.5+Math.random()*0.6, kind:'shard', col:col||'#dff1f2'});
  }
}
function sparkle(x, y, n){

/* ===================== turntable projection ===================== */
/* Components live at an azimuth on the shell. Only what faces you can be used,
   so the object has to be turned to be inspected. */
function proj(c){
  if(c.type==='rescue'&&c.free)return {x:c.fx,y:c.y,depth:1,scale:1,alpha:1,front:true};
  const d = c.az + rotY;
  const depth = Math.cos(d);
  const radius = c.rr != null ? c.rr : shell.rx;
  return {
    x: shell.cx + Math.sin(d)*radius,
    y: c.y,
    depth,
    scale: 0.72 + 0.28*Math.max(0, depth),
    alpha: clamp((depth + 0.28)/0.5, 0, 1),
    front: depth > 0.34
  };
}
function faceOf(c){ return proj(c); }

/* ===================== components ===================== */
function mk(def){
  const T = TYPE[def.type] || {};
  return Object.assign({
    done:false, prog:0, requires:[], tools:(T.tools||[]).slice(),
    shake:0, glow:0, az:0, y:300, gone:0
  }, def);
}
const byId = id => comps.find(c=>c.id===id) || null;
function locked(c){
  for(const id of c.requires){ const r = byId(id); if(r && !r.done) return true; }
  return false;
}
function accepts(c, t){ return c.tools.indexOf('hand')>=0 || c.tools.indexOf(t)>=0; }
function finish(c){
  if(c.done) return;
  c.done = true; c.prog = 1;
  audio.done(); puff(faceOf(c).x, c.y, 6);
  useful();
  c.completeAt=tNow;
  sparkle(faceOf(c).x,c.y,5);
  paintProgress();
  if(!c.auto&&c.type!=='rescue')say(({screw:'Vida çıktı.',sw:'Elektrik kesildi.',cable:'Kablo ayrıldı.',valve:'Basınç düştü.',panel:'Kapak açıldı.',strip:'Bant kesildi.',magpin:'Pim yerinde.',door:'Kapı açıldı.'})[c.type]||'Tamam!');
  comps.forEach(k=>{ if(k.auto && !k.done && !locked(k)) finish(k); });
}
function useful(){ lastUseful = tNow; hintShown = 0; hintTarget=null; hintUntil=0; }

/* ===================== consequences ===================== */
/* soft: nothing breaks · penalty: costs a pip · critical: level over */
function soft(c, msg){
  softMistakes++;

  say(msg || 'Bu burada işe yaramaz.');
}
let lastPenalty = -9;

const REACT = {

let arcs = [];
function penalty(msg, at, kind){
  if(solved || failed) return;
  if(drag&&drag.penalized)return;
  if(tNow - lastPenalty < 0.9) return;   /* one mistake per action, not per frame */
  lastPenalty = tNow;

  strikes = Math.max(0, strikes - 1);

}

  /* magnetic pin — drag the magnet outside, line the pin up with the slot */
  magpin:{
    tools:['magnet'], range:78,
    hit(c,p,f){ return f.front && dist(p,{x:f.x,y:c.y+c.slide}) < 26; },
    pull(c, m, dt, f){
      const head = {x:f.x, y:c.y + c.slide};
      const d = dist(m, head);
      if(d > TYPE.magpin.range) return;
      /* magnet + live electronics: the lock jams instead of moving */
      const sw = c.powerFrom ? byId(c.powerFrom) : null;
      if(sw && sw.on){
        if(!c.zapped){
          c.zapped = true;
          penalty('Devre açıkken mıknatıs pimi kilitledi. Önce gücü kes.', head, 'circuit');
          audio.shock();
        }
        return;
      }
      const want = clamp(m.y - c.y, c.min, c.max);
      const k = Math.pow(1 - d/TYPE.magpin.range, 0.6) * 5.5 * dt;
      const was = c.slide;
      c.slide = lerp(c.slide, want, clamp(k,0,1));
      if(Math.abs(c.slide-was)>.01)useful();
      if(Math.abs(c.slide-was) > 0.4 && Math.random()<0.25) audio.tick();
      if(Math.abs(c.slide - c.slot) < 7){ audio.snap(); finish(c); }

    draw(c,f){
      const y = c.y + c.slide;

      ctx.save();

      ctx.beginPath(); ctx.moveTo(f.x-15, c.y+c.slot); ctx.lineTo(f.x+15, c.y+c.slot); ctx.stroke();
      ctx.setLineDash([]);

  chip:{

      ctx.fillStyle = c.fried > 0 ? '#8a5a5a' : '#4a5560';

      ctx.strokeStyle='#2f3840'; ctx.lineWidth=1.2; ctx.stroke();

      ctx.fillStyle = c.fried > 0 ? '#ff6a58' : (blink ? '#6fd3a0' : '#33604a');

      for(let i=-1;i<=1;i++){

        ctx.beginPath(); ctx.moveTo(15, i*7); ctx.lineTo(20, i*7); ctx.stroke();

  /* door — swings open once unlocked */
  door:{
    tools:['hand'],
    hit(c,p,f){ return f.front && Math.abs(p.x-f.x) < c.w/2+10 && Math.abs(p.y-c.y) < c.h/2+8; },
    move(c,g){
      c.ang = clamp(c.ang + g.dx/90, 0, 1.2);
      if(c.ang > 0.9) finish(c);
    },
    draw(c,f){
      ctx.translate(f.x - c.w/2, c.y); ctx.rotate(c.ang);

    }
  },

  /* the thing being saved */
  rescue:{
    tools:['hand'],
    hit(c,p,f){ return (c.free||f.front) && dist(p,{x:(c.free?c.fx:f.x)+0, y:c.y+(c.oy||0)}) < 30; },
    start(c){ c.held = true; if(!c.free){ const x=faceOf(c).x;c.free = true; c.fx = x; } useful(); },
    move(c,g){ c.fx += g.dx; c.oy = (c.oy||0) + g.dy; },
    end(c){
      c.held = false;
      const p = {x:c.fx, y:c.y+(c.oy||0)};
      if(p.y > BENCH + 40){ critical('Düştü', 'Kurtardığın şey tezgâhtan düştü. Bir dahakine mindere bırak.', p); return; }
      if(dist(p, level.mat) < 42){ finish(c); win(); }
    },
    draw(c,f){
      const x = c.free ? c.fx : f.x, y = c.y + (c.oy||0);
      ctx.translate(x, y);
      const K = 1.32;                       /* the creature is the emotional hook: give it room */
      if(c.held) ctx.scale(1.08*K,1.08*K); else ctx.scale(f.scale*K, f.scale*K);
      const worry = solved ? 0 : Math.sin(tNow*4)*2;
      ctx.translate(0, solved ? -Math.abs(Math.sin(tNow*9))*7 : worry);
      (ART[c.art]||ART.gem)(c);
    }
  }

/* One readable face drives all of them: big eyes, a highlight, brows that
   carry the mood. Worried while trapped, beaming once it is safe. */
function face(o){
  o = o || {};
  const ex = o.ex || 6.4, ey = o.ey || 0, r = o.r || 5.2;
  const dark = o.dark || '#2c2a33';
  const blink = Math.sin(tNow*1.7) > 0.94 ? 0.12 : 1;   /* occasional blink */

  /* eyes */
  ctx.fillStyle = dark;
  for(const s of [-1,1]){
    ctx.save();
    ctx.translate(s*ex, ey); ctx.scale(1, blink);
    ctx.beginPath(); ctx.ellipse(0,0,r,r*1.12,0,0,TAU); ctx.fill();
    ctx.restore();
  }
  if(blink > 0.5){
    ctx.fillStyle='#ffffff';
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.arc(s*ex - 1.7, ey - 1.9, r*0.38, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*ex + 1.9, ey + 1.6, r*0.17, 0, TAU); ctx.fill();
    }
  }
  /* blush */
  ctx.fillStyle = o.blush || 'rgba(255,140,130,.42)';
  for(const s of [-1,1]){
    ctx.beginPath(); ctx.ellipse(s*(ex+5.4), ey+5.2, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  }
  /* brows + mouth: the whole emotional read */
  ctx.strokeStyle = dark; ctx.lineWidth = 1.7; ctx.lineCap='round';
  if(solved){
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.arc(s*ex, ey-1, r*1.5, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    }
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, ey+5.5, 4.6, 0.12*Math.PI, 0.88*Math.PI); ctx.stroke();
  } else {
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*(ex+4.4), ey-r-3.4);
      ctx.lineTo(s*(ex-3.4), ey-r-1.1);
      ctx.stroke();
    }
    ctx.lineWidth = 1.9;
    ctx.beginPath();
    ctx.arc(0, ey+9.4, 3.7, Math.PI*1.18, Math.PI*1.82);
    ctx.stroke();
  }
}

/* ===================== input ===================== */
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left - offX)/scale, y:(e.clientY - r.top - offY)/scale};
}
function pick(p){
  let best = null, bestDepth = -2;
  for(const c of comps){
    if(c.done || c.hidden || c.noPick) continue;
    const T = TYPE[c.type], f = faceOf(c);
    const hit = T.hit ? T.hit(c,p,f)
                      : (f.front && dist(p,{x:f.x,y:c.y}) < Math.max(T.hitR||24,22/scale));
    if(hit && f.depth > bestDepth){ best = c; bestDepth = f.depth; }
  }
  return best;
}
function onDown(e){
  if(solved || failed || activePointer!==null || e.isPrimary===false) return;
  activePointer=e.pointerId;
  rotVel=0;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  audio.unlock();
  const p = toWorld(e);
  if(tool)toolFx={tool,x:p.x,y:p.y,life:.24};
  drag = {p, start:p, moved:0, comp:null, rotating:false, tapped:false};

  if(tool === 'magnet'){ magnetAt = p; checkChip(p); return; }

  const c = pick(p);
  if(!c){
    /* no tool: drag anywhere turns the object. Tool in hand: the object surface
       belongs to the tool, so turning is done on the background around it. */
    const onShell = Math.abs(p.x - shell.cx) < shell.w/2 + 16 &&
                    Math.abs(p.y - shell.cy) < shell.h/2 + 16;
    drag.rotating = !tool || !onShell;
    return;
  }

  /* hammer is a risk, not a key */
  if(tool === 'hammer'){
    freeze=reduced?0:.055;shake=Math.max(shake,reduced?0:.35);audio.thud();
    if(c.glass || c.type === 'rescue'){
      critical('Kırdın', 'Çekici kırılgan bir parçanın üstünde kullandın. Bu oyunda çekiç her kapıyı açmaz.',
               {x:faceOf(c).x, y:c.y});
      return;
    }
    soft(c, 'Çekiç burada işe yaramaz.');
    return;
  }
  if(!accepts(c, tool)){ soft(c, tool ? 'Bu burada işe yaramaz.' : 'Önce bir alet seç.'); return; }
  if(locked(c)){ soft(c, c.lockMsg || 'Burası henüz açılmıyor.'); return; }

  drag.comp = c;
  const T = TYPE[c.type];
  if(T.start) T.start(c, {p});
}
function onMove(e){
  if(!drag || solved || failed || e.pointerId!==activePointer) return;
  e.preventDefault();
  const p = toWorld(e);
  if(toolFx){toolFx.x=p.x;toolFx.y=p.y;toolFx.life=.24;}
  const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
  drag.moved += Math.hypot(dx,dy);

  if(tool === 'magnet'){ magnetAt = p; drag.p = p; checkChip(p); return; }
  /* the cutter sweeps: the stroke does not have to begin on the cable.
     If it actually crosses something, that drag stops being a rotation. */
  if(tool === 'cutter'){
    let acted = false;
    for(const c of comps){
      if(c.done || c.hidden) continue;
      if(c.type !== 'cable' && c.type !== 'strip') continue;
      const f = faceOf(c);
      const samples=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
      let crossed=false;
      for(let i=0;i<=samples;i++)if(TYPE[c.type].hit(c,{x:lerp(drag.p.x,p.x,i/samples),y:lerp(drag.p.y,p.y,i/samples)},f)){crossed=true;break;}
      if(!crossed)continue;
      acted = true;
      if(locked(c)){ soft(c, c.lockMsg); continue; }
      TYPE[c.type].cut(c);
    }
    if(acted){ drag.rotating = false; drag.p = p; return; }
  }
  if(drag.rotating){
    rotY += dx*0.016;
    rotVel = dx*0.002;
    drag.p = p;
    return;
  }
  const c = drag.comp;
  if(c && !c.done && TYPE[c.type].move) TYPE[c.type].move(c, {p, dx, dy});
  drag.p = p;
}
let activePointer=null;
function onUp(e){
  if(e&&e.pointerId!==activePointer)return;
  activePointer=null;
  magnetAt = null;
  comps.forEach(c=>{ c.zapped = false; });
  if(!drag) return;
  const c = drag.comp;
  if(c && !c.done){
    const T = TYPE[c.type];
    if(drag.moved < 8 && T.tap) T.tap(c);
    else if(T.end) T.end(c);
  }
  drag = null;
}
function cancelGesture(e){
  if(e&&e.pointerId!=null&&e.pointerId!==activePointer)return;
  if(drag&&drag.comp){const c=drag.comp;if(c.type==='panel')TYPE.panel.end(c);if(c.type==='rescue')c.held=false;}
  activePointer=null;drag=null;magnetAt=null;rotVel=0;toolFx=null;
  comps.forEach(c=>c.zapped=false);
}
function checkChip(p){
  for(const c of comps){
    if(c.type !== 'chip') continue;
    const f = faceOf(c);
    if(f.depth < -0.2) continue;          /* a chip at the silhouette edge is still close by */
    if(dist(p, {x:f.x, y:c.y}) < 46 && c.fried <= 0){
      c.fried = 2.2;
      penalty('Mıknatıs devreye çok yaklaştı!', {x:f.x, y:c.y}, 'circuit');
    }
  }
}

/* ===================== update ===================== */
function update(dt){
  tNow += dt;
  if(freeze > 0){ freeze -= dt; dt = 0; }

  if(Math.abs(rotY) > 0.35) rotatedOnce = true;
  if(!drag || !drag.rotating){
    rotY += rotVel*dt*60;
    rotVel *= Math.pow(0.02, dt);
    if(Math.abs(rotVel) < 0.0004) rotVel = 0;
  }

  if(dt > 0){
    if(toolFx){toolFx.life-=dt;if(toolFx.life<=0)toolFx=null;}
    if(magnetAt){
      for(const c of comps){
        if(c.done || c.type !== 'magpin' || locked(c)) continue;
        const f = faceOf(c);
        if(f.front) TYPE.magpin.pull(c, magnetAt, dt, f);
      }
    }
    for(const c of comps){
      c.shake *= Math.pow(0.002, dt);
      if(c.done && c.gone < 1) c.gone = Math.min(1, c.gone + dt*2.2);
      if(c.fried > 0) c.fried -= dt;
      const want = (tool && accepts(c,tool) && !c.done && !locked(c) && faceOf(c).front) ? 1 : 0;
      c.glow += (want - c.glow)*Math.min(1, dt*7);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.life += dt;
    if(q.life >= q.max){ particles.splice(i,1); continue; }
    q.vy += (q.kind==='dust' ? 40 : q.kind==='star' ? 30 : 900)*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    if(q.rv) q.rot += q.rv*dt;
    if(q.kind==='dust') q.r += dt*22;
  }
  for(let i=arcs.length-1;i>=0;i--){ arcs[i].life+=dt; if(arcs[i].life>=arcs[i].max) arcs.splice(i,1); }
  shake *= Math.pow(0.004, dt);
  if(shake < 0.002) shake = 0;
  flash *= Math.pow(0.0009, dt);

  /* hint after a quiet spell */
  if(!solved && !failed && !drag && tNow - lastUseful > 10 && tNow>hintUntil+6){
    hintShown++;
    const n = nextStep();
    if(n){
      const f = faceOf(n);
      hintTarget=n.id;hintUntil=tNow+3;
      if(!f.front){say('Bir de diğer tarafına bak.');document.getElementById('inspectBtn').classList.add('hinted');}
      else {say(n.type==='rescue'?'Şimdi mindere taşı.':(PART_NAME[n.type]||'Parça')+' dikkatini bekliyor.');const b=n.tools.includes('hand')?document.getElementById('inspectBtn'):toolbar.querySelector('[data-tool="'+n.tools[0]+'"]');if(b){b.classList.remove('hinted');void b.offsetWidth;b.classList.add('hinted');}}
    }
  }
}
function nextStep(){
  for(const c of comps) if(!c.done && !c.hidden && !locked(c) && c.type !== 'chip') return c;
  return null;
}

/* ===================== render ===================== */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const sx = shake ? (Math.random()*2-1)*7*shake : 0;
  const sy = shake ? (Math.random()*2-1)*7*shake : 0;
  ctx.save();
  ctx.translate(offX + sx*scale, offY + sy*scale);
  ctx.scale(scale, scale);

  drawRoom();
  drawMat();
  drawShell();
  if(!rotatedOnce) drawTurnHint();
  if(hintTarget&&tNow<hintUntil&&!faceOf(byId(hintTarget)).front&&rotatedOnce)drawTurnHint();

  /* back-facing parts first, then the shell body already drawn, then front parts */
  const order = comps.slice().sort((a,b)=>faceOf(a).depth - faceOf(b).depth);
  for(const c of order){
    if(c.hidden) continue;
    if(c.done && c.gone >= 1 && c.type !== 'rescue') continue;
    const f = faceOf(c);
    if(f.alpha <= 0.02) continue;
    ctx.save();
    ctx.globalAlpha = f.alpha;
    if(c.shake > 0.01) ctx.translate(Math.sin(tNow*52)*c.shake*4, 0);
    if(c.glow > 0.02 && !c.done) drawGlow(c, f);
    ctx.save();TYPE[c.type].draw(c, f);ctx.restore();
    drawPartFeedback(c,f);
    ctx.restore();
  }

  if(level.gauge) drawGauge();
  drawArcs();
  drawParticles();
  if(magnetAt) drawMagnet();
  drawToolFeedback();
  ctx.restore();

  if(flash > 0.01){
    ctx.fillStyle = 'rgba('+flashCol+','+(flash*0.5)+')';
    ctx.fillRect(0,0,cssW,cssH);
  }
}
function drawRoom(){
  const px = offX/scale + 4, py = offY/scale + 4;
  const x0 = -px, x1 = W+px, y0 = -py, y1 = H+py;

  /* back wall */
  const g = ctx.createLinearGradient(0,y0,0,BENCH);
  g.addColorStop(0, theme.wallA); g.addColorStop(1, theme.wallB);
  ctx.fillStyle=g; ctx.fillRect(x0,y0,x1-x0,BENCH-y0);

  /* pegboard: quiet texture, never louder than the object */
  ctx.save();
  ctx.globalAlpha=.26; ctx.fillStyle='#a07c4e';
  for(let yy=y0+18; yy<330; yy+=17)
    for(let xx=x0+14; xx<x1; xx+=17){ ctx.beginPath(); ctx.arc(xx,yy,1.5,0,TAU); ctx.fill(); }
  ctx.restore();

  /* shelf with jars and a mug */
  ctx.save();
  ctx.globalAlpha=.85;
  ctx.fillStyle='#b98a55'; ctx.beginPath(); rr(ctx,x0,118,x1-x0,9,3); ctx.fill();
  ctx.fillStyle='#8d6537'; ctx.fillRect(x0,127,x1-x0,4);
  const jar=(x,c,h)=>{ ctx.fillStyle=c; ctx.beginPath(); rr(ctx,x,118-h,20,h,4); ctx.fill();
                       ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fillRect(x+3,118-h+4,4,h-9); };
  jar(26,'#9dbfa6',30); jar(52,'#d0a36f',22); jar(78,'#b6a7cf',34);
  jar(300,'#e0a08a',26); jar(326,'#9fc0cf',32);
  /* mug */
  ctx.fillStyle='#f2ece0'; ctx.beginPath(); rr(ctx,352,92,26,26,6); ctx.fill();
  ctx.strokeStyle='#cfc3b0'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(381,105,7,-1.3,1.3); ctx.stroke();
  ctx.fillStyle='#c98a6a'; ctx.beginPath(); ctx.arc(365,99,9,0,TAU); ctx.fill();
  ctx.restore();

  /* hanging tool silhouettes on the pegboard */
  ctx.save();
  ctx.globalAlpha=.2; ctx.strokeStyle='#5d4024'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(44,158); ctx.lineTo(44,196); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30,158); ctx.lineTo(58,158); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(330,160); ctx.lineTo(330,200); ctx.stroke();
  ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(330,160); ctx.lineTo(344,160); ctx.stroke();
  ctx.restore();

  /* sticky notes — charm, not information */
  const note=(x,y,rot,col,lines)=>{
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.shadowColor='rgba(80,50,20,.22)'; ctx.shadowBlur=6; ctx.shadowOffsetY=3;
    ctx.fillStyle=col; ctx.beginPath(); rr(ctx,-21,-21,42,42,3); ctx.fill();
    ctx.shadowColor='transparent';
    ctx.strokeStyle='rgba(90,60,25,.3)'; ctx.lineWidth=1.6; ctx.lineCap='round';
    lines.forEach((w,i)=>{ ctx.beginPath(); ctx.moveTo(-13,-10+i*8); ctx.lineTo(-13+w,-10+i*8); ctx.stroke(); });
    ctx.restore();
  };
  note(52,236,-.11,'#ffe08a',[24,18,22]);
  note(344,232,.13,'#bfe3c4',[20,24,14]);

  /* desk lamp glow pooling on the bench */
  const lg = ctx.createRadialGradient(186, 286, 20, 186, 320, 300);
  lg.addColorStop(0,'rgba(255,235,190,.55)'); lg.addColorStop(1,'rgba(255,235,190,0)');
  ctx.fillStyle=lg; ctx.fillRect(x0,y0,x1-x0,BENCH-y0);

  /* bench front + worktop */
  ctx.fillStyle = theme.benchDark; ctx.fillRect(x0,BENCH,x1-x0,y1-BENCH);
  const tg = ctx.createLinearGradient(0,BENCH,0,BENCH+28);
  tg.addColorStop(0, theme.benchA); tg.addColorStop(1, theme.benchB);
  ctx.fillStyle=tg; ctx.fillRect(x0,BENCH,x1-x0,28);
  const top=ctx.createLinearGradient(0,425,0,BENCH);
  top.addColorStop(0,'#d9b684'); top.addColorStop(1,theme.benchA);
  ctx.fillStyle=top; ctx.fillRect(x0,425,x1-x0,BENCH-425);
  ctx.strokeStyle='rgba(120,78,40,.14)'; ctx.lineWidth=1;
  for(let i=0;i<7;i++){ ctx.beginPath(); ctx.moveTo(x0,435+i*7);
    ctx.bezierCurveTo(100,430+i*7,260,442+i*7,x1,435+i*7); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,240,210,.45)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x0,BENCH+1); ctx.lineTo(x1,BENCH+1); ctx.stroke();

  /* green cutting mat under the work area */
  ctx.save();
  ctx.globalAlpha=.55;
  ctx.fillStyle='#5d7f63'; ctx.beginPath(); rr(ctx,46,430,300,40,6); ctx.fill();
  ctx.strokeStyle='rgba(230,245,225,.3)'; ctx.lineWidth=1;
  for(let i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(46+i*30,430); ctx.lineTo(46+i*30,470); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(46,450); ctx.lineTo(346,450); ctx.stroke();
  ctx.restore();

  /* a few loose screws on the bench */
  ctx.save(); ctx.globalAlpha=.7; ctx.fillStyle='#9aa0a6';
  for(const [sx,sy,a] of [[74,474,.4],[92,468,-.7],[318,472,.2],[336,466,1.1]]){
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(a);
    ctx.beginPath(); rr(ctx,-6,-2,12,4,2); ctx.fill();
    ctx.beginPath(); ctx.arc(-6,0,3,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawMat(){
  const m = level.mat;
  const free = comps.some(c=>c.type==='rescue' && !locked(c) && !c.done);
  ctx.save();
  ctx.shadowColor='#50351b33';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  ctx.fillStyle='#7c9d85';ctx.beginPath();rr(ctx,m.x-34,m.y-29,68,58,17);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle='#e0ead099';ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();rr(ctx,m.x-28,m.y-23,56,46,12);ctx.stroke();ctx.setLineDash([]);
  ctx.font='bold 8px Figtree,sans-serif';ctx.textAlign='center';ctx.fillStyle='#f8f3df';ctx.fillText(solved?'GÜVENDE':'MİNDER',m.x,m.y+19);
  const pulse = free ? 1+Math.sin(tNow*3)*0.05 : 1;
  const g = ctx.createRadialGradient(m.x,m.y,3,m.x,m.y,36*pulse);
  g.addColorStop(0, free?'rgba(224,122,75,.3)':'rgba(120,90,60,.13)');
  g.addColorStop(1,'rgba(224,122,75,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(m.x,m.y,36*pulse,0,TAU); ctx.fill();
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = free?'rgba(224,122,75,.85)':'rgba(120,90,60,.3)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(m.x,m.y,28*pulse,0,TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
/* ===================== materials =====================
   Everything is lit from the upper-left. Each helper paints a real surface:
   planks with grain, brushed metal with a specular band, glass with a
   reflection streak, paper with a curled corner. */
const LIGHT = {x:-0.55, y:-0.83};

function noiseAt(x,y,seed){
  const n = Math.sin(x*12.9898 + y*78.233 + (seed||0)*3.7) * 43758.5453;
  return n - Math.floor(n);
}
/* soft inner shadow around the inside of a rounded rect */
function innerShade(x,y,w,h,r,amt){
  ctx.save();
  ctx.beginPath(); rr(ctx,x,y,w,h,r); ctx.clip();
  const g = ctx.createLinearGradient(x,y,x+w*0.25,y+h);
  g.addColorStop(0,'rgba(255,255,255,'+(amt*0.55)+')');
  g.addColorStop(0.35,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  const g2 = ctx.createLinearGradient(x+w,y+h,x+w*0.7,y);
  g2.addColorStop(0,'rgba(0,0,0,'+(amt*0.5)+')');
  g2.addColorStop(0.4,'rgba(0,0,0,0)');
  ctx.fillStyle=g2; ctx.fillRect(x,y,w,h);
  ctx.restore();
}
/* worn wooden planks running across the body */
function wood(x, y, w, h, base, seed, planks){
  const n = planks || Math.max(3, Math.round(h/34));
  const ph = h/n;
  for(let i=0;i<n;i++){
    const py = y + i*ph;
    const v = (noiseAt(i,seed||1,3)-0.5)*0.13;
    const g = ctx.createLinearGradient(x, py, x, py+ph);
    g.addColorStop(0, shadeCol(base, 0.16+v));
    g.addColorStop(0.45, shadeCol(base, 0.02+v));
    g.addColorStop(1, shadeCol(base, -0.16+v));
    ctx.fillStyle=g;
    ctx.fillRect(x, py, w, ph+0.6);
    /* groove between planks */
    ctx.fillStyle='rgba(40,22,8,.34)';
    ctx.fillRect(x, py+ph-2.2, w, 2.2);
    ctx.fillStyle='rgba(255,232,190,.16)';
    ctx.fillRect(x, py+ph, w, 1);
    /* grain */
    ctx.strokeStyle='rgba(70,40,14,.17)'; ctx.lineWidth=1;
    for(let k=0;k<3;k++){
      const gy = py + ph*(0.22+0.26*k) + (noiseAt(i,k,seed||1)-0.5)*4;
      ctx.beginPath(); ctx.moveTo(x, gy);
      ctx.bezierCurveTo(x+w*0.3, gy-2.4, x+w*0.65, gy+2.4, x+w, gy);
      ctx.stroke();
    }
    /* an occasional knot */
    if(noiseAt(i, seed||1, 9) > 0.72){
      const kx = x + w*(0.2+0.6*noiseAt(i,2,seed||1)), ky = py+ph*0.5;
      ctx.strokeStyle='rgba(70,40,14,.3)';
      for(let r=2;r<7;r+=2){
        ctx.beginPath(); ctx.ellipse(kx,ky,r,r*0.66,0.5,0,TAU); ctx.stroke();
      }
    }
  }
}
/* brushed metal plate with a moving specular band */
function metal(x, y, w, h, r, base, vertical){
  const g = vertical
    ? ctx.createLinearGradient(x, y, x, y+h)
    : ctx.createLinearGradient(x, y, x+w, y);
  const hi = clamp(0.5 + Math.sin(rotY)*0.3, 0.08, 0.92);
  g.addColorStop(0, shadeCol(base,-0.34));
  g.addColorStop(Math.max(0.02,hi-0.22), shadeCol(base,-0.05));
  g.addColorStop(hi, shadeCol(base, 0.5));
  g.addColorStop(Math.min(0.98,hi+0.2), shadeCol(base,-0.08));
  g.addColorStop(1, shadeCol(base,-0.38));
  ctx.fillStyle=g;
  ctx.beginPath(); rr(ctx,x,y,w,h,r||3); ctx.fill();
  /* top bevel + bottom contact line */
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x+2, y+1); ctx.lineTo(x+w-2, y+1); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.moveTo(x+2, y+h-1); ctx.lineTo(x+w-2, y+h-1); ctx.stroke();
}
function rivet(x, y, r){
  r = r || 3.2;
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.arc(x, y+1.1, r, 0, TAU); ctx.fill();
  const g = ctx.createRadialGradient(x-r*0.4, y-r*0.45, r*0.1, x, y, r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.4,'#c9d0d6'); g.addColorStop(1,'#6f7880');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle='rgba(30,36,42,.5)'; ctx.lineWidth=0.8; ctx.stroke();
}
/* thick framed glass with a reflection streak */
function glassPane(x, y, w, h, r){
  ctx.save();
  ctx.beginPath(); rr(ctx,x,y,w,h,r); ctx.clip();
  const g = ctx.createLinearGradient(x, y, x+w*0.5, y+h);
  g.addColorStop(0,'rgba(150,196,200,.5)');
  g.addColorStop(0.5,'rgba(70,120,128,.34)');
  g.addColorStop(1,'rgba(40,78,86,.44)');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.beginPath();
  ctx.moveTo(x+w*0.08, y+h); ctx.lineTo(x+w*0.42, y);
  ctx.lineTo(x+w*0.60, y); ctx.lineTo(x+w*0.26, y+h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath();
  ctx.moveTo(x+w*0.62, y+h); ctx.lineTo(x+w*0.80, y);

function drawShell(){

    ctx.strokeStyle='#e1e8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,y,12,0,TAU);ctx.stroke();
  }
  const g = ctx.createRadialGradient(m.x,m.y,4,m.x,m.y,R);
  g.addColorStop(0,'rgba(127,147,224,.24)'); g.addColorStop(1,'rgba(127,147,224,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(m.x,m.y,R,0,TAU); ctx.fill();
  ctx.setLineDash([5,7]); ctx.strokeStyle='rgba(127,147,224,.45)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(m.x,m.y,R,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.translate(m.x,m.y);
  ctx.strokeStyle='#7f93e0'; ctx.lineWidth=9;
  ctx.beginPath(); ctx.arc(0,2,12,Math.PI,0); ctx.stroke();
  ctx.strokeStyle='#d8dffb'; ctx.lineWidth=9;
  ctx.beginPath(); ctx.moveTo(-12,2); ctx.lineTo(-12,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,2); ctx.lineTo(12,10); ctx.stroke();
  ctx.restore();
}
function shadeCol(hex, amt){
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const f = v => clamp(Math.round(amt>0 ? v + (255-v)*amt : v*(1+amt)), 0, 255);
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function hexA(hex, a){
  if(!hex || hex[0] !== '#') return 'rgba(230,222,208,'+a+')';
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ===================== UI ===================== */
const lvTag = document.getElementById('lvTag');
const objectiveEl = document.getElementById('objective');
const sayEl = document.getElementById('say');
const pipsEl = document.getElementById('pips');
const toolbar = document.getElementById('toolbar');

let sayT = 0;
function say(msg, bad){
  if(!msg) return;
  sayEl.textContent = msg;
  sayEl.classList.toggle('bad', !!bad);
  sayEl.classList.add('show');
  clearTimeout(sayT);
  sayT = setTimeout(()=>sayEl.classList.remove('show'), bad ? 2400 : 1800);

function paintPips(){
  pipsEl.setAttribute('aria-label',strikes+' hata hakkı kaldı');
  pipsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const d = document.createElement('div');
    d.className = 'pip' + (i < strikes ? '' : ' gone');
    pipsEl.appendChild(d);
  }
}
function paintTools(){
  toolbar.innerHTML = '';
  TOOLS.filter(t=>!level||LEVEL_TOOLS[lvIndex].includes(t.id)).forEach(t=>{
    const b = document.createElement('button');
    b.type='button';
    b.setAttribute('data-tool',t.id);
    b.setAttribute('aria-label',t.label);
    b.className = 'tool' + (tool===t.id ? ' on' : '');
    b.style.setProperty('--tc','var('+t.css+')');
    b.setAttribute('aria-pressed', String(tool===t.id));
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
      'stroke-linecap="round" stroke-linejoin="round">'+TOOL_ICON[t.id]+'</svg><span>'+t.label+'</span>';
    b.addEventListener('click', ()=>{ cancelGesture();tool = (tool===t.id)?null:t.id; audio.unlock();audio.click(); paintTools(); });
    toolbar.appendChild(b);
  });
  document.getElementById('toolHint').textContent=TOOL_HELP[tool]||'Boş alanda sürükle, her tarafına bak.';
  const b=document.getElementById('inspectBtn');b.classList.toggle('on',!tool);b.setAttribute('aria-pressed',String(!tool));
}
function paintProgress(){
  const steps=comps.filter(c=>!c.noPick&&c.type!=='chip');
  const complete=steps.filter(c=>c.done).length;
  document.getElementById('progressFill').style.width=(complete/Math.max(1,steps.length)*100)+'%';
  document.getElementById('progressText').textContent=complete+' / '+steps.length+' adım';
}
document.getElementById('inspectBtn').addEventListener('click',()=>{cancelGesture();tool=null;paintTools();});

cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', cancelGesture);
window.addEventListener('blur',cancelGesture);
cv.addEventListener('lostpointercapture',cancelGesture);
stage.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

btnReset.addEventListener('click', ()=>buildLevel(lvIndex));
retryBtn.addEventListener('click', ()=>{ sheet.classList.remove('show'); buildLevel(lvIndex); });
nextBtn.addEventListener('click', ()=>{

btnSnd.addEventListener('click', ()=>{

/* ===================== loop ===================== */
let last = performance.now(), lastRaf = 0, fallbackTimer = 0, frameCount = 0;
function tick(now){
  const dt = Math.min(0.032, (now-last)/1000);
  last = now; frameCount++;
  update(dt); render();
}
function frame(now){ lastRaf = performance.now(); tick(now); requestAnimationFrame(frame); }
function startLoop(){
  render();
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if(typeof setInterval === 'function' && !fallbackTimer)
    fallbackTimer = setInterval(()=>{ if(performance.now()-lastRaf > 200) tick(performance.now()); }, 33);
}

/* ===================== test hooks ===================== */
window.__RW = {
  go: buildLevel,
  cancel:cancelGesture,
  pointer(phase,p,id=1){raw({down:onDown,move:onMove,up:onUp,cancel:cancelGesture}[phase],p,id);},
  levels: LEVELS.length,
  pick(t){ tool = t; paintTools(); return tool; },
  spin(rad){ rotY += rad; rotVel = 0; },
  setRot(rad){ rotY = rad; rotVel = 0; },
  step(dt,n){ for(let i=0;i<(n||1);i++) update(dt||1/60); },
  at(id){ const c = byId(id); if(!c) return null; const f = faceOf(c); return {x:f.x, y:c.y, front:f.front, depth:+f.depth.toFixed(2)}; },
  gesture(pts, opt){
    opt = opt||{};
    raw(onDown, pts[0]);
    for(let i=1;i<pts.length;i++){ raw(onMove, pts[i]); if(opt.step) update(1/60); }
    onUp();
    return this.info;
  },
  swipe(a,b,n,opt){
    const pts=[]; const k=n||12;
    for(let i=0;i<k;i++){ const t=i/(k-1); pts.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
    return this.gesture(pts,opt);
  },
  hold(p,frames){
    raw(onDown,p);
    for(let i=0;i<(frames||60);i++){ raw(onMove,p); update(1/60); }
    onUp();
    return this.info;
  },
  tap(p){ raw(onDown,p); onUp(); return this.info; },
  get info(){
    return {
      level: lvIndex+1, tool, solved, failed, strikes, frames: frameCount,
      hint:hintTarget, hintActive:tNow<hintUntil, softMistakes, dragging:!!drag, particles:particles.length,
      rot:+rotY.toFixed(2),
      comps: comps.map(c=>({id:c.id, type:c.type, done:c.done, prog:+(c.prog||0).toFixed(2),
        locked:locked(c), front:faceOf(c).front, on:c.on, slide:c.slide!=null?Math.round(c.slide):undefined,
        fried:c.fried>0})),
      say: sayEl.textContent,
      verdict: sheet.classList.contains('show') ? vtitle.textContent : null
    };
  }
};
function raw(fn, p, id=1){
  const r = cv.getBoundingClientRect();
  fn({clientX:r.left+offX+p.x*scale, clientY:r.top+offY+p.y*scale, pointerId:id,isPrimary:id===1, preventDefault(){}});
}

/* ===================== boot ===================== */
let booted = false;
function start(data){
  if(booted) return;
  booted = true;
  resize();
  paintTools();
  const linkedLevel=/[?&]bolum=(\d+)/.exec(window.location?.search||'');
  buildLevel(data && typeof data.level === 'number' ? data.level : linkedLevel?Number(linkedLevel[1])-1:0);
  startLoop();
}
(function boot(){
  let hot = null;
  try{ hot = window.claude && window.claude.hot; }catch(e){}
  try{ if(hot && typeof hot.snapshot === 'function') hot.snapshot(()=>({level:lvIndex})); }catch(e){}
  try{
    if(hot && typeof hot.ready === 'function'){
      hot.ready(d=>start(d||{}));
      setTimeout(()=>start((hot&&hot.data)||{}), 500);
      return;
    }
  }catch(e){}
  start((hot&&hot.data)||{});
})();
})();
