<title>Rescue Workshop</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --wall-a:#f7eee1;
    --wall-b:#ecdcc6;
    --bench-a:#c99257;
    --bench-b:#a9743f;
    --bench-dark:#7d5228;
    --ink:#3a2a1c;
    --ink-2:#7a6450;
    --ink-3:#a89178;
    --card:#fffaf2;
    --card-line:rgba(120,84,46,.16);
    --chip:rgba(120,84,46,.08);
    --chip-line:rgba(120,84,46,.16);
    --accent:#e07a4b;
    --good:#3f9a6b;
    --bad:#cf4436;
    --shadow:0 14px 32px -16px rgba(80,50,20,.5);
    --t-hammer:#e8836b;
    --t-screwdriver:#dda93f;
    --t-cutter:#4fb995;
    --t-magnet:#7f93e0;
    --t-suction:#b98fd6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wall-a:#2a201a;
      --wall-b:#181210;
      --bench-a:#8a5f33;
      --bench-b:#654223;
      --bench-dark:#402816;
      --ink:#f8efe2;
      --ink-2:#cbb49b;
      --ink-3:#947e68;
      --card:#2c221b;
      --card-line:rgba(255,236,214,.13);
      --chip:rgba(255,236,214,.08);
      --chip-line:rgba(255,236,214,.16);
      --accent:#ff9560;
      --good:#4fc08a;
      --bad:#ff6a58;
      --shadow:0 18px 40px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --wall-a:#2a201a; --wall-b:#181210;
    --bench-a:#8a5f33; --bench-b:#654223; --bench-dark:#402816;
    --ink:#f8efe2; --ink-2:#cbb49b; --ink-3:#947e68;
    --card:#2c221b; --card-line:rgba(255,236,214,.13);
    --chip:rgba(255,236,214,.08); --chip-line:rgba(255,236,214,.16);
    --accent:#ff9560; --good:#4fc08a; --bad:#ff6a58;
    --shadow:0 18px 40px -18px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    margin:0;background:var(--wall-b);color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  /* fixed to the viewport: never depends on html/body resolving a height,
     which can collapse to 0 inside a content-sized frame */
  #app{
    position:fixed;inset:0;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    max-width:520px;margin-inline:auto;padding-inline:12px;
  }

  /* ---------- top: level + objective only ---------- */
  .hud{padding-block:11px 7px;display:flex;align-items:center;gap:10px}
  .lv{
    flex:none;font-size:11.5px;font-weight:700;letter-spacing:.03em;
    padding:5px 10px;border-radius:9px;
    background:var(--chip);border:1px solid var(--chip-line);color:var(--ink-2);
  }
  .obj{
    flex:1;min-width:0;margin:0;
    font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(16px,4.7vw,20px);line-height:1.15;
    letter-spacing:-.015em;text-wrap:balance;
  }
  .icon-btn{
    flex:none;width:36px;height:36px;border-radius:11px;
    border:1px solid var(--chip-line);background:var(--chip);color:var(--ink-2);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s,color .15s;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .icon-btn svg{width:17px;height:17px;display:block}

  /* ---------- stage ---------- */
  #stage{position:relative;min-height:0;touch-action:none}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  .say{
    position:absolute;left:50%;bottom:10px;transform:translate(-50%,6px);
    background:var(--card);border:1px solid var(--card-line);
    border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);
    font-size:13px;font-weight:600;color:var(--ink-2);
    pointer-events:none;opacity:0;transition:opacity .22s,transform .22s;
    white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;
  }
  .say.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- bottom: tools ---------- */
  .tools{
    display:flex;gap:6px;padding-block:8px 12px;
    padding-bottom:max(12px,env(safe-area-inset-bottom));
  }
  .tool{
    flex:1;min-width:0;min-height:66px;
    border:1.5px solid var(--chip-line);background:var(--chip);
    border-radius:15px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-2);transition:transform .14s cubic-bezier(.2,.9,.3,1),background .18s,border-color .18s,color .18s;
    padding:4px 2px;
  }
  .tool svg{width:26px;height:26px;display:block}
  .tool span{
    font-size:10.5px;font-weight:700;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .tool:active{transform:scale(.95)}
  .tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .tool.on{
    color:#fff;transform:translateY(-4px) scale(1.05);
    border-color:transparent;
    box-shadow:0 10px 20px -8px var(--tc), 0 0 0 3px color-mix(in srgb, var(--tc) 26%, transparent);
    background:var(--tc);
  }

  /* ---------- result ---------- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(45,28,12,.36);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .24s;
  }
  .sheet.show{opacity:1;pointer-events:auto}
  .card{
    width:100%;max-width:492px;background:var(--card);
    border:1px solid var(--card-line);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
    padding:20px 18px max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.18,.9,.28,1);
  }
  .sheet.show .card{transform:translateY(0)}
  .card h2{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(25px,7.6vw,32px);line-height:1;letter-spacing:-.03em;
  }
  .card h2.good{color:var(--good)} .card h2.bad{color:var(--bad)}
  .card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:46ch}
  .acts{display:flex;gap:9px;margin-top:3px}
  .btn{
    flex:1;min-height:54px;border:0;border-radius:15px;cursor:pointer;
    font-family:Figtree,sans-serif;font-weight:700;font-size:15px;
    display:grid;place-items:center;transition:transform .12s;
  }
  .btn:active{transform:translateY(2px) scale(.985)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .ghost{background:var(--chip);color:var(--ink-2);border:1px solid var(--chip-line)}
  .go{background:linear-gradient(135deg,var(--accent),#f2a860);color:#fff;font-size:16px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.08s !important}
  }
  @media (max-height:640px){
    .tool{min-height:58px} .tool svg{width:22px;height:22px}
    .obj{font-size:15px}
  }
</style>

<div id="app" lang="tr">

  </div>
</div>

<script>
(function(){
'use strict';
/* ===================== world & math ===================== */
const W = 400, H = 620, TAU = Math.PI*2;
const TABLE_Y = 466;          /* table surface */
const TABLE_X0 = 34, TABLE_X1 = 366;   /* the slab has ends — things can go over them */

const dist  = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function polyArea(p){
  let a = 0;
  for(let i=0;i<p.length;i++){ const q = p[(i+1)%p.length]; a += p[i].x*q.y - q.x*p[i].y; }
  return a/2;
}
function polyCentroid(p){
  let a=0, cx=0, cy=0;
  for(let i=0;i<p.length;i++){
    const q = p[(i+1)%p.length];
    const cr = p[i].x*q.y - q.x*p[i].y;
    a += cr; cx += (p[i].x+q.x)*cr; cy += (p[i].y+q.y)*cr;
  }
  a /= 2;
  if(Math.abs(a) < 1e-9) return {x:p[0].x, y:p[0].y};
  return {x: cx/(6*a), y: cy/(6*a)};
}
function pointInPoly(pt, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const a = poly[i], b = poly[j];
    if((a.y > pt.y) !== (b.y > pt.y) &&
       pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y) + a.x) inside = !inside;
  }
  return inside;
}
function clipHP(poly, nx, ny, c){
  const out = [], n = poly.length;
  for(let i=0;i<n;i++){
    const A = poly[i], B = poly[(i+1)%n];
    const da = nx*A.x + ny*A.y - c, db = nx*B.x + ny*B.y - c;
    if(da <= 0) out.push(A);
    if((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da/(da-db);
      out.push({x: A.x + (B.x-A.x)*t, y: A.y + (B.y-A.y)*t});
    }
  }
  return out;
}
function segSeg(p1,p2,p3,p4){
  const d1 = (p4.x-p3.x)*(p1.y-p3.y) - (p4.y-p3.y)*(p1.x-p3.x);
  const d2 = (p4.x-p3.x)*(p2.y-p3.y) - (p4.y-p3.y)*(p2.x-p3.x);
  const d3 = (p2.x-p1.x)*(p3.y-p1.y) - (p2.y-p1.y)*(p3.x-p1.x);
  const d4 = (p2.x-p1.x)*(p4.y-p1.y) - (p2.y-p1.y)*(p4.x-p1.x);
  return ((d1>0) !== (d2>0)) && ((d3>0) !== (d4>0));
}
function polylineHitsSeg(pts, a, b){
  for(let i=1;i<pts.length;i++) if(segSeg(pts[i-1], pts[i], a, b)) return true;
  return false;
}
function distPtRect(p, r){
  const dx = Math.max(Math.abs(p.x - r.x) - r.w/2, 0);
  const dy = Math.max(Math.abs(p.y - r.y) - r.h/2, 0);
  return Math.hypot(dx, dy);
}
function distPolylineRect(pts, r){
  let m = Infinity;
  for(let i=1;i<pts.length;i++)
    for(let s=0;s<=4;s++){
      const t = s/4;
      m = Math.min(m, distPtRect({x:lerp(pts[i-1].x,pts[i].x,t), y:lerp(pts[i-1].y,pts[i].y,t)}, r));
    }
  return m;
}
function distPtSeg(p,a,b){
  const dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx + dy*dy;
  if(L2 < 1e-9) return dist(p,a);
  const t = clamp(((p.x-a.x)*dx + (p.y-a.y)*dy)/L2, 0, 1);
  return Math.hypot(p.x-(a.x+dx*t), p.y-(a.y+dy*t));
}
function polyLineLen(pts){
  let L = 0;
  for(let i=1;i<pts.length;i++) L += dist(pts[i-1], pts[i]);
  return L;
}
function distPolylinePt(pts, p){
  let m = Infinity;
  for(let i=1;i<pts.length;i++) m = Math.min(m, distPtSeg(p, pts[i-1], pts[i]));
  return m;
}
function resample(pts, step){
  if(pts.length < 2) return pts.slice();
  const out = [{x:pts[0].x, y:pts[0].y}];
  let carry = 0;
  for(let i=1;i<pts.length;i++){
    let A = {x:pts[i-1].x, y:pts[i-1].y};
    const B = pts[i];
    let d = dist(A,B);
    if(d < 1e-6) continue;
    let guard = 0;
    while(carry + d >= step && guard++ < 400){
      const t = (step - carry)/d;
      const p = {x: A.x + (B.x-A.x)*t, y: A.y + (B.y-A.y)*t};
      out.push(p); A = p; d = dist(A,B); carry = 0;
    }
    carry += d;
  }
  const lp = pts[pts.length-1];
  if(dist(out[out.length-1], lp) > step*0.3) out.push({x:lp.x, y:lp.y});
  return out;
}
function jagged(pts, amp, rnd){
  const r = resample(pts, 9);
  if(r.length < 3) return r;
  const out = [r[0]];
  for(let i=1;i<r.length-1;i++){
    const a = r[i-1], b = r[i+1];
    let dx = b.x-a.x, dy = b.y-a.y;
    const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const o = (rnd()*2-1)*amp;
    out.push({x: r[i].x - dy*o, y: r[i].y + dx*o});
  }
  out.push(r[r.length-1]);
  return out;
}
function rayExit(p, d, poly){
  let best = Infinity;
  for(let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const ex = b.x-a.x, ey = b.y-a.y;
    const den = d.x*ey - d.y*ex;
    if(Math.abs(den) < 1e-9) continue;
    const t = ((a.x-p.x)*ey - (a.y-p.y)*ex) / den;
    const u = ((a.x-p.x)*d.y - (a.y-p.y)*d.x) / den;
    if(t > 0.01 && u >= -0.0001 && u <= 1.0001 && t < best) best = t;
  }
  if(!isFinite(best)) best = 300;
  return {x: p.x + d.x*(best+3), y: p.y + d.y*(best+3)};
}
const sub = (a,b)=>({x:a.x-b.x, y:a.y-b.y});
function norm(v){ const L = Math.hypot(v.x, v.y) || 1; return {x:v.x/L, y:v.y/L}; }
function bbox(poly){
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for(const p of poly){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  return {minX, minY, maxX, maxY};
}

/* ===================== shapes ===================== */
function circlePoly(cx,cy,r,n){
  const p = [];
  for(let i=0;i<n;i++){ const a = i/n*TAU; p.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}); }
  return p;
}
function roundRectPoly(cx,cy,w,h,rad){
  const p = [], hw = w/2, hh = h/2, seg = 6;
  const corners = [
    [cx+hw-rad, cy-hh+rad, -Math.PI/2, 0],
    [cx+hw-rad, cy+hh-rad, 0, Math.PI/2],
    [cx-hw+rad, cy+hh-rad, Math.PI/2, Math.PI],
    [cx-hw+rad, cy-hh+rad, Math.PI, Math.PI*1.5]
  ];
  for(const [ox,oy,a0,a1] of corners)
    for(let i=0;i<=seg;i++){
      const a = lerp(a0,a1,i/seg);
      p.push({x: ox+Math.cos(a)*rad, y: oy+Math.sin(a)*rad});
    }
  return p;
}
const JAR_PROFILE = [
  [0.00,0.34],[0.035,0.345],[0.075,0.30],[0.115,0.27],[0.155,0.265],
  [0.225,0.48],[0.305,0.74],[0.385,0.92],[0.47,0.995],[0.62,1.0],
  [0.76,0.985],[0.865,0.945],[0.95,0.90],[1.0,0.86]
];
function jarPoly(cx,cy,w,h){
  const hw = w/2, top = cy-h/2, right = [], left = [];
  for(const [ty,fx] of JAR_PROFILE){
    right.push({x: cx + hw*fx, y: top + h*ty});
    left.push({x: cx - hw*fx, y: top + h*ty});
  }
  return right.concat(left.reverse());
}
/* tapered cup / glass */
function cupPoly(cx,cy,w,h){
  const hw = w/2, top = cy-h/2, bot = cy+h/2, k = 0.78;
  return [
    {x:cx-hw, y:top}, {x:cx-hw*0.97, y:top+h*0.12},
    {x:cx-hw*k, y:bot-6}, {x:cx-hw*k+4, y:bot},
    {x:cx+hw*k-4, y:bot}, {x:cx+hw*k, y:bot-6},
    {x:cx+hw*0.97, y:top+h*0.12}, {x:cx+hw, y:top}
  ];
}

/* ===================== materials ===================== */
const MAT = {
  ceramic:{
    label:'Seramik', shard:1.0, strength:1.00, force:1.35, range:54, run:330,
    debris:1.0, rest:.18, slide:.55,
    snd:{bp:2100, q:0.9, lo:800, hi:2600, tinks:5, thud:110, dur:.42, vol:.5},
    body:'#fbfbfa', edge:'rgba(60,42,26,.30)', fresh:'rgba(255,252,246,.94)'
  },
  glass:{
    label:'Cam', shard:0.60, strength:0.60, force:1.62, range:80, run:470,
    debris:1.7, rest:.12, slide:.50,
    snd:{bp:3300, q:1.4, lo:1500, hi:4200, tinks:9, thud:150, dur:.55, vol:.42},
    body:'#dff1f2', edge:'rgba(28,86,92,.34)', fresh:'rgba(255,255,255,.95)'
  },
  ice:{
    label:'Buz', shard:0.82, strength:0.80, force:1.28, range:64, run:390,
    debris:1.2, rest:.10, slide:.96,
    snd:{bp:2700, q:1.2, lo:1200, hi:3200, tinks:6, thud:120, dur:.3, vol:.44},
    body:'#e6f4fb', edge:'rgba(40,90,120,.30)', fresh:'rgba(255,255,255,.95)'
  },
  wood:{
    label:'Ahşap', shard:1.55, strength:1.95, force:0.85, range:40, run:210,
    debris:0.5, rest:.30, slide:.40,
    snd:{bp:900, q:0.7, lo:280, hi:900, tinks:3, thud:70, dur:.35, vol:.5},
    body:'#d8a86a', edge:'rgba(70,42,16,.42)', fresh:'rgba(246,222,186,.95)'
  },
  stone:{
    label:'Taş', shard:1.35, strength:2.45, force:0.80, range:46, run:250,
    debris:0.85, rest:.14, slide:.45,
    snd:{bp:700, q:0.6, lo:220, hi:760, tinks:3, thud:58, dur:.4, vol:.55},
    body:'#c9c4bb', edge:'rgba(50,45,38,.40)', fresh:'rgba(238,234,226,.92)'
  }
};

/* ===================== object build ===================== */
const snap = v => (Math.round(v*10)/10) + 0;
const vkey = p => p.x.toFixed(1) + ',' + p.y.toFixed(1);

function snapPoly(poly){
  const out = [];
  for(const p of poly){
    const q = {x: snap(p.x), y: snap(p.y)};
    const prev = out[out.length-1];
    if(prev && prev.x === q.x && prev.y === q.y) continue;
    out.push(q);
  }
  if(out.length > 2){
    const f = out[0], l = out[out.length-1];
    if(f.x === l.x && f.y === l.y) out.pop();
  }
  return out;
}
function seedGrid(poly, spacing, rnd, opts){
  opts = opts || {};
  const bb = bbox(poly);
  const xEnd = opts.mirrorX != null ? opts.mirrorX - spacing*0.42 : bb.maxX;
  const jit = spacing*0.42, out = [];
  let row = 0;
  for(let y = bb.minY + spacing*0.35; y <= bb.maxY; y += spacing*0.88, row++){
    const off = (row % 2) ? spacing*0.5 : 0;
    for(let x = bb.minX + spacing*0.3 + off; x <= xEnd; x += spacing){
      const p = {x: x + (rnd()*2-1)*jit, y: y + (rnd()*2-1)*jit};
      if(opts.mirrorX != null && p.x > opts.mirrorX - 5) continue;
      if(pointInPoly(p, poly)) out.push(p);
    }
  }
  if(opts.mirrorX != null){
    const m = opts.mirrorX, n = out.length;
    for(let i=0;i<n;i++) out.push({x: 2*m - out[i].x, y: out[i].y});
  }
  return out;
}
function makeShards(poly, seeds){
  const cells = [];
  for(let i=0;i<seeds.length;i++){
    let c = poly;
    const si = seeds[i];
    for(let j=0;j<seeds.length;j++){
      if(i === j) continue;
      const sj = seeds[j];
      const nx = sj.x - si.x, ny = sj.y - si.y;
      const cc = (sj.x*sj.x + sj.y*sj.y - si.x*si.x - si.y*si.y)/2;
      c = clipHP(c, nx, ny, cc);
      if(c.length < 3) break;
    }
    if(c.length < 3) continue;
    c = snapPoly(c);
    if(c.length < 3) continue;
    if(polyArea(c) < 0) c.reverse();
    if(polyArea(c) < 8) continue;
    cells.push(c);
  }
  return cells;
}

function buildObj(spec){
  const mat = MAT[spec.mat];
  const o = {
    spec, mat, name:spec.name || '',
    poly: spec.poly(), weakLines: [], struck:false, cracked:false
  };
  const rnd = mulberry32(spec.seed);
  const spacing = (spec.spacing || 30) * mat.shard;
  const seeds = seedGrid(o.poly, spacing, rnd, spec.mirrorX != null ? {mirrorX:spec.mirrorX} : {});
  o.shards = makeShards(o.poly, seeds);
  o.shardMid = o.shards.map(polyCentroid);

  const map = new Map();
  o.shardWall = o.shards.map(s => new Array(s.length).fill(-1));
  o.totalArea = 0;
  o.shards.forEach((s, si)=>{
    o.totalArea += Math.abs(polyArea(s));
    for(let e=0;e<s.length;e++){
      const a = s[e], b = s[(e+1)%s.length];
      const ka = vkey(a), kb = vkey(b);
      const key = ka < kb ? ka + '|' + kb : kb + '|' + ka;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push({si, e, a, b});
    }
  });
  o.walls = [];
  map.forEach(list=>{
    if(list.length !== 2) return;
    const [p, q] = list;
    if(p.si === q.si) return;
    const wi = o.walls.length;
    o.walls.push({
      a:p.a, b:p.b, s1:p.si, s2:q.si,
      mid:{x:(p.a.x+p.b.x)/2, y:(p.a.y+p.b.y)/2},
      strength: mat.strength * (0.84 + 0.32*rnd()),
      weak:false, broken:false
    });
    o.shardWall[p.si][p.e] = wi;
    o.shardWall[q.si][q.e] = wi;
  });

  /* grain / built-in weak seams (wood planks, factory seam) */
  if(spec.grain) spec.grain.forEach(line=>{
    o.walls.forEach(w=>{ if(distPolylinePt(line, w.mid) < 11) w.strength *= 0.30; });
  });
  if(spec.seamX != null){
    o.walls.forEach(w=>{
      if(Math.abs(w.a.x - spec.seamX) < 0.16 && Math.abs(w.b.x - spec.seamX) < 0.16) w.strength *= 0.22;
    });
  }

  /* art layer over the object's own box */
  const bb = bbox(o.poly), pad = 10, AS = 2;
  o.ax = bb.minX - pad; o.ay = bb.minY - pad;
  o.aw = (bb.maxX - bb.minX) + pad*2; o.ah = (bb.maxY - bb.minY) + pad*2;
  o.art = document.createElement('canvas');
  o.art.width = Math.ceil(o.aw*AS); o.art.height = Math.ceil(o.ah*AS);
  o.actx = o.art.getContext('2d');
  paintObjArt(o);

  o.pieces = buildPieces(o);
  o.pieces.forEach(p=>{ p.rest = true; });
  o.chainLock = 0;
  o.centerCache = polyCentroid(o.poly);
  o.radCache = 0;
  o.poly.forEach(p=>{ o.radCache = Math.max(o.radCache, dist(p, o.centerCache)); });
  return o;
}
function paintObjArt(o){
  const AS = 2, c = o.actx;
  c.setTransform(AS, 0, 0, AS, -o.ax*AS, -o.ay*AS);
  c.clearRect(o.ax, o.ay, o.aw, o.ah);
  o.spec.art(c, o);
}

function buildPieces(o){
  const n = o.shards.length;
  const parent = new Array(n);
  for(let i=0;i<n;i++) parent[i] = i;
  const find = x => { while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const uni = (a,b)=>{ a = find(a); b = find(b); if(a !== b) parent[a] = b; };
  o.walls.forEach(w=>{ if(!w.broken) uni(w.s1, w.s2); });

  const groups = new Map();
  for(let i=0;i<n;i++){
    const r = find(i);
    if(!groups.has(r)) groups.set(r, []);
    groups.get(r).push(i);
  }
  const prev = o.pieces || [];
  const out = [];
  groups.forEach(idxs=>{
    const inPiece = new Set(idxs);
    const dirEdges = [], breakSegs = [], crackSegs = [];
    let area = 0, ax = 0, ay = 0;
    idxs.forEach(si=>{
      const sp = o.shards[si];
      const a = Math.abs(polyArea(sp)), ct = o.shardMid[si];
      area += a; ax += ct.x*a; ay += ct.y*a;
      for(let e=0;e<sp.length;e++){
        const A = sp[e], B = sp[(e+1)%sp.length];
        const wi = o.shardWall[si][e];
        if(wi >= 0){
          const w = o.walls[wi];
          const other = w.s1 === si ? w.s2 : w.s1;
          if(inPiece.has(other)){
            if(w.broken && si < other) crackSegs.push([A,B]);
            continue;
          }
        }
        dirEdges.push({a:A, b:B});
        if(wi >= 0) breakSegs.push([A,B]);
      }
    });
    const cx = ax/area, cy = ay/area;
    const loops = traceLoops(dirEdges);
    const path = new Path2D();
    let low = 0, high = 0, rad = 0;
    const src = loops.length ? loops : idxs.map(i=>o.shards[i]);
    src.forEach(loop=>{
      path.moveTo(loop[0].x, loop[0].y);
      for(let i=1;i<loop.length;i++) path.lineTo(loop[i].x, loop[i].y);
      path.closePath();
      loop.forEach(p=>{
        low = Math.max(low, p.y - cy);
        high = Math.max(high, cy - p.y);
        rad = Math.max(rad, Math.hypot(p.x-cx, p.y-cy));
      });
    });
    /* carry motion across a re-split so a second hit doesn't teleport things */
    let ox=0, oy=0, vx=0, vy=0, ang=0, av=0, rest=false;
    for(const q of prev){
      if(q.shards.indexOf(idxs[0]) >= 0){
        ox=q.ox; oy=q.oy; vx=q.vx; vy=q.vy; ang=q.ang; av=q.av; rest=q.rest; break;
      }
    }
    out.push({shards:idxs, area, cx, cy, low, high, rad, path, breakSegs, crackSegs,
              ox, oy, vx, vy, ang, av, scl:1, rest});
  });
  return out;
}
function traceLoops(edges){
  const byStart = new Map();
  edges.forEach((e,i)=>{
    const k = vkey(e.a);
    if(!byStart.has(k)) byStart.set(k, []);
    byStart.get(k).push(i);
  });
  const used = new Array(edges.length).fill(false);
  const loops = [];
  for(let i=0;i<edges.length;i++){
    if(used[i]) continue;
    const loop = [];
    let cur = i, guard = 0;
    while(cur != null && !used[cur] && guard++ < 4000){
      used[cur] = true;
      loop.push(edges[cur].a);
      const cand = byStart.get(vkey(edges[cur].b));
      let nxt = null;
      if(cand) for(const c of cand){ if(!used[c]){ nxt = c; break; } }
      cur = nxt;
    }
    if(loop.length >= 3) loops.push(loop);
  }
  return loops;
}

/* ===================== the strike ===================== */
/* A hit does two things: it crushes shards around the contact point, and it
   starts a crack that RUNS through the object. How far that crack travels is
   what decides a chip from a clean split. Position, angle and power all feed in. */
function trimLine(line, pt, budget){
  let bi = 0, bd = Infinity;
  line.forEach((p,i)=>{ const d = dist(p, pt); if(d < bd){ bd = d; bi = i; } });
  let a = bi, b = bi, accA = 0, accB = 0;
  while(a > 0 && accA < budget){ accA += dist(line[a], line[a-1]); a--; }
  while(b < line.length-1 && accB < budget){ accB += dist(line[b], line[b+1]); b++; }
  return line.slice(a, b+1);
}
function segPoint(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d) < 1e-9) return {x:p2.x, y:p2.y};
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x))/d;
  return {x: p1.x + (p2.x-p1.x)*t, y: p1.y + (p2.y-p1.y)*t};
}
function firstCrossing(A, B){
  for(let i=1;i<A.length;i++)
    for(let j=1;j<B.length;j++)
      if(segSeg(A[i-1], A[i], B[j-1], B[j]))
        return {i, p: segPoint(A[i-1], A[i], B[j-1], B[j])};
  return null;
}
function crackPath(o, pt, dir, power){
  const mat = o.mat;
  const runLen = mat.run * power;

  /* a blow landing right on a prepared line is carried by it from the start */
  let best = null, bd = Infinity;
  o.weakLines.forEach(L=>{ const d = distPolylinePt(L, pt); if(d < bd){ bd = d; best = L; } });
  if(best && bd < 30 + 42*power) return {paths:[trimLine(best, pt, runLen*0.9)], weak:true};

  /* otherwise the crack runs along the line of the blow */
  const fwd = rayExit(pt, dir, o.poly);
  const bwd = rayExit(pt, {x:-dir.x, y:-dir.y}, o.poly);
  const fL = Math.min(dist(pt, fwd), runLen);
  const bL = Math.min(dist(pt, bwd), runLen*0.42);
  const rnd = mulberry32(((pt.x*31 + pt.y*17)|0) ^ 0x5bf0);
  const nx = -dir.y, ny = dir.x, steps = 14, pts = [];
  for(let i=-steps;i<=steps;i++){
    const t = i/steps;
    const L = t < 0 ? bL*t : fL*t;
    const wob = (Math.sin(t*4.1)*6*(0.4+power) + (rnd()*2-1)*2.4) * Math.abs(t);
    pts.push({x: pt.x + dir.x*L + nx*wob, y: pt.y + dir.y*L + ny*wob});
  }

  /* running into a scored line deflects the crack along it */
  for(const Lw of o.weakLines){
    const x = firstCrossing(pts, Lw);
    if(!x) continue;
    const head = pts.slice(0, x.i).concat([x.p]);
    const spent = polyLineLen(head.slice(Math.max(0, head.length - x.i)));
    const leftOver = Math.max(0, runLen - Math.max(0, spent));
    if(leftOver < 24) continue;
    return {paths:[head, trimLine(Lw, x.p, leftOver)], weak:true};
  }
  return {paths:[pts], weak:false};
}
function strike(o, pt, dir, ptW, dirW, power, kind){
  power = clamp(power, 0, 1);
  o.hitCount=(o.hitCount||0)+1;
  ptW = ptW || pt; dirW = dirW || dir;
  const mat = o.mat;
  const before = o.pieces.length;
  const cr = crackPath(o, pt, dir, power);
  const band = 9 + 9*power;
  const crush = mat.range * (0.35 + 0.8*power);
  let broke = 0;

  o.walls.forEach(w=>{
    if(w.broken) return;
    let s = 0;
    const m1 = o.shardMid[w.s1], m2 = o.shardMid[w.s2];
    /* the crack ran between these two shards, so the join gives way */
    if(cr.paths.some(P => polylineHitsSeg(P, m1, m2)))
      s += power * mat.force * 3.6 * (w.weak ? 1.4 : 1);
    /* plus local crushing around the contact point */
    const dImp = dist(w.mid, pt);
    s += power * mat.force * 1.5 * Math.exp(-(dImp*dImp)/(2*crush*crush));
    /* a wide blow frays the edges of the crack too */
    if(band > 13 && cr.paths.some(P => distPolylinePt(P, w.mid) < band))
      s += power * mat.force * 0.9;
    if(s > w.strength){ w.broken = true; broke++; }
    else w.strength = Math.max(.12, w.strength - s*0.3);   /* repeated taps wear a joint down */
  });

  o.lastCrack = cr.paths;

  onFracture(o, ptW, dirW, power);
  cr.paths.forEach(path=>o.weakLines.push(path));
  o.walls.forEach(w=>{if(!w.broken && cr.paths.some(path=>distPolylinePt(path,w.mid)<15)){w.strength=Math.max(.12,w.strength-power*.65);w.weak=true;}});
  o.cracked=true;

  if(broke === 0){ bounceOnly(o, ptW, dirW, power); return {broke:0, split:0}; }

  o.pieces = buildPieces(o);
  const split = o.pieces.length - before;
  const moving = o.pieces.length > 1;
  const avg = o.totalArea / Math.max(1, o.pieces.length);
  const range = mat.range * (0.5 + 0.85*power);
  const rnd = mulberry32(o.spec.seed + strikeSeq*997);

  o.pieces.forEach(p=>{
    const c = {x:p.cx+p.ox, y:p.cy+p.oy};
    const d = dist(c, ptW);
    const f = Math.exp(-d/(range*1.35));
    let ax = c.x-ptW.x, ay = c.y-ptW.y;
    const L = Math.hypot(ax,ay) || 1; ax/=L; ay/=L;
    const bx = ax*0.45 + dirW.x*0.55, by = ay*0.45 + dirW.y*0.55;
    const mass = Math.sqrt(Math.max(60,p.area)/Math.max(60,avg));
    const sp = (moving ? 1 : 0.14) * power * mat.force * 340 * (0.3 + f) / mass;
    p.vx += bx*sp; p.vy += by*sp;
    p.av += (rnd()-0.5)*7*power/mass;
    p.scl = 1 + 0.05*power*f;
    p.rest = false;
  });

  const largest=Math.max(...o.pieces.map(p=>p.area))/o.totalArea;
  o.open = largest < .86 && o.pieces.length>1;
  if(!o.open)o.pieces.forEach(p=>{p.rest=true;p.vx=p.vy=p.av=0;});
  o.struck = true;
  o.cracked = true;
  spawnDebris(o, ptW, power, range, null);
  impactFx(o, ptW, power, kind);
  return {broke, split};
}
function bounceOnly(o,pt,dir,power){ impactFx(o,pt,power,'hammer'); }


/* ===================== fx ===================== */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let particles = [], shake = 0, flash = 0, freeze = 0;

function impactFx(o, pt, power, kind){
  shake = Math.max(shake, 0.45 + power*0.75);
  flash = Math.max(flash, 0.16 + power*0.3);
  freeze = Math.max(freeze, kind === 'dull' ? 0.03 : 0.055 + power*0.035);
  audio.hit(o.mat, power, kind);
  if(navigator.vibrate) { try{ navigator.vibrate(kind === 'dull' ? 10 : Math.round(14 + power*26)); }catch(e){} }
}
function spawnDebris(o, pt, power, range, path){
  const mat = o.mat;
  const n = Math.round((reduced ? 10 : 34) * mat.debris * (0.35 + power));
  for(let i=0;i<n;i++){
    let x, y;
    if(path && path.length > 1 && i % 2){
      /* half the debris comes off the crack itself */
      const t = Math.random()*(path.length-1), i0 = Math.floor(t), u = t-i0;
      const a1 = path[i0], b1 = path[Math.min(path.length-1, i0+1)];
      x = lerp(a1.x, b1.x, u); y = lerp(a1.y, b1.y, u);
    } else {
      const a = Math.random()*TAU, r = Math.random()*range*0.8;
      x = pt.x + Math.cos(a)*r; y = pt.y + Math.sin(a)*r;
    }
    const sp = 70 + Math.random()*340*power;
    const ang = Math.random()*TAU;
    particles.push({
      x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 70*power,
      r: 1.2 + Math.random()*3.2*(mat.shard), rot:Math.random()*TAU, rv:(Math.random()*2-1)*10,
      life:0, max:0.45+Math.random()*0.65, dust:false, col:mat.body
    });
  }
  pushDust(pt.x, pt.y, null, reduced ? 4 : Math.round(6 + power*10));
}
function pushDust(x, y, col, n){
  for(let i=0;i<n;i++)
    particles.push({
      x, y, vx:(Math.random()*2-1)*46, vy:-12 - Math.random()*34,
      r: 7 + Math.random()*15, rot:0, rv:0,
      life:0, max:0.5+Math.random()*0.5, dust:true, col
    });
}

/* ===================== audio ===================== */
const audio = (function(){
  let A = null, noise = null, muted = false;
  function get(){
    if(!A){ try{ A = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(A.state === 'suspended') A.resume();
    return A;
  }
  function buf(a){
    if(noise) return noise;
    const n = Math.floor(a.sampleRate*0.7);
    noise = a.createBuffer(1, n, a.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1 - i/n);
    return noise;
  }
  function tone(a, type, f0, f1, t0, dur, vol){
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  return {
    unlock(){ if(!muted) get(); },
    ac(){ return muted ? null : get(); },
    toggle(){ muted = !muted; return muted; },
    whoosh(power){
      if(muted) return; const a = get(); if(!a) return;
      const t = a.currentTime;
      const s = a.createBufferSource(); s.buffer = buf(a);
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(400,t);
      f.frequency.exponentialRampToValueAtTime(1600, t+0.12); f.Q.value = 1.2;
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.16*power, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      s.connect(f); f.connect(g); g.connect(a.destination);
      s.start(t); s.stop(t+0.2);
    },
    hit(mat, power, kind){
      if(muted) return; const a = get(); if(!a) return;
      const t = a.currentTime, S = mat.snd;
      const dull = kind === 'dull';
      const s = a.createBufferSource(); s.buffer = buf(a);
      const bp = a.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = dull ? S.bp*0.4 : S.bp; bp.Q.value = S.q;
      const g = a.createGain();
      const dur = dull ? 0.12 : S.dur*(0.6+power*0.6);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(S.vol*(dull?0.4:0.55+power*0.5), t+0.007);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      s.connect(bp); bp.connect(g); g.connect(a.destination);
      s.start(t); s.stop(t+dur+0.05);
      tone(a, 'sine', S.thud, S.thud*0.45, t, 0.18+power*0.1, 0.3*(0.5+power));
      if(dull) return;
      const n = Math.round(S.tinks*(0.4+power*0.8));
      for(let i=0;i<n;i++){
        const f = S.lo + Math.random()*(S.hi-S.lo);
        tone(a, 'triangle', f, f*0.84, t + Math.random()*0.11, 0.1+Math.random()*0.09, 0.07*(0.5+power));
      }
    },
    win(){
      if(muted) return; const a = get(); if(!a) return;
      const t = a.currentTime;
      [523.25, 659.25, 880].forEach((f,i)=> tone(a,'triangle',f,f,t+i*0.08,0.28,0.13));
    },
    lose(){
      if(muted) return; const a = get(); if(!a) return;
      tone(a, 'sawtooth', 190, 96, a.currentTime, 0.36, 0.09);
    }
  };
})();

/* ===================== art helpers ===================== */
function pathPoly(c, poly){
  c.beginPath();
  c.moveTo(poly[0].x, poly[0].y);
  for(let i=1;i<poly.length;i++) c.lineTo(poly[i].x, poly[i].y);
  c.closePath();
}
function glaze(c, poly, top, bot){
  const bb = bbox(poly);
  const g = c.createLinearGradient(0, bb.minY, 0, bb.maxY);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  pathPoly(c, poly); c.fillStyle = g; c.fill();
}
function shine(c, poly, cx, cy, rx, ry, rot, alpha){
  c.save(); pathPoly(c, poly); c.clip();
  c.fillStyle = 'rgba(255,255,255,' + alpha + ')';
  c.beginPath(); c.ellipse(cx, cy, rx, ry, rot, 0, TAU); c.fill();
  c.restore();
}
function plateArt(c, o, rim){
  const s = o.spec;
  const g = c.createRadialGradient(s.cx-s.r*0.34, s.cy-s.r*0.4, s.r*0.08, s.cx, s.cy, s.r*1.12);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.56,'#f6f4ef'); g.addColorStop(1,'#e2ded4');

}

/* piece-local hit testing, shared by the hammer and the fracture engine */
function toLocal(p, wp){
  const dx = wp.x - (p.cx + p.ox), dy = wp.y - (p.cy + p.oy);
  const c = Math.cos(-p.ang), s = Math.sin(-p.ang);
  return {x: (dx*c - dy*s)/p.scl + p.cx, y: (dx*s + dy*c)/p.scl + p.cy};
}
function hitTest(wp){
  for(const o of objects){
    for(const pc of o.pieces){
      const lp = toLocal(pc, wp);
      for(const si of pc.shards) if(pointInPoly(lp, o.shards[si])) return {o, pc, lp};
    }
  }
  return null;
}
function rot(v, a){
  const c = Math.cos(a), s = Math.sin(a);
  return {x: v.x*c - v.y*s, y: v.x*s + v.y*c};
}
function hexA(hex, a){
  if(!hex || hex[0] !== '#') return 'rgba(230,222,208,' + a + ')';
  let h = hex.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* ===================== component framework ===================== */
/* Every interactive part is a component with: which tools bite on it,
   what it depends on, and a completion state. Levels are just data. */
let comps = [], level = null, lvIndex = 0, rescued = null;
let tool = null, solved = false, failed = false, tHold = 0;

function mk(def){
  const T = TYPE[def.type] || {};
  return Object.assign({
    done:false, prog:0, requires:[], tools:(T.tools || []).slice(), shake:0, glow:0,
    off:{x:0,y:0}, ang:0, att:false, gone:0
  }, def);
}
function byId(id){ for(const c of comps) if(c.id === id) return c; return null; }
function locked(c){
  for(const id of c.requires){ const r = byId(id); if(r && !r.done) return true; }
  return false;
}
function acceptsTool(c, t){
  return c.tools.indexOf('hand') >= 0 || c.tools.indexOf(t) >= 0;
}
function finish(c){
  if(c.done) return;
  c.done = true; c.prog = 1;
  puff(c.x, c.y, 8);
  sfx.done();
  /* anything that becomes free on its own once its dependencies clear */
  comps.forEach(k=>{ if(k.auto && !k.done && !locked(k)) finish(k); });
}
function allDone(ids){ return ids.every(id=>{ const c = byId(id); return c && c.done; }); }

/* ===================== component types ===================== */
/* hit: is this world point on me · start/move/end: gesture handling · draw */
const TYPE = {

  /* --- screw: twist with the screwdriver until it backs out --- */
  screw:{
    tools:['screwdriver'], r:19,
    hit(c,p){ return dist(p, c) < 26; },
    move(c,g){
      const step = Math.hypot(g.dx, g.dy)/210;
      const was = c.prog;
      c.prog = clamp(c.prog + step, 0, 1);
      c.spin = c.prog * TAU * 3.2;
      if(Math.floor(c.prog*4) > Math.floor(was*4)) sfx.click();
      if(c.prog >= 1) finish(c);
    },
    draw(c,x,y){
      const lift = c.done ? 14 : c.prog*4;
      ctx.save(); ctx.translate(x, y - lift);
      ctx.globalAlpha = c.done ? Math.max(0, 1 - c.gone*1.6) : 1;
      ctx.rotate(c.spin || 0);
      ctx.fillStyle = 'rgba(60,40,20,.22)';
      ctx.beginPath(); ctx.arc(0, 2.5, 9.5, 0, TAU); ctx.fill();
      const g = ctx.createLinearGradient(-9,-9,9,9);
      g.addColorStop(0,'#e9e5dd'); g.addColorStop(.5,'#b9b2a6'); g.addColorStop(1,'#8d8578');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(50,38,24,.55)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-5.2,0); ctx.lineTo(5.2,0); ctx.stroke();
      ctx.restore();
    }
  },

  /* --- strip: tape or strap, cut by swiping across it --- */
  strip:{
    tools:['cutter'],
    hit(c,p){ return distPtSeg(p, c.a, c.b) < 15; },
    crossed(c, p0, p1){ return segSeg(p0, p1, c.a, c.b); },
    draw(c){
      const open = c.done ? Math.min(1, c.gone*2.4) : 0;
      const mx = (c.a.x+c.b.x)/2, my = (c.a.y+c.b.y)/2;
      const dx = c.b.x-c.a.x, dy = c.b.y-c.a.y, L = Math.hypot(dx,dy)||1;
      const nx = -dy/L, ny = dx/L;
      for(const s of [-1, 1]){
        ctx.save();
        const e = s < 0 ? c.a : c.b;
        ctx.translate(nx*open*9*s, ny*open*9*s);
        ctx.rotate(open*0.22*s);
        ctx.fillStyle = c.col || '#d9b98a';
        ctx.strokeStyle = 'rgba(70,46,22,.3)'; ctx.lineWidth = 1.2;
        const hw = c.w || 11;
        ctx.beginPath();
        ctx.moveTo(e.x + nx*hw, e.y + ny*hw);
        ctx.lineTo(mx + nx*hw, my + ny*hw);
        ctx.lineTo(mx - nx*hw, my - ny*hw);
        ctx.lineTo(e.x - nx*hw, e.y - ny*hw);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      if(!c.done){
        ctx.strokeStyle = 'rgba(70,46,22,.22)'; ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(mx+nx*12, my+ny*12); ctx.lineTo(mx-nx*12, my-ny*12); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  },

  /* --- pin: metal, slides toward a magnet held nearby --- */
  pin:{
    tools:['magnet'], range:82,
    hit(c,p){ return dist(p, {x:c.x + c.axis.x*c.prog*c.travel, y:c.y + c.axis.y*c.prog*c.travel}) < 24; },
    /* pulls over time while the magnet is held near it — closer is faster */
    pull(c, m, dt){
      const head = {x:c.x + c.axis.x*c.prog*c.travel, y:c.y + c.axis.y*c.prog*c.travel};
      const d = dist(m, head);
      if(d > TYPE.pin.range) return false;
      const toM = {x:(m.x-head.x)/(d||1), y:(m.y-head.y)/(d||1)};
      const along = toM.x*c.axis.x + toM.y*c.axis.y;
      if(along <= 0.05) return false;
      const force = Math.pow(1 - d/TYPE.pin.range, 0.6) * along * 2.6 * dt;
      const was = c.prog;
      c.prog = clamp(c.prog + force, 0, 1);
      if(Math.floor(c.prog*3) > Math.floor(was*3)) sfx.tick();
      if(c.prog >= 0.97) finish(c);
      return c.prog > was;
    },
    draw(c){
      const x = c.x + c.axis.x*c.prog*c.travel, y = c.y + c.axis.y*c.prog*c.travel;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(c.axis.y, c.axis.x) + Math.PI/2);
      ctx.fillStyle = 'rgba(40,30,18,.25)';
      ctx.fillRect(-4.5, -c.travel*0.5+2, 9, c.travel + 16);
      const g = ctx.createLinearGradient(-5,0,5,0);
      g.addColorStop(0,'#dfe3e8'); g.addColorStop(.5,'#a6adb6'); g.addColorStop(1,'#767d87');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-4.5, -c.travel*0.5, 9, c.travel + 14, 4)
                    : ctx.rect(-4.5, -c.travel*0.5, 9, c.travel + 14);
      ctx.fill();
      ctx.fillStyle = '#c3c9d1';
      ctx.beginPath(); ctx.arc(0, -c.travel*0.5, 7, 0, TAU); ctx.fill();
      ctx.restore();
    }
  },

  /* --- panel: lid, cover or loosened chunk, pulled off with the suction cup --- */
  panel:{
    tools:['suction'], pull:58,
    hit(c,p){
      return Math.abs(p.x - (c.x + c.off.x)) < c.w/2 + 6 &&
             Math.abs(p.y - (c.y + c.off.y)) < c.h/2 + 6;
    },
    start(c,g){ c.att = true; sfx.pop(); c.grab = {x:g.p.x, y:g.p.y}; },
    move(c,g){
      if(!c.att) return;
      c.off.x = (g.p.x - c.grab.x)*0.85;
      c.off.y = (g.p.y - c.grab.y)*0.85;
      const d = Math.hypot(c.off.x, c.off.y);
      c.prog = clamp(d/TYPE.panel.pull, 0, 1);
      if(d > TYPE.panel.pull){ c.att = false; sfx.unstick(); finish(c); }
    },
    end(c){ if(!c.done){ c.att = false; c.off.x = c.off.y = 0; c.prog = 0; } },
    draw(c){
      const x = c.x + c.off.x, y = c.y + c.off.y;
      ctx.save();
      ctx.globalAlpha = c.done ? Math.max(0, 1 - c.gone*1.2) : 1;
      ctx.translate(x, y + (c.done ? -c.gone*90 : 0));
      ctx.rotate(c.done ? c.gone*0.5 : 0);
      ctx.shadowColor = 'rgba(60,38,16,.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
      const g = ctx.createLinearGradient(0, -c.h/2, 0, c.h/2);
      if(c.glass){ g.addColorStop(0,'rgba(226,246,246,.92)'); g.addColorStop(1,'rgba(176,216,218,.9)'); }
      else if(c.metal){ g.addColorStop(0,'#d6dade'); g.addColorStop(1,'#9aa1a9'); }
      else if(c.ice){ g.addColorStop(0,'rgba(235,248,255,.95)'); g.addColorStop(1,'rgba(196,228,244,.92)'); }
      else { g.addColorStop(0,'#d9a969'); g.addColorStop(1,'#b9854a'); }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-c.w/2, -c.h/2, c.w, c.h, c.rad || 8)
                    : ctx.rect(-c.w/2, -c.h/2, c.w, c.h);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(70,46,22,.28)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect(-c.w/2+7, -c.h/2+5, c.w-14, 3.5);
      if(c.att){
        ctx.fillStyle = 'rgba(185,143,214,.5)';
        ctx.beginPath(); ctx.ellipse(0, 0, 17, 11, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#b98fd6'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.ellipse(0, 0, 17, 11, 0, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
  },

  /* --- door: swings open once its lock is clear --- */
  door:{
    tools:['hand'],
    hit(c,p){
      const a = c.ang;
      const lx = p.x - c.hx, ly = p.y - c.hy;
      const rx = lx*Math.cos(-a) - ly*Math.sin(-a), ry = lx*Math.sin(-a) + ly*Math.cos(-a);
      return rx > -10 && rx < c.w + 10 && Math.abs(ry) < c.h/2 + 8;
    },
    move(c,g){
      c.ang = clamp(c.ang + g.dx*c.dir/95, 0, 1.25);
      if(c.ang > 0.92) finish(c);
    },
    draw(c){
      ctx.save();
      ctx.translate(c.hx, c.hy);
      ctx.rotate(c.ang*c.dir);
      ctx.fillStyle = 'rgba(60,40,20,.16)';
      ctx.fillRect(0, -c.h/2, c.w, c.h);
      ctx.strokeStyle = '#8b939c'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
      ctx.strokeRect(2, -c.h/2+2, c.w-4, c.h-4);
      ctx.lineWidth = 3.4; ctx.strokeStyle = '#a7aeb6';
      for(let i=1;i<4;i++){
        const bx = 2 + (c.w-4)*i/4;
        ctx.beginPath(); ctx.moveTo(bx, -c.h/2+4); ctx.lineTo(bx, c.h/2-4); ctx.stroke();
      }
      ctx.restore();
    }
  },

  /* --- weak: a scored spot that wants a measured hammer tap --- */
  weak:{
    tools:['hammer'], r:30,
    hit(c,p){ return dist(p, c) < c.r + 8; },
    draw(c){
      if(c.done) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(60,80,110,.5)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      const rnd = mulberry32(c.seed || 7);
      for(let i=0;i<5;i++){
        const a = rnd()*TAU, L = 9 + rnd()*13;
        ctx.beginPath(); ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + Math.cos(a)*L, c.y + Math.sin(a)*L);
        ctx.stroke();
      }
      ctx.restore();
    }
  },

  /* --- rescue: the trapped thing; drag it to the mat --- */
  rescue:{
    tools:['hand'],
    hit(c,p){ return dist(p, {x:c.x+c.off.x, y:c.y+c.off.y}) < (c.r || 22) + 10; },
    start(c){ c.held = true; },
    move(c,g){ c.off.x += g.dx; c.off.y += g.dy; },
    end(c){

    draw(c){
      const x = c.x + c.off.x, y = c.y + c.off.y;
      ctx.save(); ctx.translate(x, y);
      if(c.held) ctx.scale(1.08, 1.08);
      ctx.shadowColor = 'rgba(60,38,16,.35)'; ctx.shadowBlur = 9; ctx.shadowOffsetY = 4;
      (RESCUE_ART[c.art] || RESCUE_ART.key)(c);
      ctx.restore();
    }
  }
};

/* ===================== tool sounds ===================== */
const sfx = (function(){
  function t(type, f0, f1, dur, vol, delay){
    const a = audio.ac ? audio.ac() : null;
    if(!a) return;
    const t0 = a.currentTime + (delay||0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  return {
    click(){ t('square', 1750, 1500, 0.035, 0.045); },
    tick(){ t('triangle', 900, 780, 0.05, 0.06); },
    pop(){ t('sine', 300, 760, 0.09, 0.16); },
    unstick(){ t('sine', 700, 220, 0.17, 0.17); },
    slice(){ t('sawtooth', 2400, 600, 0.12, 0.1); t('triangle', 1500, 900, 0.07, 0.06, 0.02); },
    done(){ t('triangle', 880, 1320, 0.12, 0.1); },
    nope(){ t('sine', 220, 180, 0.1, 0.07); },

/* ===================== level lifecycle ===================== */
function buildLevel(i){
  lvIndex = clamp(i, 0, LEVELS.length-1);
  level = Object.create(LEVELS[lvIndex]);
  level.mat = LEVELS[lvIndex].mat;
  objects = [];
  particles = []; shake = 0; flash = 0; freeze = 0;
  solved = false; failed = false; rescued = null;
  hammer.state = 'idle'; hammer.t = 0;
  drag = null;
  comps = level.build();
  comps.forEach(c=>{ if(c.auto && !locked(c)) c.done = true; });
  tool = null;
  sheet.classList.remove('show');
  paintHud();
  paintTools();
  say(level.hint, 2600);
}
function paintHud(){
  lvTag.textContent = 'Bölüm ' + (lvIndex+1);
  objectiveEl.textContent = level.objective;
}
function win(){
  if(solved || failed) return;
  solved = true;
  sparkle(level.mat.x, level.mat.y, 22);
  sfx.win();
  setTimeout(()=>{
    vtitle.textContent = 'Kurtarıldı!';
    vtitle.className = 'good';
    vmsg.textContent = WIN_MSG[lvIndex] || 'Doğru sırayla çözdün.';
    nextBtn.textContent = lvIndex === LEVELS.length-1 ? 'Baştan Başla' : 'Sonraki Bölüm';
    nextBtn.style.display = '';
    sheet.classList.add('show');
  }, 620);
}
function lose(title, msg){
  if(solved || failed) return;
  failed = true;
  audio.lose();
  setTimeout(()=>{
    vtitle.textContent = title;
    vtitle.className = 'bad';
    vmsg.textContent = msg;
    nextBtn.style.display = 'none';
    sheet.classList.add('show');
  }, 520);
}

/* ===================== the hammer, as one tool ===================== */
/* Press on the spot, drag to build force, release to swing. */
const hammer = {state:'idle', x:0, y:0, pt:null, power:0, t:0, target:null};

function onFracture(o, ptW, dirW, power){
  strikeSeq++;
  const w = comps.find(c=>c.type === 'weak' && !c.done);
  if(!w) return;
  if(dist(ptW, w) > w.r + 14) return;
  if(power > w.band[1]){
    /* too much force — the rescue object takes the hit */
    const g = comps.find(c=>c.type === 'rescue');
    if(g){ g.off.x += (Math.random()*2-1)*70; g.off.y -= 40; }
    lose('Çok sert vurdun', 'Darbe mücevheri yerinden fırlattı. Daha kısa çekip hafif vur — buz zaten çatlamaya hazır.');
    return;
  }
  if(power >= w.band[0]){
    finish(w);
    const slab = byId('slab');
    if(slab) slab.hidden = false;
    say('Buz çatladı. Gevşeyen parçayı vantuzla al.', 2600);
  } else {
    say('Biraz daha güçlü vur.', 1700);
  }
}

/* ===================== input ===================== */
let drag = null, magnetAt = null;
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left - offX)/scale, y:(e.clientY - r.top - offY)/scale};
}
function pickComp(p){
  for(let i=comps.length-1;i>=0;i--){
    const c = comps[i];
    if(c.done || c.hidden || c.noPick) continue;
    const T = TYPE[c.type];
    if(T.hit && T.hit(c, p)) return c;
  }
  return null;
}
function nudge(c, msg){
  c.shake = 1;
  sfx.nope();
  say(msg, 1700);
}
function onDown(e){
  if(solved || failed) return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  audio.unlock();
  const p = toWorld(e);
  drag = {p, prev:p, start:p, comp:null, moved:0};

  /* cutter and magnet sweep the scene rather than grabbing one part */
  if(tool === 'magnet'){ magnetAt = p; return; }
  if(tool === 'cutter') return;

  const c = pickComp(p);
  if(!c){
    if(tool === 'hammer') say('Çekicin işe yarayacağı bir yer bul.', 1600);
    return;
  }
  if(tool === 'hammer' && c.type === 'weak'){
    if(locked(c)){ nudge(c, c.lockMsg || 'Burası henüz açılmıyor.'); return; }
    hammer.state = 'charge'; hammer.pt = {x:c.x, y:c.y}; hammer.power = 0; hammer.target = c;
    drag.comp = c;
    return;
  }
  if(!acceptsTool(c, tool)){
    nudge(c, tool ? 'Bu burada işe yaramaz.' : 'Önce bir alet seç.');
    return;
  }
  if(locked(c)){ nudge(c, c.lockMsg || 'Burası henüz açılmıyor.'); return; }
  drag.comp = c;
  const T = TYPE[c.type];
  if(T.start) T.start(c, {p});
}
function onMove(e){
  if(!drag || solved || failed) return;
  e.preventDefault();
  const p = toWorld(e);
  const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
  drag.moved += Math.hypot(dx, dy);

  if(hammer.state === 'charge'){
    hammer.power = clamp(Math.hypot(p.x-drag.start.x, p.y-drag.start.y)/95, 0, 1);
    drag.p = p; return;
  }
  if(tool === 'cutter'){
    for(const c of comps){
      if(c.done || c.hidden || c.type !== 'strip') continue;
      if(!TYPE.strip.crossed(c, drag.p, p)) continue;
      if(locked(c)){ nudge(c, c.lockMsg || 'Burası henüz açılmıyor.'); continue; }
      finish(c); sfx.slice(); puff(c.x, c.y, 10);
    }
    drag.p = p; return;
  }
  if(tool === 'magnet'){ magnetAt = p; drag.p = p; return; }
  const c = drag.comp;
  if(c && !c.done){
    const T = TYPE[c.type];
    if(T.move) T.move(c, {p, dx, dy});
  }
  drag.p = p;
}
function onUp(){
  magnetAt = null;
  if(!drag) return;
  if(hammer.state === 'charge'){
    if(hammer.power < 0.08){ hammer.state = 'idle'; }
    else { hammer.state = 'swing'; hammer.t = 0; }
    drag = null; return;
  }
  const c = drag.comp;
  if(c && !c.done){
    const T = TYPE[c.type];
    if(T.end) T.end(c);
  }
  drag = null;
}

/* ===================== update ===================== */
function update(dt){
  if(freeze > 0){ freeze -= dt; dt = 0; }

  if(hammer.state === 'swing'){
    hammer.t += dt;
    const k = hammer.t/0.16;
    if(k >= 1){
      hammer.state = 'recoil'; hammer.t = 0;
      const o = objects[0];
      if(o){
        const h = hitTest(hammer.pt);
        const dir = {x:0, y:1};
        if(h) strike(h.o, h.lp, rot(dir, -h.pc.ang), hammer.pt, dir, hammer.power, 'hammer');
        else { onFracture(o, hammer.pt, dir, hammer.power); impactFx(o, hammer.pt, hammer.power, 'dull'); }
      }
    }
  } else if(hammer.state === 'recoil'){
    hammer.t += dt;
    if(hammer.t > 0.3){ hammer.state = 'idle'; hammer.power = 0; }
  }

  if(dt > 0){
    if(magnetAt){
      for(const c of comps){
        if(c.done || c.hidden || c.type !== 'pin' || locked(c)) continue;
        TYPE.pin.pull(c, magnetAt, dt);
      }
    }
    stepPiecesAll(dt);
    for(const c of comps){
      c.shake *= Math.pow(0.002, dt);
      if(c.done && c.gone < 1) c.gone = Math.min(1, c.gone + dt*2.2);
      if(c.type === 'rescue' && !c.held && !c.done && (c.off.x || c.off.y)){
        c.off.x *= Math.pow(0.02, dt); c.off.y *= Math.pow(0.02, dt);
      }
      const want = (tool && acceptsTool(c, tool) && !c.done && !c.hidden && !locked(c)) ? 1 : 0;
      c.glow += (want - c.glow)*Math.min(1, dt*7);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.life += dt;
    if(q.life >= q.max){ particles.splice(i,1); continue; }
    q.vy += (q.dust ? 40 : 900)*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.rot += q.rv*dt;
    if(!q.dust && q.y > BENCH && q.vy > 0){ q.y = BENCH; q.vy *= -0.3; q.vx *= 0.7; }
  }
  shake *= Math.pow(0.004, dt);
  if(shake < 0.002) shake = 0;
  flash *= Math.pow(0.0008, dt);
  tHold += dt;
}
function stepPiecesAll(dt){
  for(const o of objects){
    const mat = o.mat;
    for(const p of o.pieces){
      if(p.rest){ p.scl += (1-p.scl)*Math.min(1, dt*9); continue; }
      p.vy += 1150*dt;
      p.ox += p.vx*dt; p.oy += p.vy*dt;
      p.ang += p.av*dt;
      p.scl += (1-p.scl)*Math.min(1, dt*9);
      const foot = p.cy + p.oy + p.low;
      if(foot > BENCH){
        p.oy -= (foot - BENCH);
        p.av *= 0.4;
        if(p.vy > 80){ p.vy = -p.vy*mat.rest; p.vx *= 0.72; }
        else {
          p.vy = 0;
          p.vx *= Math.pow(1 - mat.slide*0.98, dt*60);
          if(Math.abs(p.vx) < 12){ p.rest = true; p.vx = 0; p.av = 0; }
        }
      }
    }
  }
}

/* ===================== render ===================== */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const sx = shake ? (Math.random()*2-1)*7*shake : 0;
  const sy = shake ? (Math.random()*2-1)*7*shake : 0;
  ctx.save();
  ctx.translate(offX + sx*scale, offY + sy*scale);
  ctx.scale(scale, scale);

  drawWorkshop();
  drawMat();
  if(level.drawScene) level.drawScene();
  objects.forEach(drawFractureObj);

  /* components, back to front, with a wobble when refused */
  for(const c of comps){
    if(c.hidden || (c.done && c.gone >= 1 && c.type !== 'rescue')) continue;
    const T = TYPE[c.type];
    ctx.save();
    if(c.shake > 0.01){
      const k = Math.sin(tHold*52)*c.shake*4;
      ctx.translate(k, 0);
    }
    if(c.glow > 0.02 && !c.done) drawGlow(c);
    T.draw(c, c.x, c.y);
    ctx.restore();
  }

  drawParticles();
  if(magnetAt) drawMagnet();
  if(hammer.state !== 'idle') drawHammer();
  ctx.restore();

  if(flash > 0.01){
    ctx.fillStyle = 'rgba(255,248,238,' + (flash*0.5) + ')';
    ctx.fillRect(0,0,cssW,cssH);
  }
}
function drawWorkshop(){
  /* overscan so the room fills the screen whatever the viewport aspect is */
  const px = offX/scale + 4, py = offY/scale + 4;
  const x0 = -px, x1 = W + px, y0 = -py, y1 = H + py;

  const g = ctx.createLinearGradient(0, y0, 0, BENCH);
  g.addColorStop(0, theme.wallA); g.addColorStop(1, theme.wallB);
  ctx.fillStyle = g; ctx.fillRect(x0, y0, x1-x0, BENCH-y0);

  const lg = ctx.createRadialGradient(190, BENCH-170, 20, 190, BENCH-140, 280);
  lg.addColorStop(0,'rgba(255,238,205,.42)'); lg.addColorStop(1,'rgba(255,238,205,0)');
  ctx.fillStyle = lg; ctx.fillRect(x0, y0, x1-x0, BENCH-y0);

  ctx.fillStyle = theme.benchDark;
  ctx.fillRect(x0, BENCH, x1-x0, y1-BENCH);
  const tg = ctx.createLinearGradient(0,BENCH,0,BENCH+30);
  tg.addColorStop(0, theme.benchA); tg.addColorStop(1, theme.benchB);
  ctx.fillStyle = tg; ctx.fillRect(x0, BENCH, x1-x0, 30);
  ctx.strokeStyle = 'rgba(255,238,208,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, BENCH+1); ctx.lineTo(x1, BENCH+1); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, BENCH, x1-x0, 30); ctx.clip();
  ctx.globalAlpha = .14; ctx.strokeStyle = theme.benchDark; ctx.lineWidth = 1.3;
  for(let i=0;i<3;i++){
    const y = BENCH + 8 + i*9;
    ctx.beginPath(); ctx.moveTo(x0-10, y); ctx.bezierCurveTo(130, y-2, 250, y+2, x1+10, y); ctx.stroke();
  }
  ctx.restore();
}
function drawMat(){
  const m = level.mat, free = comps.some(c=>c.type==='rescue' && !locked(c) && !c.done);
  ctx.save();
  ctx.globalAlpha = free ? 0.95 : 0.4;
  const pulse = free ? 1 + Math.sin(tHold*3)*0.045 : 1;
  const g = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, 38*pulse);
  g.addColorStop(0, free ? 'rgba(224,122,75,.28)' : 'rgba(120,90,60,.14)');
  g.addColorStop(1, 'rgba(224,122,75,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(m.x, m.y, 38*pulse, 0, TAU); ctx.fill();
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = free ? 'rgba(224,122,75,.85)' : 'rgba(120,90,60,.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(m.x, m.y, 30*pulse, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function drawGlow(c){
  const a = c.glow*(0.35 + Math.sin(tHold*4)*0.12);
  ctx.save();
  ctx.strokeStyle = 'rgba(224,122,75,' + a + ')';
  ctx.lineWidth = 3;
  const r = c.type === 'strip' ? 0 : (c.w ? Math.max(c.w, c.h)/2 + 12 : (c.r || 22) + 12);
  if(c.type === 'strip'){
    ctx.lineWidth = 26; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(224,122,75,' + (a*0.5) + ')';
    ctx.beginPath(); ctx.moveTo(c.a.x, c.a.y); ctx.lineTo(c.b.x, c.b.y); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(c.x + c.off.x, c.y + c.off.y, r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawFractureObj(o){
  const mat = o.mat;
  o.pieces.forEach(p=>{
    ctx.save();
    ctx.translate(p.cx + p.ox, p.cy + p.oy);
    ctx.rotate(p.ang); ctx.scale(p.scl, p.scl);
    ctx.translate(-p.cx, -p.cy);
    if(o.pieces.length <= 12){
      ctx.shadowColor = 'rgba(50,30,12,.28)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
    }
    ctx.fillStyle = mat.body; ctx.fill(p.path);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save(); ctx.clip(p.path);
    ctx.drawImage(o.art, o.ax, o.ay, o.aw, o.ah);
    ctx.restore();
    ctx.lineWidth = 1.4; ctx.strokeStyle = mat.edge; ctx.stroke(p.path);
    if(p.crackSegs.length){
      ctx.beginPath();
      p.crackSegs.forEach(s=>{ ctx.moveTo(s[0].x,s[0].y); ctx.lineTo(s[1].x,s[1].y); });
      ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(40,60,80,.5)'; ctx.stroke();
    }
    if(p.breakSegs.length){
      ctx.lineCap = 'round';
      ctx.beginPath();
      p.breakSegs.forEach(s=>{ ctx.moveTo(s[0].x,s[0].y); ctx.lineTo(s[1].x,s[1].y); });
      ctx.lineWidth = 2.6; ctx.strokeStyle = mat.fresh; ctx.stroke();
    }
    ctx.restore();
  });
}
function drawParticles(){
  particles.forEach(q=>{
    const a = 1 - q.life/q.max;
    if(q.dust){
      const rg = ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*3);
      rg.addColorStop(0, hexA(q.col||'#ffd98a', 0.9*a)); rg.addColorStop(1, hexA(q.col||'#ffd98a', 0));
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(q.x,q.y,q.r*3,0,TAU); ctx.fill();
    } else {
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot);
      ctx.fillStyle = hexA(q.col||'#efe3cd', a);
      ctx.fillRect(-q.r, -q.r*0.7, q.r*2, q.r*1.4);
      ctx.restore();
    }
  });
}
function drawMagnet(){
  const m = magnetAt, R = TYPE.pin.range;
  ctx.save();
  const g = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, R);
  g.addColorStop(0, 'rgba(127,147,224,.26)'); g.addColorStop(1, 'rgba(127,147,224,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, TAU); ctx.fill();
  ctx.setLineDash([5,7]);
  ctx.strokeStyle = 'rgba(127,147,224,.5)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  /* horseshoe */
  ctx.translate(m.x, m.y);
  ctx.shadowColor = 'rgba(40,40,80,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  ctx.lineCap = 'butt';
  ctx.strokeStyle = '#7f93e0'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(0, 2, 13, Math.PI, 0); ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#d8dffb'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-13, 2); ctx.lineTo(-13, 11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13, 2); ctx.lineTo(13, 11); ctx.stroke();
  ctx.restore();
}
function drawHammer(){
  const t = hammer.state === 'charge' ? 0 : (hammer.state === 'swing' ? hammer.t/0.16 : 1 - hammer.t/0.3);
  const p = hammer.pt;
  if(!p) return;
  if(hammer.state === 'charge'){
    const pw = hammer.power;
    const col = pw < 0.35 ? '#3f9a6b' : pw < 0.66 ? '#dda93f' : '#cf4436';
    ctx.save();
    ctx.strokeStyle = 'rgba(120,86,52,.25)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI/2, -Math.PI/2 + TAU*0.999); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI/2, -Math.PI/2 + TAU*pw); ctx.stroke();
    ctx.restore();
  }
  const lift = hammer.state === 'charge' ? 86 : 86*(1-Math.min(1,t));
  ctx.save();
  ctx.translate(p.x + 30, p.y - 30 - lift);
  ctx.rotate(-0.5 + Math.min(1,t)*0.5);
  ctx.shadowColor = 'rgba(50,30,12,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  const hg = ctx.createLinearGradient(-4,0,4,0);
  hg.addColorStop(0,'#a9773f'); hg.addColorStop(.5,'#d7a464'); hg.addColorStop(1,'#8d5f2e');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-4, -4, 8, 44, 3) : ctx.rect(-4,-4,8,44);
  ctx.fill();
  const mg = ctx.createLinearGradient(-18,-12,18,4);
  mg.addColorStop(0,'#f0b2a2'); mg.addColorStop(.5,'#e8836b'); mg.addColorStop(1,'#c25f48');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(-18, -18, 36, 15, 4) : ctx.rect(-18,-18,36,15);
  ctx.fill();
  ctx.restore();
}

/* ===================== UI ===================== */
const lvTag = document.getElementById('lvTag');
const objectiveEl = document.getElementById('objective');
const sayEl = document.getElementById('say');
const toolbar = document.getElementById('toolbar');

const vtitle = document.getElementById('vtitle');

const nextBtn = document.getElementById('nextBtn');

const btnSnd = document.getElementById('sndBtn');

let sayTimer = 0;
function say(msg, ms){
  if(!msg) return;
  sayEl.textContent = msg;
  sayEl.classList.add('show');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(()=>sayEl.classList.remove('show'), ms || 1800);
}
function paintTools(){
  toolbar.innerHTML = '';
  TOOLS.forEach(t=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tool' + (tool === t.id ? ' on' : '');
    b.style.setProperty('--tc', 'var(' + t.css + ')');
    b.setAttribute('aria-pressed', String(tool === t.id));
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + TOOL_ICON[t.id] + '</svg><span>' + t.label + '</span>';
    b.addEventListener('click', ()=>{
      tool = (tool === t.id) ? null : t.id;
      hammer.state = 'idle';
      audio.unlock();
      paintTools();
    });
    toolbar.appendChild(b);
  });
}

cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
stage.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

btnReset.addEventListener('click', ()=>buildLevel(lvIndex));
retryBtn.addEventListener('click', ()=>{ sheet.classList.remove('show'); buildLevel(lvIndex); });
nextBtn.addEventListener('click', ()=>{
  sheet.classList.remove('show');
  buildLevel(solved ? (lvIndex+1) % LEVELS.length : lvIndex);
});
btnSnd.addEventListener('click', ()=>{

  document.getElementById('sndWave').style.opacity = m ? '0.22' : '1';
});

/* ===================== loop ===================== */
let last = performance.now(), lastRaf = 0, fallbackTimer = 0;
let frameCount = 0;
function tick(now){
  const dt = Math.min(0.032, (now-last)/1000);
  last = now;
  frameCount++;
  update(dt);
  render();
}
function frame(now){
  lastRaf = performance.now();
  tick(now);
  requestAnimationFrame(frame);
}
/* Some hosts (embedded preview panes, background tabs) never fire rAF.
   Drive the loop ourselves whenever rAF has gone quiet, so the canvas
   is never left unpainted. */
function startLoop(){
  render();                                   /* paint one frame immediately */
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if(typeof setInterval === 'function' && !fallbackTimer){
    fallbackTimer = setInterval(()=>{
      if(performance.now() - lastRaf > 200) tick(performance.now());
    }, 33);
  }
}

/* ===================== test hooks ===================== */
window.__RW = {
  go: buildLevel,
  levels: LEVELS.length,
  pick(t){ tool = t; paintTools(); return tool; },
  step(dt, n){ for(let i=0;i<(n||1);i++) update(dt||1/60); },
  /* replay a pointer gesture given in world coordinates */
  gesture(pts, opts){
    opts = opts || {};
    dispatchRaw(onDown, pts[0]);
    for(let i=1;i<pts.length;i++){
      dispatchRaw(onMove, pts[i]);
      if(opts.step) update(1/60);
    }
    onUp();
    return this.info;
  },
  /* press and hold at one spot for n frames (magnet, charge) */
  hold(p, frames){
    dispatchRaw(onDown, p);
    for(let i=0;i<(frames||60);i++){ dispatchRaw(onMove, p); update(1/60); }
    onUp();
    return this.info;
  },
  /* a straight drag from a to b, sampled */
  swipe(a, b, n, opts){
    const pts = [];
    for(let i=0;i<(n||12);i++){
      const t = i/((n||12)-1);
      pts.push({x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t});
    }
    return this.gesture(pts, opts);
  },
  probe(){
    const pt = hammer.pt || {x:0,y:0};
    return {hammerState:hammer.state, power:+hammer.power.toFixed(2), pt,
            objCount:objects.length,
            hit: objects.length ? !!hitTest(pt) : null,
            pieceShards: objects.length ? objects[0].pieces.map(p=>p.shards.length) : null};
  },
  get info(){
    return {
      level: lvIndex+1, tool, solved, failed, frames: frameCount,
      comps: comps.map(c=>({id:c.id, type:c.type, done:c.done,
        prog:+(c.prog||0).toFixed(2), locked:locked(c), hidden:!!c.hidden})),
      objects: objects.map(o=>({pieces:o.pieces.length, broken:o.walls.filter(w=>w.broken).length})),
      say: sayEl.textContent,
      verdict: sheet.classList.contains('show') ? vtitle.textContent : null
    };
  }
};
function dispatchRaw(fn, p){
  const r = cv.getBoundingClientRect();
  fn({
    clientX: r.left + offX + p.x*scale,
    clientY: r.top + offY + p.y*scale,
    pointerId: 1,
    preventDefault(){}
  });
}

/* ===================== boot ===================== */
let booted = false;
function start(data){
  if(booted) return;
  booted = true;
  resize();
  paintTools();
  buildLevel(data && typeof data.level === 'number' ? data.level : 0);
  startLoop();
}
/* the page must come up even if the host's hot-reload API is absent or silent */
(function boot(){
  let hot = null;
  try{ hot = window.claude && window.claude.hot; }catch(e){}
  try{ if(hot && typeof hot.snapshot === 'function') hot.snapshot(()=>({level: lvIndex})); }catch(e){}
  try{
    if(hot && typeof hot.ready === 'function'){
      hot.ready(d => start(d || {}));
      setTimeout(()=>start((hot && hot.data) || {}), 500);   /* never stay blank */
      return;
    }
  }catch(e){}
  start((hot && hot.data) || {});
})();
})();
