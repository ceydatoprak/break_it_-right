<!doctype html>
<html lang="tr" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eee1">
<title>Rescue Workshop · Kurtarma Atölyesi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --wall-a:#f7eee1; --wall-b:#ecdcc6;
    --bench-a:#c99257; --bench-b:#a9743f; --bench-dark:#7d5228;
    --ink:#3a2a1c; --ink-2:#7a6450; --ink-3:#a89178;
    --card:#fffaf2; --card-line:rgba(120,84,46,.16);
    --chip:rgba(120,84,46,.08); --chip-line:rgba(120,84,46,.16);
    --accent:#e07a4b; --good:#3f9a6b; --bad:#cf4436; --warn:#e0a32c;
    --shadow:0 14px 32px -16px rgba(80,50,20,.5);
    --t-hammer:#e8836b; --t-screwdriver:#dda93f; --t-cutter:#4fb995;
    --t-magnet:#7f93e0; --t-suction:#b98fd6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wall-a:#2a201a; --wall-b:#181210;
      --bench-a:#8a5f33; --bench-b:#654223; --bench-dark:#402816;
      --ink:#f8efe2; --ink-2:#cbb49b; --ink-3:#947e68;
      --card:#2c221b; --card-line:rgba(255,236,214,.13);
      --chip:rgba(255,236,214,.08); --chip-line:rgba(255,236,214,.16);
      --accent:#ff9560; --good:#4fc08a; --bad:#ff6a58; --warn:#f5c34e;
      --shadow:0 18px 40px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --wall-a:#2a201a; --wall-b:#181210;
    --bench-a:#8a5f33; --bench-b:#654223; --bench-dark:#402816;
    --ink:#f8efe2; --ink-2:#cbb49b; --ink-3:#947e68;
    --card:#2c221b; --card-line:rgba(255,236,214,.13);
    --chip:rgba(255,236,214,.08); --chip-line:rgba(255,236,214,.16);
    --accent:#ff9560; --good:#4fc08a; --bad:#ff6a58; --warn:#f5c34e;
    --shadow:0 18px 40px -18px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    margin:0;background:var(--wall-b);color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  #app{
    position:fixed;inset:0;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    max-width:520px;margin-inline:auto;padding-inline:12px;
  }

  /* ---------- top ---------- */
  .hud{padding-block:10px 6px;display:flex;align-items:center;gap:9px}
  .lv{
    flex:none;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:9px;
    background:var(--chip);border:1px solid var(--chip-line);color:var(--ink-2);
  }
  .obj{
    flex:1;min-width:0;margin:0;
    font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(15px,4.5vw,19px);line-height:1.15;
    letter-spacing:-.015em;text-wrap:balance;
  }
  .pips{display:flex;gap:4px;flex:none}
  .pip{
    width:9px;height:9px;border-radius:50%;background:var(--good);
    transition:background .25s,transform .25s;
  }
  .pip.gone{background:var(--chip-line);transform:scale(.7)}
  .icon-btn{
    flex:none;width:34px;height:34px;border-radius:10px;
    border:1px solid var(--chip-line);background:var(--chip);color:var(--ink-2);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s,color .15s;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .icon-btn svg{width:16px;height:16px;display:block}

  /* ---------- stage ---------- */
  #stage{position:relative;min-height:0;touch-action:none}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  .say{
    position:absolute;left:50%;bottom:8px;transform:translate(-50%,6px);
    background:var(--card);border:1px solid var(--card-line);
    border-radius:12px;padding:7px 13px;box-shadow:var(--shadow);
    font-size:12.5px;font-weight:600;color:var(--ink-2);
    pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;
    max-width:94%;text-align:center;
  }
  .say.show{opacity:1;transform:translate(-50%,0)}
  .say.bad{color:var(--bad);border-color:var(--bad)}

  /* ---------- tools ---------- */
  .tools{display:flex;gap:6px;padding-block:7px 11px;padding-bottom:max(11px,env(safe-area-inset-bottom))}
  .tool{
    flex:1;min-width:0;min-height:64px;
    border:1.5px solid var(--chip-line);background:var(--chip);
    border-radius:15px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-2);padding:4px 2px;
    transition:transform .14s cubic-bezier(.2,.9,.3,1),background .18s,color .18s,border-color .18s;
  }
  .tool svg{width:25px;height:25px;display:block}
  .tool span{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tool:active{transform:scale(.95)}
  .tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .tool.on{
    color:#fff;transform:translateY(-4px) scale(1.05);border-color:transparent;background:var(--tc);
    box-shadow:0 10px 20px -8px var(--tc);
  }
  .tool.buzz{animation:buzz .32s}
  @keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- result ---------- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(45,28,12,.34);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .sheet.show{opacity:1;pointer-events:auto}
  .card{
    width:100%;max-width:492px;background:var(--card);
    border:1px solid var(--card-line);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
    padding:18px 18px max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:9px;
    transform:translateY(102%);transition:transform .26s cubic-bezier(.18,.9,.28,1);
  }
  .sheet.show .card{transform:translateY(0)}
  .card h2{
    margin:0;font-family:"Bricolage Grotesque",Figtree,sans-serif;
    font-weight:800;font-size:clamp(24px,7.4vw,31px);line-height:1;letter-spacing:-.03em;
  }
  .card h2.good{color:var(--good)} .card h2.bad{color:var(--bad)}
  .card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:46ch}
  .acts{display:flex;gap:9px;margin-top:2px}
  .btn{
    flex:1;min-height:52px;border:0;border-radius:15px;cursor:pointer;
    font-family:Figtree,sans-serif;font-weight:700;font-size:15px;
    display:grid;place-items:center;transition:transform .12s;
  }
  .btn:active{transform:translateY(2px) scale(.985)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .ghost{background:var(--chip);color:var(--ink-2);border:1px solid var(--chip-line)}
  .go{background:linear-gradient(135deg,var(--accent),#f2a860);color:#fff;font-size:16px}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.08s !important}}
  @media (max-height:640px){.tool{min-height:56px}.tool svg{width:21px;height:21px}.obj{font-size:14px}}
  body{background:radial-gradient(ellipse at 25% 10%,var(--wall-a),var(--wall-b));}
  #app{max-width:580px;padding-inline:18px;}
  .hud{flex-wrap:wrap;gap:9px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:12px;}
  .brand{flex:0 0 100%;display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--chip-line);}
  .brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#567b67;color:#fff7e6;font-size:28px;}
  .brand h1{font-size:18px;letter-spacing:-.6px;margin:0;font-weight:800;}
  .brand p{margin:3px 0 0;font-size:10px;color:var(--ink-2);}
  .chapter{margin-left:auto;text-align:right;font-size:10px;line-height:1.7;color:var(--ink-2);}
  .icon-btn{width:44px;height:44px;border-radius:13px;}
  .lv{padding:5px 7px;font-size:10px;}
  .obj{font-size:19px;}
  .progress{flex:0 0 100%;display:flex;align-items:center;gap:12px;font-size:10px;color:var(--ink-2);}
  .progress-track{flex:1;height:5px;border-radius:10px;background:var(--chip);overflow:hidden;}
  #progressFill{height:100%;width:0;background:#668c75;border-radius:10px;transition:width .35s ease;}
  #stage{border-radius:24px;overflow:hidden;box-shadow:0 8px 32px #60442412;background:var(--wall-a);}
  .dock{padding:9px 0 max(10px,env(safe-area-inset-bottom));}
  .dock-caption{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:36px;}
  #toolHint{font-size:11px;line-height:1.45;color:var(--ink-2);}
  .inspect{flex:none;min-height:40px;border:1px solid var(--chip-line);border-radius:12px;padding:7px 13px;background:var(--card);color:var(--ink-2);font:600 12px inherit;cursor:pointer;}
  .inspect.on{background:#567b67;color:#fff9ed;border-color:#567b67;}
  .tools{padding:0;gap:7px;}
  .tool{min-height:72px;background:var(--card);border-radius:17px;position:relative;}
  .tool svg{width:29px;height:29px;stroke-width:1.7;}
  .tool.on{color:var(--ink);background:var(--card);border:2px solid var(--tc);transform:translateY(-3px);box-shadow:0 5px 0 -2px var(--tc),0 8px 16px #60442414;}
  .tool.on svg{color:var(--tc);}
  .tool.on:after{content:'';width:5px;height:5px;border-radius:50%;background:var(--tc);position:absolute;top:6px;right:7px;}
  .tool.hinted,.inspect.hinted{animation:hint-nudge 1.1s ease 2;}
  @keyframes hint-nudge{50%{box-shadow:0 0 0 4px #dca45c55;transform:translateY(-3px)}}
  .say{bottom:12px;padding:10px 15px;border-radius:15px;font-size:12px;line-height:1.4;}
  .sheet:not(.show){visibility:hidden;}
  .stars{font-size:27px;letter-spacing:7px;color:#c48e37;min-height:12px;}
  .pip{width:8px;height:8px;}
  @media(max-width:380px){#app{padding-inline:10px}.brand h1{font-size:16px}.chapter{font-size:9px}.hud{gap:6px}.obj{font-size:16px}.tool span{font-size:9px}.tools{gap:5px}}
  @media(max-height:650px){.brand{padding-bottom:5px;margin-bottom:0}.brand p,.chapter{display:none}.brand-mark{width:26px;height:26px;font-size:21px}.brand h1{font-size:15px}.hud{padding-top:5px;padding-bottom:6px;gap:5px}.tool{min-height:52px}.tool svg{width:23px;height:23px}.dock-caption{margin-bottom:5px}.dock{padding-top:5px}.obj{font-size:15px}}
</style>
</head><body>

<div id="app" lang="tr">
  <header class="hud">
    <div class="brand"><span class="brand-mark">✳</span><div><h1>RESCUE WORKSHOP</h1><p>Her küçük hayat, biraz özen ister.</p></div><span class="chapter" id="chapter">KURTARMA<br>ATÖLYESİ</span></div>
    <span class="lv" id="lvTag">Bölüm 1</span>
    <p class="obj" id="objective">Kapsülü aç.</p>
    <div class="pips" id="pips"></div>
    <button class="icon-btn" id="resetBtn" type="button" aria-label="Bölümü baştan başlat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
    </button>
    <button class="icon-btn" id="sndBtn" type="button" aria-label="Sesi kapat" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6" id="sndWave"/>
      </svg>
    </button>
    <div class="progress"><div class="progress-track"><div id="progressFill"></div></div><span id="progressText" aria-live="polite">Hazır</span></div>
  </header>

  <div id="stage">
    <canvas id="cv" aria-label="Kurtarma atölyesi. Boş alanda sürükleyerek objeyi çevir, alet seç ve parçalarla etkileş."></canvas>
    <div class="say" id="say" role="status"></div>
  </div>

  <div class="dock"><div class="dock-caption"><button id="inspectBtn" class="inspect on" type="button" aria-pressed="true">↔ İncele</button><span id="toolHint">Boş alanda sürükle, her tarafına bak.</span></div><div class="tools" id="toolbar" aria-label="Aletler"></div></div>
</div>

<div class="sheet" id="sheet" lang="tr" aria-live="polite">
  <div class="card">
    <h2 id="vtitle" class="good">Kurtarıldı!</h2>
    <div class="stars" id="stars"></div>
    <p id="vmsg"></p>
    <div class="acts">
      <button class="btn ghost" id="retryBtn" type="button">Tekrar Dene</button>
      <button class="btn go" id="nextBtn" type="button">Sonraki Bölüm</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================== math ===================== */
const W = 400, H = 520, TAU = Math.PI*2;
const BENCH = 486;
const dist  = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const norm  = a => { while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; };
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(ctx, x, y, w, h, r){
  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function drawScissors(x,y,size,col){
  ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap='round';
  for(const sy of [-1,1]){ctx.beginPath();ctx.ellipse(-9,sy*7,5,4,sy*.3,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(-5,sy*5);ctx.lineTo(13,-sy*8);ctx.stroke();}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,2,0,TAU);ctx.fill();ctx.restore();
}

/* ===================== audio ===================== */
const audio = (function(){
  let A = null, muted = false, noise = null;
  function get(){
    if(!A){ try{ A = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(A.state === 'suspended') A.resume();
    return A;
  }
  function nz(a){
    if(noise) return noise;
    const n = Math.floor(a.sampleRate*0.5);
    noise = a.createBuffer(1, n, a.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    return noise;
  }
  function t(type, f0, f1, dur, vol, delay){
    const a = muted ? null : get(); if(!a) return;
    const t0 = a.currentTime + (delay||0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  function burst(bp, q, dur, vol){
    const a = muted ? null : get(); if(!a) return;
    const t0 = a.currentTime;
    const s = a.createBufferSource(); s.buffer = nz(a);
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = bp; f.Q.value = q;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0); s.stop(t0+dur+0.05);
  }
  return {
    unlock(){ if(!muted) get(); },
    toggle(){ muted = !muted; return muted; },
    click(){ t('square', 1700, 1450, 0.032, 0.045); },
    tick(){ t('triangle', 880, 760, 0.05, 0.06); },
    pop(){ t('sine', 280, 720, 0.09, 0.15); },
    unstick(){ t('sine', 680, 200, 0.16, 0.16); },
    slice(){ burst(2600, 2.2, 0.11, 0.1); t('triangle', 1400, 820, 0.07, 0.05, 0.02); },
    clack(){ t('square', 420, 300, 0.05, 0.09); },
    snap(){ t('triangle', 1300, 500, 0.07, 0.12); },
    hiss(dur){ burst(1500, 0.7, dur||0.5, 0.07); },
    shock(){
      burst(900, 0.6, 0.3, 0.28);
      t('sawtooth', 130, 60, 0.26, 0.2);
      for(let i=0;i<5;i++) t('square', 2200+Math.random()*1800, 500, 0.05, 0.07, i*0.03);
    },
    thud(){ t('sine', 130, 60, 0.2, 0.28); burst(420, 0.8, 0.16, 0.16); },
    smash(){ burst(2600, 1.1, 0.5, 0.42); t('sine', 110, 50, 0.24, 0.3);
             for(let i=0;i<7;i++) t('triangle', 900+Math.random()*2400, 600, 0.11, 0.07, Math.random()*0.1); },
    nope(){ t('sine', 210, 175, 0.1, 0.07); },
    done(){ t('triangle', 860, 1300, 0.11, 0.1); },
    win(){ [523,659,880,1175].forEach((f,i)=>t('triangle', f, f, 0.25, 0.12, i*0.07)); },
    lose(){ t('sawtooth', 200, 90, 0.4, 0.1); }
  };
})();

/* ===================== particles ===================== */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let particles = [], shake = 0, flash = 0, flashCol = '255,248,238', freeze = 0;

function spark(x, y, n, col){
  for(let i=0;i<(reduced?Math.min(4,n):n);i++){
    const a = Math.random()*TAU, s = 60 + Math.random()*260;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-40, r:1.6+Math.random()*2.2,
      life:0, max:0.25+Math.random()*0.3, kind:'spark', col:col||'#ffe27a'});
  }
}
function puff(x, y, n, col){
  for(let i=0;i<(reduced?3:n);i++)
    particles.push({x, y, vx:(Math.random()*2-1)*46, vy:-16-Math.random()*40, r:6+Math.random()*12,
      life:0, max:0.45+Math.random()*0.4, kind:'dust', col:col||'#e8d9bf'});
}
function shardBurst(x, y, n, col){
  for(let i=0;i<(reduced?5:n);i++){
    const a = Math.random()*TAU, s = 90 + Math.random()*330;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-90, r:2+Math.random()*4.5,
      rot:Math.random()*TAU, rv:(Math.random()*2-1)*11,
      life:0, max:0.5+Math.random()*0.6, kind:'shard', col:col||'#dff1f2'});
  }
}
function sparkle(x, y, n){
  for(let i=0;i<(reduced?5:n);i++)
    particles.push({x:x+(Math.random()*2-1)*24, y:y+(Math.random()*2-1)*24,
      vx:(Math.random()*2-1)*40, vy:-40-Math.random()*70, r:2+Math.random()*2.6,
      life:0, max:0.5+Math.random()*0.5, kind:'star', col:'#ffd98a'});
}

/* ===================== canvas ===================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let dpr = 1, scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;
const theme = {wallA:'#f7eee1', wallB:'#ecdcc6', benchA:'#c99257', benchB:'#a9743f', benchDark:'#7d5228'};
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  const g = k => cs.getPropertyValue(k).trim();
  theme.wallA = g('--wall-a')||theme.wallA; theme.wallB = g('--wall-b')||theme.wallB;
  theme.benchA = g('--bench-a')||theme.benchA; theme.benchB = g('--bench-b')||theme.benchB;
  theme.benchDark = g('--bench-dark')||theme.benchDark;
}
function resize(){
  if(booted)cancelGesture();
  const r = stage.getBoundingClientRect();
  cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  scale = Math.min(cssW/W, cssH/H);
  offX = (cssW - W*scale)/2; offY = (cssH - H*scale)/2;

  if((cssW < 40 || cssH < 40) && !resize._r){
    resize._r = true; setTimeout(()=>{ resize._r = false; resize(); }, 250);
  }
}

/* ===================== turntable projection ===================== */
/* Components live at an azimuth on the shell. Only what faces you can be used,
   so the object has to be turned to be inspected. */
function proj(c){
  if(c.type==='rescue'&&c.free)return {x:c.fx,y:c.y,depth:1,scale:1,alpha:1,front:true};
  const d = c.az + rotY;
  const depth = Math.cos(d);
  const radius = c.rr != null ? c.rr : shell.rx;
  return {
    x: shell.cx + Math.sin(d)*radius,
    y: c.y,
    depth,
    scale: 0.72 + 0.28*Math.max(0, depth),
    alpha: clamp((depth + 0.28)/0.5, 0, 1),
    front: depth > 0.34
  };
}
function faceOf(c){ return proj(c); }

/* ===================== components ===================== */
function mk(def){
  const T = TYPE[def.type] || {};
  return Object.assign({
    done:false, prog:0, requires:[], tools:(T.tools||[]).slice(),
    shake:0, glow:0, az:0, y:300, gone:0
  }, def);
}
const byId = id => comps.find(c=>c.id===id) || null;
function locked(c){
  for(const id of c.requires){ const r = byId(id); if(r && !r.done) return true; }
  return false;
}
function accepts(c, t){ return c.tools.indexOf('hand')>=0 || c.tools.indexOf(t)>=0; }
function finish(c){
  if(c.done) return;
  c.done = true; c.prog = 1;
  audio.done(); puff(faceOf(c).x, c.y, 6);
  useful();
  c.completeAt=tNow;
  sparkle(faceOf(c).x,c.y,5);
  paintProgress();
  if(!c.auto&&c.type!=='rescue')say(({screw:'Vida çıktı.',sw:'Elektrik kesildi.',cable:'Kablo ayrıldı.',valve:'Basınç düştü.',panel:'Kapak açıldı.',strip:'Bant kesildi.',magpin:'Pim yerinde.',door:'Kapı açıldı.'})[c.type]||'Tamam!');
  comps.forEach(k=>{ if(k.auto && !k.done && !locked(k)) finish(k); });
}
function useful(){ lastUseful = tNow; hintShown = 0; hintTarget=null; hintUntil=0; }

/* ===================== consequences ===================== */
/* soft: nothing breaks · penalty: costs a pip · critical: level over */
function soft(c, msg){
  softMistakes++;
  if(c) c.shake = 1;
  audio.nope(); buzzTool();
  say(msg || 'Bu burada işe yaramaz.');
}
let lastPenalty = -9;
function penalty(msg, at){
  if(solved || failed) return;
  if(drag&&drag.penalized)return;
  if(tNow - lastPenalty < 0.9) return;   /* one mistake per action, not per frame */
  lastPenalty = tNow;
  if(drag)drag.penalized=true;
  strikes = Math.max(0, strikes - 1);
  paintPips();
  shake = Math.max(shake, 1.1);
  flash = Math.max(flash, 0.45); flashCol = '255,220,120';
  if(at) spark(at.x, at.y, 22, '#ffe27a');
  buzzTool();
  say(msg, true);
  if(strikes <= 0) fail('Çok fazla hata', 'Üç hakkın da bitti. Bölümü baştan al — bu sefer önce objeyi çevirip incele.');
}
function critical(title, msg, at){
  if(solved || failed) return;
  shake = Math.max(shake, 1.6);
  flash = Math.max(flash, 0.7); flashCol = '255,150,120';
  if(at) shardBurst(at.x, at.y, 26, '#dff1f2');
  audio.smash();
  fail(title, msg);
}
function buzzTool(){
  const b = toolbar.querySelector('.tool.on');
  if(!b) return;
  b.classList.remove('buzz');
  void b.offsetWidth;
  b.classList.add('buzz');
}

      g.addColorStop(0,'#e2e6eb'); g.addColorStop(.5,'#a6adb6'); g.addColorStop(1,'#767d87');
      ctx.fillStyle=g;
      ctx.beginPath(); rr(ctx,-4.5,-12,9,24,4); ctx.fill();
      ctx.fillStyle='#c3c9d1';

    }
  },

  /* sensitive electronics — the magnet must stay away from this */
  chip:{
    tools:[], hitR:24,
    draw(c,f){
      ctx.translate(f.x, c.y); ctx.scale(f.scale,f.scale);
      ctx.fillStyle = c.fried > 0 ? '#8a5a5a' : '#4a5560';
      ctx.beginPath(); rr(ctx,-15,-11,30,22,4); ctx.fill();
      ctx.strokeStyle='#2f3840'; ctx.lineWidth=1.2; ctx.stroke();
      const blink = c.fried > 0 ? (Math.sin(tNow*24)>0) : (Math.sin(tNow*3)>0.2);
      ctx.fillStyle = c.fried > 0 ? '#ff6a58' : (blink ? '#6fd3a0' : '#33604a');
      ctx.beginPath(); ctx.arc(0,0,3.4,0,TAU); ctx.fill();

      for(let i=-1;i<=1;i++){
        ctx.beginPath(); ctx.moveTo(-15, i*7); ctx.lineTo(-20, i*7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15, i*7); ctx.lineTo(20, i*7); ctx.stroke();
      }
    }
  },

  /* door — swings open once unlocked */
  door:{
    tools:['hand'],
    hit(c,p,f){ return f.front && Math.abs(p.x-f.x) < c.w/2+10 && Math.abs(p.y-c.y) < c.h/2+8; },
    move(c,g){
      c.ang = clamp(c.ang + g.dx/90, 0, 1.2);
      if(c.ang > 0.9) finish(c);
    },
    draw(c,f){
      ctx.translate(f.x - c.w/2, c.y); ctx.rotate(c.ang);
      ctx.fillStyle='rgba(190,225,230,.3)';
      ctx.beginPath(); rr(ctx,0,-c.h/2,c.w,c.h,6); ctx.fill();
      ctx.strokeStyle='#8b939c'; ctx.lineWidth=4;
      ctx.beginPath(); rr(ctx,2,-c.h/2+2,c.w-4,c.h-4,5); ctx.stroke();
    }
  },

  /* the thing being saved */
  rescue:{
    tools:['hand'],
    hit(c,p,f){ return (c.free||f.front) && dist(p,{x:(c.free?c.fx:f.x)+0, y:c.y+(c.oy||0)}) < 30; },
    start(c){ c.held = true; if(!c.free){ const x=faceOf(c).x;c.free = true; c.fx = x; } useful(); },
    move(c,g){ c.fx += g.dx; c.oy = (c.oy||0) + g.dy; },
    end(c){
      c.held = false;
      const p = {x:c.fx, y:c.y+(c.oy||0)};
      if(p.y > BENCH + 40){ critical('Düştü', 'Kurtardığın şey tezgâhtan düştü. Bir dahakine mindere bırak.', p); return; }
      if(dist(p, level.mat) < 42){ finish(c); win(); }
    },
    draw(c,f){
      const x = c.free ? c.fx : f.x, y = c.y + (c.oy||0);
      ctx.translate(x, y);
      if(c.held) ctx.scale(1.08,1.08); else ctx.scale(f.scale, f.scale);
      const worry = solved ? 0 : Math.sin(tNow*4)*2;
      ctx.translate(0, solved ? -Math.abs(Math.sin(tNow*9))*7 : worry);
      (ART[c.art]||ART.gem)(c);
    }
  }
};

/* ===================== level lifecycle ===================== */
function buildLevel(i){
  clearTimeout(resultTimer);clearTimeout(sayT);
  resultTimer=0;hintTarget=null;hintUntil=0;toolFx=null;activePointer=null;
  softMistakes=0;startedAt=tNow;
  lvIndex = clamp(i, 0, LEVELS.length-1);
  level = LEVELS[lvIndex];
  shell = level.shell;
  comps = level.build();
  comps.forEach(c=>{ if(c.auto && !locked(c)) c.done = true; });
  rotY = 0; rotVel = 0;
  strikes = 3; solved = false; failed = false; lastPenalty = -9;
  particles = []; shake = 0; flash = 0; freeze = 0;
  tool = null; drag = null; magnetAt = null;
  lastUseful = tNow; hintShown = 0;
  sheet.classList.remove('show');
  lvTag.textContent = 'Bölüm ' + (lvIndex+1);
  objectiveEl.textContent = level.objective;
  paintPips(); paintTools();
  paintProgress();
  document.getElementById('chapter').textContent=LEVEL_NAMES[lvIndex]+' · '+(lvIndex+1)+' / '+LEVELS.length;
  rotatedOnce = false;
  say(lvIndex===0?'Öndeki vidayla başla.':'Çevir, incele, güvenle kurtar.');
}
let rotatedOnce = false;
function win(){
  if(solved || failed) return;
  solved = true;
  sparkle(level.mat.x, level.mat.y, 20);
  audio.win();
  resultTimer=setTimeout(()=>{
    vtitle.textContent = 'Kurtarıldı!'; vtitle.className = 'good';
    vmsg.textContent = WIN[lvIndex];
    const stars=strikes===3?(softMistakes===0?3:2):1;
    document.getElementById('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
    vmsg.textContent+=(stars===3?' Kusursuz kurtarma!':strikes===3?' Ceza almadan tamamladın!':' Bir dahaki sefer daha da özenli.');
    nextBtn.textContent = lvIndex === LEVELS.length-1 ? 'Baştan Başla' : 'Sonraki Bölüm';
    nextBtn.style.display = '';
    sheet.classList.add('show');
  }, 560);
}

    sheet.classList.add('show');
  }, 620);
}

/* ===================== input ===================== */
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left - offX)/scale, y:(e.clientY - r.top - offY)/scale};
}
function pick(p){
  let best = null, bestDepth = -2;
  for(const c of comps){
    if(c.done || c.hidden || c.noPick) continue;
    const T = TYPE[c.type], f = faceOf(c);
    const hit = T.hit ? T.hit(c,p,f)
                      : (f.front && dist(p,{x:f.x,y:c.y}) < Math.max(T.hitR||24,22/scale));
    if(hit && f.depth > bestDepth){ best = c; bestDepth = f.depth; }
  }
  return best;
}
function onDown(e){
  if(solved || failed || activePointer!==null || e.isPrimary===false) return;
  activePointer=e.pointerId;
  rotVel=0;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  audio.unlock();
  const p = toWorld(e);
  if(tool)toolFx={tool,x:p.x,y:p.y,life:.24};
  drag = {p, start:p, moved:0, comp:null, rotating:false, tapped:false};

  if(tool === 'magnet'){ magnetAt = p; checkChip(p); return; }

  const c = pick(p);
  if(!c){
    /* no tool: drag anywhere turns the object. Tool in hand: the object surface
       belongs to the tool, so turning is done on the background around it. */
    const onShell = Math.abs(p.x - shell.cx) < shell.w/2 + 16 &&
                    Math.abs(p.y - shell.cy) < shell.h/2 + 16;
    drag.rotating = !tool || !onShell;
    return;
  }

  /* hammer is a risk, not a key */
  if(tool === 'hammer'){
    freeze=reduced?0:.055;shake=Math.max(shake,reduced?0:.35);audio.thud();
    if(c.glass || c.type === 'rescue'){
      critical('Kırdın', 'Çekici kırılgan bir parçanın üstünde kullandın. Bu oyunda çekiç her kapıyı açmaz.',
               {x:faceOf(c).x, y:c.y});
      return;
    }
    soft(c, 'Çekiç burada işe yaramaz.');
    return;
  }
  if(!accepts(c, tool)){ soft(c, tool ? 'Bu burada işe yaramaz.' : 'Önce bir alet seç.'); return; }
  if(locked(c)){ soft(c, c.lockMsg || 'Burası henüz açılmıyor.'); return; }

  drag.comp = c;
  const T = TYPE[c.type];
  if(T.start) T.start(c, {p});
}
function onMove(e){
  if(!drag || solved || failed || e.pointerId!==activePointer) return;
  e.preventDefault();
  const p = toWorld(e);
  if(toolFx){toolFx.x=p.x;toolFx.y=p.y;toolFx.life=.24;}
  const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
  drag.moved += Math.hypot(dx,dy);

  if(tool === 'magnet'){ magnetAt = p; drag.p = p; checkChip(p); return; }
  /* the cutter sweeps: the stroke does not have to begin on the cable.
     If it actually crosses something, that drag stops being a rotation. */
  if(tool === 'cutter'){
    let acted = false;
    for(const c of comps){
      if(c.done || c.hidden) continue;
      if(c.type !== 'cable' && c.type !== 'strip') continue;
      const f = faceOf(c);
      const samples=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
      let crossed=false;
      for(let i=0;i<=samples;i++)if(TYPE[c.type].hit(c,{x:lerp(drag.p.x,p.x,i/samples),y:lerp(drag.p.y,p.y,i/samples)},f)){crossed=true;break;}
      if(!crossed)continue;
      acted = true;
      if(locked(c)){ soft(c, c.lockMsg); continue; }
      TYPE[c.type].cut(c);
    }
    if(acted){ drag.rotating = false; drag.p = p; return; }
  }
  if(drag.rotating){
    rotY += dx*0.016;
    rotVel = dx*0.002;
    drag.p = p;
    return;
  }
  const c = drag.comp;
  if(c && !c.done && TYPE[c.type].move) TYPE[c.type].move(c, {p, dx, dy});
  drag.p = p;
}
let activePointer=null;
function onUp(e){
  if(e&&e.pointerId!==activePointer)return;
  activePointer=null;
  magnetAt = null;
  comps.forEach(c=>{ c.zapped = false; });
  if(!drag) return;
  const c = drag.comp;
  if(c && !c.done){
    const T = TYPE[c.type];
    if(drag.moved < 8 && T.tap) T.tap(c);
    else if(T.end) T.end(c);
  }
  drag = null;
}
function cancelGesture(e){
  if(e&&e.pointerId!=null&&e.pointerId!==activePointer)return;
  if(drag&&drag.comp){const c=drag.comp;if(c.type==='panel')TYPE.panel.end(c);if(c.type==='rescue')c.held=false;}
  activePointer=null;drag=null;magnetAt=null;rotVel=0;toolFx=null;
  comps.forEach(c=>c.zapped=false);
}
function checkChip(p){
  for(const c of comps){
    if(c.type !== 'chip') continue;
    const f = faceOf(c);
    if(f.depth < -0.2) continue;          /* a chip at the silhouette edge is still close by */
    if(dist(p, {x:f.x, y:c.y}) < 46 && c.fried <= 0){
      c.fried = 2.2;
      penalty('Mıknatıs devreye çok yaklaştı!', {x:f.x, y:c.y});
    }
  }
}

/* ===================== update ===================== */
function update(dt){
  tNow += dt;
  if(freeze > 0){ freeze -= dt; dt = 0; }

  if(Math.abs(rotY) > 0.35) rotatedOnce = true;
  if(!drag || !drag.rotating){
    rotY += rotVel*dt*60;
    rotVel *= Math.pow(0.02, dt);
    if(Math.abs(rotVel) < 0.0004) rotVel = 0;
  }

  if(dt > 0){
    if(toolFx){toolFx.life-=dt;if(toolFx.life<=0)toolFx=null;}
    if(magnetAt){
      for(const c of comps){
        if(c.done || c.type !== 'magpin' || locked(c)) continue;
        const f = faceOf(c);
        if(f.front) TYPE.magpin.pull(c, magnetAt, dt, f);
      }
    }
    for(const c of comps){
      c.shake *= Math.pow(0.002, dt);
      if(c.done && c.gone < 1) c.gone = Math.min(1, c.gone + dt*2.2);
      if(c.fried > 0) c.fried -= dt;
      const want = (tool && accepts(c,tool) && !c.done && !locked(c) && faceOf(c).front) ? 1 : 0;
      c.glow += (want - c.glow)*Math.min(1, dt*7);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.life += dt;
    if(q.life >= q.max){ particles.splice(i,1); continue; }
    q.vy += (q.kind==='dust' ? 40 : q.kind==='star' ? 30 : 900)*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    if(q.rv) q.rot += q.rv*dt;
    if(q.kind==='dust') q.r += dt*22;
  }
  shake *= Math.pow(0.004, dt);
  if(shake < 0.002) shake = 0;
  flash *= Math.pow(0.0009, dt);

  /* hint after a quiet spell */
  if(!solved && !failed && !drag && tNow - lastUseful > 10 && tNow>hintUntil+6){
    hintShown++;
    const n = nextStep();
    if(n){
      const f = faceOf(n);
      hintTarget=n.id;hintUntil=tNow+3;
      if(!f.front){say('Bir de diğer tarafına bak.');document.getElementById('inspectBtn').classList.add('hinted');}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const sx = shake ? (Math.random()*2-1)*7*shake : 0;
  const sy = shake ? (Math.random()*2-1)*7*shake : 0;
  ctx.save();
  ctx.translate(offX + sx*scale, offY + sy*scale);
  ctx.scale(scale, scale);

  drawRoom();
  drawMat();
  drawShell();
  if(!rotatedOnce) drawTurnHint();
  if(hintTarget&&tNow<hintUntil&&!faceOf(byId(hintTarget)).front&&rotatedOnce)drawTurnHint();

  /* back-facing parts first, then the shell body already drawn, then front parts */
  const order = comps.slice().sort((a,b)=>faceOf(a).depth - faceOf(b).depth);
  for(const c of order){
    if(c.hidden) continue;
    if(c.done && c.gone >= 1 && c.type !== 'rescue') continue;
    const f = faceOf(c);
    if(f.alpha <= 0.02) continue;
    ctx.save();
    ctx.globalAlpha = f.alpha;
    if(c.shake > 0.01) ctx.translate(Math.sin(tNow*52)*c.shake*4, 0);
    if(c.glow > 0.02 && !c.done) drawGlow(c, f);
    ctx.save();TYPE[c.type].draw(c, f);ctx.restore();
    drawPartFeedback(c,f);
    ctx.restore();
  }

  if(level.gauge) drawGauge();
  drawParticles();
  if(magnetAt) drawMagnet();
  drawToolFeedback();
  ctx.restore();

  if(flash > 0.01){
    ctx.fillStyle = 'rgba('+flashCol+','+(flash*0.5)+')';
    ctx.fillRect(0,0,cssW,cssH);
  }
}

function shadeCol(hex, amt){
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const f = v => clamp(Math.round(amt>0 ? v + (255-v)*amt : v*(1+amt)), 0, 255);
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function hexA(hex, a){
  if(!hex || hex[0] !== '#') return 'rgba(230,222,208,'+a+')';
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

  if(!msg) return;
  sayEl.textContent = msg;
  sayEl.classList.toggle('bad', !!bad);
  sayEl.classList.add('show');
  clearTimeout(sayT);
  sayT = setTimeout(()=>sayEl.classList.remove('show'), bad ? 2400 : 1800);
}
function paintPips(){
  pipsEl.setAttribute('aria-label',strikes+' hata hakkı kaldı');
  pipsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const d = document.createElement('div');
    d.className = 'pip' + (i < strikes ? '' : ' gone');
    pipsEl.appendChild(d);
  }
}
function paintTools(){
  toolbar.innerHTML = '';
  TOOLS.filter(t=>!level||LEVEL_TOOLS[lvIndex].includes(t.id)).forEach(t=>{
    const b = document.createElement('button');
    b.type='button';
    b.setAttribute('data-tool',t.id);
    b.setAttribute('aria-label',t.label);
    b.className = 'tool' + (tool===t.id ? ' on' : '');
    b.style.setProperty('--tc','var('+t.css+')');
    b.setAttribute('aria-pressed', String(tool===t.id));
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
      'stroke-linecap="round" stroke-linejoin="round">'+TOOL_ICON[t.id]+'</svg><span>'+t.label+'</span>';
    b.addEventListener('click', ()=>{ cancelGesture();tool = (tool===t.id)?null:t.id; audio.unlock();audio.click(); paintTools(); });
    toolbar.appendChild(b);
  });
  document.getElementById('toolHint').textContent=TOOL_HELP[tool]||'Boş alanda sürükle, her tarafına bak.';
  const b=document.getElementById('inspectBtn');b.classList.toggle('on',!tool);b.setAttribute('aria-pressed',String(!tool));
}
function paintProgress(){
  const steps=comps.filter(c=>!c.noPick&&c.type!=='chip');
  const complete=steps.filter(c=>c.done).length;
  document.getElementById('progressFill').style.width=(complete/Math.max(1,steps.length)*100)+'%';
  document.getElementById('progressText').textContent=complete+' / '+steps.length+' adım';
}
document.getElementById('inspectBtn').addEventListener('click',()=>{cancelGesture();tool=null;paintTools();});

cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', cancelGesture);
window.addEventListener('blur',cancelGesture);
cv.addEventListener('lostpointercapture',cancelGesture);
stage.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

btnReset.addEventListener('click', ()=>buildLevel(lvIndex));
retryBtn.addEventListener('click', ()=>{ sheet.classList.remove('show'); buildLevel(lvIndex); });
nextBtn.addEventListener('click', ()=>{
  sheet.classList.remove('show');
  buildLevel(solved ? (lvIndex+1)%LEVELS.length : lvIndex);
});
btnSnd.addEventListener('click', ()=>{
  const m = audio.toggle();
  btnSnd.setAttribute('aria-pressed', String(m));
  btnSnd.setAttribute('aria-label', m?'Sesi aç':'Sesi kapat');
  document.getElementById('sndWave').style.opacity = m?'0.22':'1';
});

/* ===================== loop ===================== */
let last = performance.now(), lastRaf = 0, fallbackTimer = 0, frameCount = 0;
function tick(now){
  const dt = Math.min(0.032, (now-last)/1000);
  last = now; frameCount++;
  update(dt); render();
}
function frame(now){ lastRaf = performance.now(); tick(now); requestAnimationFrame(frame); }
function startLoop(){
  render();
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if(typeof setInterval === 'function' && !fallbackTimer)
    fallbackTimer = setInterval(()=>{ if(performance.now()-lastRaf > 200) tick(performance.now()); }, 33);
}

/* ===================== test hooks ===================== */
window.__RW = {
  go: buildLevel,
  cancel:cancelGesture,
  pointer(phase,p,id=1){raw({down:onDown,move:onMove,up:onUp,cancel:cancelGesture}[phase],p,id);},
  levels: LEVELS.length,
  pick(t){ tool = t; paintTools(); return tool; },
  spin(rad){ rotY += rad; rotVel = 0; },
  setRot(rad){ rotY = rad; rotVel = 0; },
  step(dt,n){ for(let i=0;i<(n||1);i++) update(dt||1/60); },
  at(id){ const c = byId(id); if(!c) return null; const f = faceOf(c); return {x:f.x, y:c.y, front:f.front, depth:+f.depth.toFixed(2)}; },
  gesture(pts, opt){
    opt = opt||{};
    raw(onDown, pts[0]);
    for(let i=1;i<pts.length;i++){ raw(onMove, pts[i]); if(opt.step) update(1/60); }
    onUp();
    return this.info;
  },
  swipe(a,b,n,opt){
    const pts=[]; const k=n||12;
    for(let i=0;i<k;i++){ const t=i/(k-1); pts.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); }
    return this.gesture(pts,opt);
  },
  hold(p,frames){
    raw(onDown,p);
    for(let i=0;i<(frames||60);i++){ raw(onMove,p); update(1/60); }
    onUp();
    return this.info;
  },
  tap(p){ raw(onDown,p); onUp(); return this.info; },
  get info(){
    return {
      level: lvIndex+1, tool, solved, failed, strikes, frames: frameCount,
      hint:hintTarget, hintActive:tNow<hintUntil, softMistakes, dragging:!!drag, particles:particles.length,
      rot:+rotY.toFixed(2),
      comps: comps.map(c=>({id:c.id, type:c.type, done:c.done, prog:+(c.prog||0).toFixed(2),
        locked:locked(c), front:faceOf(c).front, on:c.on, slide:c.slide!=null?Math.round(c.slide):undefined,
        fried:c.fried>0})),
      say: sayEl.textContent,
      verdict: sheet.classList.contains('show') ? vtitle.textContent : null
    };
  }
};
function raw(fn, p, id=1){
  const r = cv.getBoundingClientRect();
  fn({clientX:r.left+offX+p.x*scale, clientY:r.top+offY+p.y*scale, pointerId:id,isPrimary:id===1, preventDefault(){}});
}

/* ===================== boot ===================== */
let booted = false;
function start(data){
  if(booted) return;
  booted = true;
  resize();
  paintTools();
  const linkedLevel=/[?&]bolum=(\d+)/.exec(window.location?.search||'');
  buildLevel(data && typeof data.level === 'number' ? data.level : linkedLevel?Number(linkedLevel[1])-1:0);
  startLoop();
}
(function boot(){
  let hot = null;
  try{ hot = window.claude && window.claude.hot; }catch(e){}
  try{ if(hot && typeof hot.snapshot === 'function') hot.snapshot(()=>({level:lvIndex})); }catch(e){}
  try{
    if(hot && typeof hot.ready === 'function'){
      hot.ready(d=>start(d||{}));
      setTimeout(()=>start((hot&&hot.data)||{}), 500);
      return;
    }
  }catch(e){}
  start((hot&&hot.data)||{});
})();
})();
